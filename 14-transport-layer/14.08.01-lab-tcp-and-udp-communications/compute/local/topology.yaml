    - title: "Начальное состояние"
      body: |
        - На сервере MultiServer задан IP-адрес по таблице адресации и включены веб-служба (HTTP) и служба DNS. Веб-служба отдает страницу index.html, а в службе DNS есть запись типа A для имени multiserver.nsalab.local.
        - На компьютерах заданы IP-адреса и маски подсети по таблице адресации, а DNS-сервером указан MultiServer. Шлюз по умолчанию не задан: все устройства находятся в одной сети 192.168.1.0/24.
        - Коммутатор Switch работает с настройками по умолчанию.
        - Служб FTP и электронной почты в симуляторе пока нет, поэтому компьютеры FTP-Client и E-Mail-Client только присутствуют на схеме, а шаги с ними в этой лабораторной работе не выполняются.
        - Настраивать в этой лабораторной работе ничего не нужно: вы наблюдаете, как устройства обмениваются данными.

        **Шаг 1.** Откройте окно сервера MultiServer и на вкладке «Рабочий стол» запустите приложение «Командная строка». Отправьте один эхо-запрос на широковещательный адрес сети командой **ping -n 1 192.168.1.255**. На эхо-запрос отвечают компьютеры сети, и команда выводит первый полученный ответ.

        ```
        C:\>ping -n 1 192.168.1.255

        Pinging 192.168.1.255 with 32 bytes of data:

        Reply from 192.168.1.1: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.1.255:
            Packets: Sent = 1, Received = 1, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Примечание.** Перед ответом на эхо-запрос каждый компьютер определяет MAC-адрес сервера по протоколу ARP, а сервер запоминает MAC-адрес компьютера. Поэтому дальше, в режиме «Симуляция», PDU протоколов HTTP и DNS отправляются сразу, без ARP-запросов, и в списке событий остается только обмен, который изучается в этой лабораторной работе.
    - title: "Наблюдение за мультиплексированием"
      body: |
        **Шаг 1.** Нажмите «Симуляция» вверху страницы. Под схемой откроется панель «Симуляция» со списком событий. Время в сети остановится: каждое следующее событие выполняется по кнопке «Шаг».

        **Шаг 2.** Нажмите кнопку «Фильтры» на панели «Симуляция»: откроется окно «Фильтры событий». Нажмите в нем «Все» и закройте окно кнопкой «Закрыть» (×). Надпись на кнопке сменится на «Фильтры · все»: в списке и на схеме будут видны события всех протоколов.

        **Шаг 3.** Откройте окно компьютера HTTP-Client и на вкладке «Рабочий стол» запустите приложение «Веб-браузер». Введите в адресной строке **192.168.1.254** и нажмите «Перейти». Над компьютером HTTP-Client появится конверт, а в списке событий — строка «TCP SYN 49152 → 192.168.1.254:80 · в F0». Веб-браузер ждет ответа сервера.

        **Шаг 4.** Откройте окно компьютера DNS-Client и в приложении «Командная строка» запросите IP-адрес имени multiserver.nsalab.local командой **nslookup multiserver.nsalab.local**. В списке событий появится строка «DNS-запрос multiserver.nsalab.local · в F0». Команда выводит адрес DNS-сервера и ждет ответа.

        **Шаг 5.** Нажмите «Шаг» два раза. Кадры обоих компьютеров дойдут до коммутатора Switch: в столбце «Что происходит» — «кадр в F0/1 → F0/5» для кадра от HTTP-Client и «кадр в F0/4 → F0/5» для кадра от DNS-Client. Коммутатор отправляет оба кадра к серверу MultiServer через один и тот же порт F0/5.

        **Шаг 6.** Нажмите «Шаг» еще шесть раз. Сервер MultiServer по очереди принимает сегмент TCP от HTTP-Client и DNS-запрос от DNS-Client и отвечает на оба, а коммутатор возвращает ответы через порты F0/1 и F0/4. Компьютер DNS-Client получает ответ («DNS-ответ multiserver.nsalab.local · принят»), и команда **nslookup** выводит его.

        ```
        C:\>nslookup multiserver.nsalab.local
        Server:  UnKnown
        Address:  192.168.1.254

        Name:    multiserver.nsalab.local
        Address:  192.168.1.254
        ```

        **Шаг 7.** Сравните цвет квадрата в столбце «Тип» у строк TCP и DNS и цвет конвертов на схеме. Ответьте на вопрос 1 в форме ответов.

        **Примечание.** Данные двух приложений, веб-браузера и команды nslookup, передаются по одной сети и по одному кабелю к серверу вперемежку: это мультиплексирование. По номеру порта назначения сервер определяет, какой службе передать данные, а по номеру порта источника в ответе компьютер находит приложение, которое этот ответ ждет.

        **Шаг 8.** Нажмите «Шаг» еще десять раз, пока кнопка «Шаг» не станет недоступной. Компьютер HTTP-Client отправляет запрос веб-страницы («HTTP GET / → 192.168.1.254:80 · ответ в F0» на сервере MultiServer) и получает ее («HTTP 200 → 192.168.1.1:49152 · принят»). Затем сервер закрывает соединение: строки «TCP FIN-ACK …» и «TCP ACK …».

        **Примечание.** Веб-браузер ждет страницу не дольше 30 секунд реального времени. В режиме «Симуляция» время в сети идет только по кнопке «Шаг», поэтому, если до конца списка вы дошли позже, браузер покажет «Страница не открылась» и «Код: время ожидания истекло», хотя ответ сервера есть в списке событий. В режиме «Лаборатория» страница открывается сразу.
    - title: "Изучение TCP в обмене HTTP"
      body: |
        **Шаг 1.** Нажмите кнопку «Сбросить» (↺) справа на панели «Симуляция»: список событий очистится, а время симуляции вернется к нулю («Время сим. 0.000 с · событий 0»).

        **Шаг 2.** Нажмите «Фильтры» и в окне «Фильтры событий» нажмите «Ничего». Затем выберите протоколы HTTP и TCP и закройте окно. Надпись на кнопке сменится на «Фильтры · HTTP, TCP»: в списке и на схеме останутся только события HTTP и TCP.

        **Примечание.** Фильтр меняет только то, что видно в списке и на схеме: скрытые события по-прежнему идут по сети, и кнопка «Шаг» выполняет их так же, как видимые.

        **Шаг 3.** В приложении «Веб-браузер» компьютера HTTP-Client снова откройте адрес **192.168.1.254**: введите его в адресной строке и нажмите «Перейти». В списке событий появится строка «TCP SYN 49153 → 192.168.1.254:80 · в F0». Каждое новое соединение компьютер открывает со следующего номера порта источника, поэтому, если вы отправляли дополнительные запросы, номер порта будет больше.

        **Шаг 4.** Нажимайте «Шаг», пока в списке не появится первое событие с типом HTTP: строка «кадр в F0/1 → F0/5» на коммутаторе Switch, в столбце «Откуда» — HTTP-Client. Для этого понадобится шесть нажатий; до этого события в списке только события TCP.

        **Шаг 5.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 6.** Щелкните цветной квадрат в столбце «Тип» первой строки списка («TCP SYN 49153 → 192.168.1.254:80 · в F0»). Справа от схемы откроется вкладка «PDU · TCP» с PDU, которое подготовил компьютер HTTP-Client. Откройте на ней вкладку «Исходящий PDU» и найдите разделы «IPv4» и «TCP». Значение 0x06 (TCP) поля «Протокол» в разделе «IPv4» показывает, что пакет несет сегмент TCP.

        **Шаг 7.** Ответьте на вопросы 3 и 4 в форме ответов.

        **Шаг 8.** Найдите в разделе «TCP» поле «Флаги»: в нем названы TCP-флаги, установленные в этом сегменте.

        **Примечание.** Каждый флаг занимает в заголовке TCP один бит, и в одном сегменте можно установить несколько флагов: тогда окно PDU перечисляет их через дефис, например SYN-ACK. Назначение флагов показано в таблице.

        | Флаг | Назначение |
        |---|---|
        | URG | в сегменте есть срочные данные |
        | ACK | поле «Номер подтверждения» действительно |
        | PSH | данные нужно сразу передать приложению |
        | RST | сброс соединения |
        | SYN | синхронизация номеров последовательности при установлении соединения |
        | FIN | у отправителя больше нет данных, соединение завершается |

        **Шаг 9.** Ответьте на вопрос 5 в форме ответов.

        **Шаг 10.** Щелкните цветной квадрат события TCP, в котором ответ сервера дошел до компьютера HTTP-Client: строка «TCP SYN-ACK 80 → 192.168.1.1:49153 · ответ в F0», в столбце «Где» — HTTP-Client. Вкладка PDU покажет это событие. Откройте вкладку «Входящий PDU» и найдите раздел «TCP».

        **Шаг 11.** Ответьте на вопрос 6 в форме ответов.

        **Шаг 12.** Щелкните цветной квадрат первого события с типом HTTP (строка «кадр в F0/1 → F0/5» на коммутаторе Switch, в столбце «Откуда» — HTTP-Client). Это первый PDU сеанса HTTP: запрос веб-страницы, который компьютер HTTP-Client отправил серверу MultiServer. Откройте вкладку «Исходящий PDU» и сравните раздел «TCP» с разделами «TCP» двух предыдущих PDU. Найдите раздел, который следует за разделом «TCP».

        **Шаг 13.** Ответьте на вопрос 7 в форме ответов.

        **Шаг 14.** Нажмите «Шаг» еще восемь раз, пока кнопка «Шаг» не станет недоступной. Компьютер HTTP-Client получает веб-страницу («HTTP 200 → 192.168.1.1:49153 · принят»), а затем сервер закрывает соединение. Если с шага 3 прошло больше 30 секунд, веб-браузер покажет «Страница не открылась»: причина описана в примечании на странице «Наблюдение за мультиплексированием».
    - title: "Изучение UDP в обмене DNS"
      body: |
        **Шаг 1.** Нажмите кнопку «Сбросить» (↺) на панели «Симуляция».

        **Шаг 2.** Нажмите «Фильтры» и в окне «Фильтры событий» нажмите «Ничего». Затем выберите протоколы DNS и UDP и закройте окно. Надпись на кнопке сменится на «Фильтры · DNS, UDP».

        **Шаг 3.** В приложении «Командная строка» компьютера DNS-Client снова выполните команду **nslookup multiserver.nsalab.local**. Над компьютером DNS-Client появится конверт, а в списке событий — строка «DNS-запрос multiserver.nsalab.local · в F0».

        **Шаг 4.** Щелкните конверт над компьютером DNS-Client или цветной квадрат этой строки: откроется вкладка «PDU · DNS». На вкладке «Модель OSI» в столбце «Выход ↓ (сверху вниз)» показаны уровни, на которых компьютер DNS-Client готовит PDU. Найдите в этом столбце уровень 4 (L4).

        **Шаг 5.** Ответьте на вопрос 8 в форме ответов.

        **Шаг 6.** Откройте вкладку «Исходящий PDU» и найдите раздел «UDP». Сравните его поля с полями раздела «TCP» на странице «Изучение TCP в обмене HTTP». Значение 0x11 (UDP) поля «Протокол» в разделе «IPv4» показывает, что пакет несет датаграмму UDP.

        **Шаг 7.** Ответьте на вопрос 9 в форме ответов.

        **Шаг 8.** Нажмите «Шаг» четыре раза, пока кнопка «Шаг» не станет недоступной. Ответ сервера дойдет до компьютера DNS-Client («DNS-ответ multiserver.nsalab.local · принят»), и команда **nslookup** выведет его.

        ```
        C:\>nslookup multiserver.nsalab.local
        Server:  UnKnown
        Address:  192.168.1.254

        Name:    multiserver.nsalab.local
        Address:  192.168.1.254
        ```

        **Шаг 9.** Щелкните цветной квадрат последней строки списка («DNS-ответ multiserver.nsalab.local · принят»), откройте вкладку «Входящий PDU» и найдите раздел «UDP».

        **Шаг 10.** Ответьте на вопрос 10 в форме ответов.

        **Шаг 11.** Найдите на той же вкладке последний раздел PDU и его поле «Ответы».

        **Шаг 12.** Ответьте на вопрос 11 в форме ответов.
    - title: "Проверка результатов"
      body: |
        **Шаг 1.** Нажмите «Лаборатория» вверху страницы. Панель «Симуляция» закроется, и время в сети снова пойдет.

        **Шаг 2.** В приложении «Веб-браузер» компьютера HTTP-Client откройте адрес **192.168.1.254**. Страница откроется сразу: в окне браузера появятся заголовок «MultiServer» и текст «Веб-служба MultiServer: эта страница пришла по HTTP поверх TCP, порт 80.»

        **Примечание.** Службам на сервере назначены хорошо известные номера портов от 0 до 1023, и по порту назначения сервер передает данные нужной службе. Клиент выбирает порт источника из динамического диапазона от 49152 до 65535, поэтому в этой лабораторной работе компьютеры использовали порты 49152 и 49153. Часть хорошо известных портов показана в таблице.

        | Порт | Транспортный протокол | Протокол приложения | Назначение |
        |---|---|---|---|
        | 20, 21 | TCP | FTP | передача файлов |
        | 22 | TCP | SSH | защищенный удаленный доступ |
        | 23 | TCP | Telnet | удаленный доступ |
        | 25 | TCP | SMTP | отправка электронной почты |
        | 53 | UDP, TCP | DNS | преобразование имен в IP-адреса |
        | 67, 68 | UDP | DHCP | автоматическая настройка IP-адресов |
        | 69 | UDP | TFTP | простая передача файлов |
        | 80 | TCP | HTTP | веб-страницы |
        | 110 | TCP | POP3 | получение электронной почты |
        | 143 | TCP | IMAP | получение электронной почты |
        | 443 | TCP | HTTPS | защищенные веб-страницы |

        **Шаг 3.** Ответьте на вопрос 12 в форме ответов.
