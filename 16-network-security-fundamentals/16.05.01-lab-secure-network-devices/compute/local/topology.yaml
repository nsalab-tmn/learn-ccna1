scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | RTR-A | G0/0/0 | SW-1 | G0/1 |
        | Медный | RTR-A | G0/0/1 | SW-2 | G0/1 |
        | Медный | PC | F0 | SW-1 | F0/2 |
        | Медный | Laptop | F0 | SW-1 | F0/10 |
        | Медный | Remote-PC | F0 | SW-2 | F0/2 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | RTR-A | G0/0/0 | 192.168.1.1 | 255.255.255.0 | — |
        | RTR-A | G0/0/1 | 192.168.2.1 | 255.255.255.0 | — |
        | SW-1 | VLAN 1 | 192.168.1.254 | 255.255.255.0 | ? |
        | PC | NIC | 192.168.1.2 | 255.255.255.0 | 192.168.1.1 |
        | Laptop | NIC | 192.168.1.10 | 255.255.255.0 | 192.168.1.1 |
        | Remote-PC | NIC | 192.168.2.10 | 255.255.255.0 | 192.168.2.1 |

        Шлюз по умолчанию коммутатора SW-1 в документации не указан: он отмечен знаком «?», и определить его просит Требование 1.

        Учетные данные, которые нужно задать на обоих устройствах:

        | Параметр | Значение |
        |---|---|
        | Пароль консольной линии маршрутизатора | @Cons1234! |
        | Пароль привилегированного режима EXEC коммутатора | @Cons1234! |
        | Учетная запись | NETadmin, пароль LogAdmin!9 |
        | Имя домена для SSH | security.com |
    - title: "Начальное состояние"
      body: |
        - Интерфейсы маршрутизатора RTR-A настроены по таблице адресации, и он передает пакеты между сетями 192.168.1.0/24 и 192.168.2.0/24. Остальные параметры маршрутизатора — по умолчанию: имя устройства не задано (приглашение Router>), паролей нет, и любой, кто откроет его консоль, сразу получает доступ ко всем командам.
        - Коммутатор SW-1 работает с параметрами по умолчанию: имя устройства не задано (приглашение Switch>), интерфейс VLAN 1 выключен и не имеет IP-адреса, все порты включены.
        - Коммутатор SW-2 работает с параметрами по умолчанию и в этой работе не настраивается.
        - На компьютере PC, ноутбуке Laptop и компьютере Remote-PC заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.

        В начальном состоянии компьютер PC получает ответы от компьютера Remote-PC другой сети (**ping 192.168.2.10** в приложении «Командная строка»): маршрутизатор уже передает пакеты между сетями. Первый эхо-запрос может остаться без ответа, пока устройства определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 192.168.2.10

        Pinging 192.168.2.10 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.2.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.2.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.2.10: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.2.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        Ноутбук Laptop не получает ответов от интерфейса управления коммутатора SW-1 (**ping 192.168.1.254**): сообщение «Destination host unreachable» выдает сам ноутбук, потому что адрес 192.168.1.254 в локальной сети пока никому не принадлежит.

        ```
        C:\>ping 192.168.1.254

        Pinging 192.168.1.254 with 32 bytes of data:

        Reply from 192.168.1.10: Destination host unreachable.
        Reply from 192.168.1.10: Destination host unreachable.
        Reply from 192.168.1.10: Destination host unreachable.
        Reply from 192.168.1.10: Destination host unreachable.

        Ping statistics for 192.168.1.254:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами.
    - title: "Документирование сети и защита маршрутизатора RTR-A"
      body: |
        **Требование 1.** Таблица адресации дополнена шлюзом по умолчанию коммутатора SW-1: это адрес интерфейса маршрутизатора RTR-A в сети 192.168.1.0/24, в которой находится интерфейс управления коммутатора.

        **Требование 2.** Маршрутизатор не пытается разрешать ошибочно набранные команды как имена узлов: поиск имен через DNS выключен.

        **Требование 3.** Имя устройства маршрутизатора — RTR-A, по таблице адресации.

        **Требование 4.** Минимальная длина новых паролей на маршрутизаторе — 10 символов.

        **Требование 5.** Консольная линия маршрутизатора требует при входе пароль @Cons1234!.

        **Требование 6.** Сеансы консольной линии и линий VTY маршрутизатора завершаются ровно через 7 минут бездействия.

        **Требование 7.** Привилегированный режим EXEC маршрутизатора защищен зашифрованным паролем (secret) не короче 10 символов. Допустимо использовать тот же пароль, что и для консольной линии.

        **Требование 8.** Баннер MOTD маршрутизатора — «Authorized access only!»: он предупреждает о запрете несанкционированного доступа к устройству.

        **Требование 9.** Все пароли в конфигурации маршрутизатора зашифрованы: включена служба шифрования паролей.

        **Требование 10.** На маршрутизаторе создана учетная запись NETadmin с зашифрованным паролем LogAdmin!9.

        **Требование 11.** На маршрутизаторе настроен SSH: имя домена security.com, ключ RSA с модулем 1024 бит.

        **Требование 12.** Линии VTY маршрутизатора принимают только входящие подключения по SSH и проверяют имя пользователя и пароль по локальным учетным записям.

        **Требование 13.** Маршрутизатор блокирует вход на 45 секунд, если за 100 секунд сделано 3 неудачные попытки входа.

        **Примечание.** Пароли в этой работе отвечают требованиям к надежности: не короче 10 символов, с буквами разного регистра, цифрами и знаками. Пароль привилегированного режима EXEC хранится в конфигурации в виде хеша, а не открытым текстом, если он задан как secret.
    - title: "Защита коммутатора SW-1"
      body: |
        **Требование 14.** Имя устройства коммутатора — SW-1, по таблице адресации.

        **Требование 15.** Все неиспользуемые порты коммутатора выключены административно. По таблице кабелей используются порты F0/2, F0/10 и G0/1; остальные — F0/1, F0/3–F0/9, F0/11–F0/24 и G0/2 — выключены.

        **Требование 16.** Интерфейс управления коммутатора, интерфейс VLAN 1, включен и имеет IP-адрес 192.168.1.254 с маской 255.255.255.0.

        **Требование 17.** Шлюз по умолчанию коммутатора — адрес, определенный в Требовании 1: с ним коммутатор отвечает узлам сети 192.168.2.0/24 и принимает их подключения.

        **Требование 18.** Привилегированный режим EXEC коммутатора защищен зашифрованным паролем @Cons1234!.

        **Требование 19.** На коммутаторе настроен SSH так же, как на маршрутизаторе: имя домена security.com, ключ RSA с модулем 1024 бит.

        **Требование 20.** На коммутаторе создана учетная запись NETadmin с зашифрованным паролем LogAdmin!9.

        **Требование 21.** Линии VTY коммутатора принимают только входящие подключения по SSH и проверяют имя пользователя и пароль по локальным учетным записям, так что подключиться к интерфейсу управления может только администратор сети.

        **Примечание.** Выключенный порт в выводе команд состояния интерфейсов показан как administratively down.
    - title: "Проверка"
      body: |
        Когда все требования выполнены, проверьте результат.

        **Шаг 1.** Ноутбук Laptop получает ответы от интерфейса управления коммутатора SW-1 (**ping 192.168.1.254** в приложении «Командная строка»).

        ```
        C:\>ping 192.168.1.254

        Pinging 192.168.1.254 with 32 bytes of data:

        Reply from 192.168.1.254: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.254: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.254: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.254: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.1.254:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```

        **Шаг 2.** Компьютер Remote-PC другой сети тоже получает ответы от интерфейса управления коммутатора SW-1 (**ping 192.168.1.254**): ответы проходят через маршрутизатор RTR-A (TTL=254), потому что у коммутатора задан шлюз по умолчанию. Первый эхо-запрос может остаться без ответа, пока устройства определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 192.168.1.254

        Pinging 192.168.1.254 with 32 bytes of data:

        Request timed out.
        Reply from 192.168.1.254: bytes=32 time=1ms TTL=254
        Reply from 192.168.1.254: bytes=32 time=1ms TTL=254
        Reply from 192.168.1.254: bytes=32 time=1ms TTL=254

        Ping statistics for 192.168.1.254:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** Компьютер PC получает ответы от компьютера Remote-PC (**ping 192.168.2.10**): маршрутизатор по-прежнему передает пакеты между сетями.

        ```
        C:\>ping 192.168.2.10

        Pinging 192.168.2.10 with 32 bytes of data:

        Reply from 192.168.2.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.2.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.2.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.2.10: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.2.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 4.** С компьютера PC к коммутатору SW-1 можно подключиться по протоколу SSH под учетной записью NETadmin (**ssh -l NETadmin 192.168.1.254**, пароль LogAdmin!9 не отображается): открывается пользовательский режим EXEC коммутатора с приглашением SW-1>. Выведите строку интерфейса VLAN 1 командой **show ip interface brief | include Vlan**: интерфейс включен. Сеанс завершает команда **exit**.

        ```
        C:\>ssh -l NETadmin 192.168.1.254
        Password:
        SW-1>show ip interface brief | include Vlan
        Vlan1                      192.168.1.254   YES manual up                    up
        SW-1>exit


        [Connection to 192.168.1.254 closed by foreign host]
        ```

        **Шаг 5.** Подключение по протоколу Telnet (**telnet 192.168.1.254**) коммутатор отклоняет: линии VTY принимают только SSH.

        ```
        C:\>telnet 192.168.1.254
        Trying 192.168.1.254 ...
        % Connection refused by remote host
        ```

        **Шаг 6.** С компьютера Remote-PC к маршрутизатору RTR-A можно подключиться по протоколу SSH под учетной записью NETadmin (**ssh -l NETadmin 192.168.2.1**): до запроса пароля маршрутизатор выводит баннер MOTD «Authorized access only!», а после входа открывает пользовательский режим EXEC с приглашением RTR-A>. Выведите сводку интерфейсов командой **show ip interface brief**. Сеанс завершает команда **exit**.

        ```
        C:\>ssh -l NETadmin 192.168.2.1
        Authorized access only!
        Password:
        RTR-A>show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0/0       192.168.1.1     YES manual up                    up
        GigabitEthernet0/0/1       192.168.2.1     YES manual up                    up
        RTR-A>exit


        [Connection to 192.168.2.1 closed by foreign host]
        ```

        **Шаг 7.** Консоль маршрутизатора RTR-A требует пароль при входе и выводит баннер MOTD, а после трех неудачных попыток входа за 100 секунд маршрутизатор не принимает попытки входа 45 секунд. Пароль привилегированного режима EXEC в текущей конфигурации обоих устройств показан в зашифрованном виде, а не открытым текстом.
