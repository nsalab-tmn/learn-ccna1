# Generated by labs/build.py from spec.py — edit the spec, then rebuild.
Criterions:
- code: PCA
  name: PCA
  subCriterions:
  - code: PCA.PORTS
    name: Ports
    aspects:
    - code: PCA.PORTS.F0-IP
      name: FastEthernet0.IP Address
      description: 'F0: IP-адрес 172.16.1.10'
      skills:
      - IPv4 Host Address Configuration
      max_mark: 8
      steps:
      - name: 'ipconfig: matches (?m)IPv4 Address[. ]*: 172\.16\.1\.10\s*$'
        code: check
        type: check
        device: PCA
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: ipconfig
            expr: '(?m)IPv4 Address[. ]*: 172\.16\.1\.10\s*$'
            match: true
    - code: PCA.PORTS.F0-MASK
      name: FastEthernet0.Subnet Mask
      description: 'F0: маска 255.255.255.0'
      skills:
      - IPv4 Host Address Configuration
      max_mark: 2
      steps:
      - name: 'ipconfig: matches (?m)Subnet Mask[. ]*: 255\.255\.255\.0\s*$'
        code: check
        type: check
        device: PCA
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: ipconfig
            expr: '(?m)Subnet Mask[. ]*: 255\.255\.255\.0\s*$'
            match: true
  - code: PCA.MISC
    name: Miscellaneous
    aspects:
    - code: PCA.MISC.DEFAULT-GW
      name: Default Gateway
      description: Шлюз по умолчанию 172.16.1.1
      skills:
      - IPv4 Host Address Configuration
      max_mark: 10
      steps:
      - name: 'ipconfig: matches (?m)Default Gateway[. ]*: (?:\S+\s*\n\s+)?172\.16\.1\.1\s*$'
        code: check
        type: check
        device: PCA
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: ipconfig
            expr: '(?m)Default Gateway[. ]*: (?:\S+\s*\n\s+)?172\.16\.1\.1\s*$'
            match: true
  - code: PCA.CONNECTIVITY-TESTS
    name: Connectivity Tests
    aspects:
    - code: PCA.CONNECTIVITY-TESTS.CT-0
      name: 'PCA to 172.16.1.1 : 172.16.1.1 (ICMP)'
      description: 'PCA → 172.16.1.1 (PING): проходит'
      skills:
      - Other
      max_mark: 7
      steps:
      - name: 'ping -n 2 172.16.1.1: has : bytes='
        code: check
        type: check
        device: PCA
        action_chain:
        - action: verify_output
          action_vars:
            command: ping -n 2 172.16.1.1
            assert_tags:
            - ': bytes='
            tags_are_present: true
            retries: 3
            retry_interval: 15
    - code: PCA.CONNECTIVITY-TESTS.CT-1
      name: 'PCA to 172.16.1.2 : 172.16.1.2 (ICMP)'
      description: 'PCA → 172.16.1.2 (PING): проходит'
      skills:
      - Other
      max_mark: 7
      steps:
      - name: 'ping -n 2 172.16.1.2: has : bytes='
        code: check
        type: check
        device: PCA
        action_chain:
        - action: verify_output
          action_vars:
            command: ping -n 2 172.16.1.2
            assert_tags:
            - ': bytes='
            tags_are_present: true
            retries: 1
            retry_interval: 5
