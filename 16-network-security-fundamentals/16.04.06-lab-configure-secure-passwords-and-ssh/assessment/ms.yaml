          action_vars:
            command: show ip interface brief
            expr: 'GigabitEthernet0/0\s+\S+\s+YES\s+\S+\s+up\s+up'
            match: true
  - code: RTA.SEC
    name: Security
    aspects:
    - code: RTA.SEC.RSA-1024
      name: Modulus Bits
      description: Сгенерирован RSA-ключ 1024 бита, SSH включён
      skills:
      - Device Hardening Configuration
      max_mark: 10
      steps:
      - name: SSH enabled via 1024-bit RSA key
        code: check
        type: check
        device: RTA
        action_chain:
        - action: verify_output
          action_vars:
            command: show ip ssh
            assert_tags:
            - SSH Enabled
            tags_are_present: true
        - action: verify_output
          action_vars:
            command: show crypto key mypubkey rsa
            assert_tags:
            - 1024 bits
            tags_are_present: true
  - code: RTA.USERS
    name: User Names
