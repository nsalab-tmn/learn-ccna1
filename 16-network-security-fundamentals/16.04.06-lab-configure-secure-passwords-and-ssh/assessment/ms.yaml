# Marking scheme for CCNA1 lab 16.4.6 "Configure Secure Passwords and SSH",
# graded on learn-netsim over SSH (learn-assessment): devices PCA, RTA and SW1.
#
# Per-aspect checks against the simulator's real output: `show` commands on RTA
# and SW1, `ipconfig` on PCA. Aspect names follow the lab's original
# assessment-item tree; the marks are the original ones (PCA 20, RTA 81, SW1 87).
#
# Codes are hierarchical and unique across the scheme: criterion = device
# (`RTA`), sub-criterion = device.group (`RTA.VTY`), aspect = device.group.item
# (`RTA.VTY.SSH-ONLY`). learn-assessment keys MarkSummary by the aspect code and
# learn-core reports aspects by code, so an aspect code must be unique and
# readable on its own. `description` is the learner-facing line in the report.
#
# The exec-timeout aspects read startup-config, not running-config: pyATS/Unicon
# issues `line vty 0 4; exec-timeout 0` at connect time (as on real IOS), which
# would overwrite the live value before it is read. The testbed also sets
# INIT_CONFIG_COMMANDS: [] so the grader does not mutate the device.
Criterions:
- code: PCA
  name: PCA
  subCriterions:
  - code: PCA.PORTS
    name: Ports
    aspects:
    - code: PCA.PORTS.F0-IP
      name: FastEthernet0.IP Address
      description: 'PCA: IP-адрес 172.16.1.10'
      skills:
      - IPv4 Host Address Configuration
      max_mark: 8
      steps:
      - name: PCA has 172.16.1.10
        code: check
        type: check
        device: PCA
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: ipconfig
            expr: '(?m)IPv4 Address[. ]*: 172\.16\.1\.10\s*$'
            match: true
    - code: PCA.PORTS.F0-MASK
      name: FastEthernet0.Subnet Mask
      description: 'PCA: маска 255.255.255.0'
      skills:
      - IPv4 Host Address Configuration
      max_mark: 2
      steps:
      - name: PCA mask 255.255.255.0
        code: check
        type: check
        device: PCA
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: ipconfig
            expr: '(?m)Subnet Mask[. ]*: 255\.255\.255\.0\s*$'
            match: true
  - code: PCA.MISC
    name: Miscellaneous
    aspects:
    - code: PCA.MISC.DEFAULT-GW
      name: Default Gateway
      description: 'PCA: шлюз по умолчанию 172.16.1.1'
      skills:
      - IPv4 Host Address Configuration
      max_mark: 10
      steps:
      - name: PCA gateway 172.16.1.1
        code: check
        type: check
        device: PCA
        action_chain:
        - action: verify_output_regex
          action_vars:
            command: ipconfig
            expr: '(?m)Default Gateway[. ]*: 172\.16\.1\.1\s*$'
            match: true
