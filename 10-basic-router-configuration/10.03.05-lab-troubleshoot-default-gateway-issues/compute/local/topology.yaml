scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | R1 | G0/0 | S1 | G0/1 |
        | Медный | R1 | G0/1 | S2 | G0/1 |
        | Медный | PC1 | F0 | S1 | F0/1 |
        | Медный | PC2 | F0 | S1 | F0/2 |
        | Медный | PC3 | F0 | S2 | F0/1 |
        | Медный | PC4 | F0 | S2 | F0/2 |

        Документация сети: таблица адресации.

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | R1 | G0/0 | 192.168.10.1 | 255.255.255.0 | — |
        | R1 | G0/1 | 192.168.11.1 | 255.255.255.0 | — |
        | S1 | VLAN 1 | 192.168.10.2 | 255.255.255.0 | ? |
        | S2 | VLAN 1 | 192.168.11.2 | 255.255.255.0 | ? |
        | PC1 | NIC | 192.168.10.10 | 255.255.255.0 | ? |
        | PC2 | NIC | 192.168.10.11 | 255.255.255.0 | ? |
        | PC3 | NIC | 192.168.11.10 | 255.255.255.0 | ? |
        | PC4 | NIC | 192.168.11.11 | 255.255.255.0 | ? |

        В документации не указаны шлюзы по умолчанию коммутаторов и компьютеров: они отмечены знаком «?». Вы определите их на странице «Дополнение документации сети».
    - title: "Начальное состояние"
      body: |
        - Маршрутизатор R1 настроен по таблице адресации: его интерфейсы G0/0 и G0/1 подключают локальные сети 192.168.10.0/24 и 192.168.11.0/24.
        - На коммутаторах S1 и S2 и на компьютерах PC1–PC4 заданы IP-настройки, но при их вводе допущены ошибки. Сколько их и на каких устройствах они находятся, вам предстоит выяснить.
        - Пользователи сообщают, что компьютер PC1 не может связаться ни с одним устройством сети.

        **Шаг 1.** После запуска лабораторной работы дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым («Соединение активно» в условных обозначениях).

        **Шаг 2.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь с компьютером PC4 другой локальной сети командой **ping 192.168.11.11**. Ответов нет.

        ```
        C:\>ping 192.168.11.11

        Pinging 192.168.11.11 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 192.168.11.11:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```
    - title: "Дополнение документации сети"
      body: |
        Проверку сети начинают с полной документации: без нее не с чем сравнить настройки устройств.

        **Шаг 1.** Определите шлюз по умолчанию для каждого коммутатора и компьютера и дополните таблицу адресации. Шлюзом по умолчанию устройства служит интерфейс маршрутизатора R1, подключенный к его локальной сети.

        | Устройство | Локальная сеть | Шлюз по умолчанию |
        |---|---|---|
        | S1, PC1, PC2 | 192.168.10.0/24 | 192.168.10.1 (R1 G0/0) |
        | S2, PC3, PC4 | 192.168.11.0/24 | 192.168.11.1 (R1 G0/1) |

        **Примечание.** Кадры компьютеров коммутатор передает и без IP-настроек. Адрес интерфейса VLAN 1 и шлюз по умолчанию нужны коммутатору для его собственного трафика: чтобы отвечать на эхо-запросы и принимать удаленные подключения, в том числе из другой сети.

        **Шаг 2.** Подготовьте документацию проверок: таблицу со столбцами «Проверка», «Успешно?», «Проблема», «Решение» и «Проверено». Составьте ее на бумаге, в текстовом редакторе или в электронной таблице. В нее вы будете записывать каждую проверку связи, найденную проблему, выбранное решение и результат повторной проверки.

        **Примечание.** Для каждой проблемы выбирают одно решение и сразу проверяют его. Если применить несколько изменений сразу, трудно понять, какое из них устранило проблему, а лишнее изменение может создать новую.
    - title: "Проверка связи в локальной сети 192.168.10.0/24"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 проверьте связь с компьютером PC2 той же локальной сети командой **ping 192.168.10.11**. Компьютер PC1 не отправляет эхо-запросы и выводит «PING: transmit failed. General failure».

        ```
        C:\>ping 192.168.10.11

        Pinging 192.168.10.11 with 32 bytes of data:

        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.

        Ping statistics for 192.168.10.11:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Примечание.** Сообщение «General failure» означает, что у компьютера нет пути к получателю: по собственным IP-адресу и маске компьютер считает получателя узлом другой сети, а его шлюз по умолчанию не входит в его сеть, поэтому передать пакет некому.

        **Шаг 2.** Сравните настройки компьютера PC1 с документацией: выведите их командой **ipconfig**. IPv4-адрес компьютера — 192.168.11.10, а по документации он должен быть 192.168.10.10. Маска подсети и шлюз по умолчанию совпадают с документацией. Запишите проверку и проблему в документацию проверок, а решение — изменить IPv4-адрес компьютера PC1 по документации.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.11.10
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.10.1
        ```

        **Шаг 3.** Задайте компьютеру PC1 IPv4-адрес, маску подсети и шлюз по умолчанию по документации командой **ipconfig 192.168.10.10 255.255.255.0 192.168.10.1**. Команда ничего не выводит.

        ```
        C:\>ipconfig 192.168.10.10 255.255.255.0 192.168.10.1
        ```

        **Примечание.** Те же параметры можно задать в приложении «IP-конфигурация» на вкладке «Рабочий стол»: в полях «IPv4-адрес», «Маска» и «Шлюз по умолчанию». Значение поля сохраняется сразу, как только вы нажмете Enter или перейдете к другому полю.

        **Шаг 4.** Повторите проверку командой **ping 192.168.10.11**. Компьютер PC2 отвечает: проблема устранена. Отметьте решение в документации как проверенное.

        ```
        C:\>ping 192.168.10.11

        Pinging 192.168.10.11 with 32 bytes of data:

        Reply from 192.168.10.11: bytes=32 time=1ms TTL=128
        Reply from 192.168.10.11: bytes=32 time<1ms TTL=128
        Reply from 192.168.10.11: bytes=32 time<1ms TTL=128
        Reply from 192.168.10.11: bytes=32 time<1ms TTL=128

        Ping statistics for 192.168.10.11:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 5.** Проверьте связь компьютера PC1 с коммутатором S1 командой **ping 192.168.10.2**. Коммутатор отвечает.

        ```
        C:\>ping 192.168.10.2

        Pinging 192.168.10.2 with 32 bytes of data:

        Reply from 192.168.10.2: bytes=32 time<1ms TTL=255
        Reply from 192.168.10.2: bytes=32 time<1ms TTL=255
        Reply from 192.168.10.2: bytes=32 time<1ms TTL=255
        Reply from 192.168.10.2: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.10.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```

        **Шаг 6.** Проверьте связь компьютера PC1 с интерфейсом G0/0 маршрутизатора R1 командой **ping 192.168.10.1**. Маршрутизатор отвечает. Запишите обе проверки в документацию.

        ```
        C:\>ping 192.168.10.1

        Pinging 192.168.10.1 with 32 bytes of data:

        Reply from 192.168.10.1: bytes=32 time=1ms TTL=255
        Reply from 192.168.10.1: bytes=32 time<1ms TTL=255
        Reply from 192.168.10.1: bytes=32 time<1ms TTL=255
        Reply from 192.168.10.1: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.10.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```
    - title: "Проверка связи в локальной сети 192.168.11.0/24"
      body: |
        **Шаг 1.** Откройте окно компьютера PC3 и в приложении «Командная строка» проверьте связь с компьютером PC4 командой **ping 192.168.11.11**. Компьютер PC4 отвечает.

        ```
        C:\>ping 192.168.11.11

        Pinging 192.168.11.11 with 32 bytes of data:

        Reply from 192.168.11.11: bytes=32 time<1ms TTL=128
        Reply from 192.168.11.11: bytes=32 time<1ms TTL=128
        Reply from 192.168.11.11: bytes=32 time<1ms TTL=128
        Reply from 192.168.11.11: bytes=32 time<1ms TTL=128

        Ping statistics for 192.168.11.11:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```

        **Шаг 2.** Проверьте связь компьютера PC3 с коммутатором S2 командой **ping 192.168.11.2**. Ответ «Destination host unreachable» приходит от самого компьютера PC3 (192.168.11.10).

        ```
        C:\>ping 192.168.11.2

        Pinging 192.168.11.2 with 32 bytes of data:

        Reply from 192.168.11.10: Destination host unreachable.
        Reply from 192.168.11.10: Destination host unreachable.
        Reply from 192.168.11.10: Destination host unreachable.
        Reply from 192.168.11.10: Destination host unreachable.

        Ping statistics for 192.168.11.2:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Примечание.** Получателя в своей сети компьютер ищет по протоколу ARP: спрашивает, у какого устройства адрес 192.168.11.2. Если ни одно устройство не ответило, компьютер сам сообщает, что узел недоступен. Значит, адрес 192.168.11.2 в этой локальной сети не назначен ни одному устройству.

        **Шаг 3.** Проверьте связь компьютера PC3 с интерфейсом G0/1 маршрутизатора R1 командой **ping 192.168.11.1**. Маршрутизатор отвечает: локальная сеть работает, проблема — в настройке коммутатора S2.

        ```
        C:\>ping 192.168.11.1

        Pinging 192.168.11.1 with 32 bytes of data:

        Reply from 192.168.11.1: bytes=32 time=1ms TTL=255
        Reply from 192.168.11.1: bytes=32 time<1ms TTL=255
        Reply from 192.168.11.1: bytes=32 time<1ms TTL=255
        Reply from 192.168.11.1: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.11.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 4.** Откройте консоль коммутатора S2, перейдите в привилегированный режим EXEC командой **enable** и выведите сведения об интерфейсе VLAN 1 командой **show ip interface brief | include Vlan**. У интерфейса Vlan1 нет IP-адреса (unassigned), а по документации он должен быть 192.168.11.2. Запишите проверку, проблему и решение — назначить интерфейсу VLAN 1 коммутатора S2 адрес по документации.

        ```
        S2>enable
        S2#show ip interface brief | include Vlan
        Vlan1                      unassigned      YES unset  up                    up
        ```

        **Шаг 5.** Перейдите в режим глобальной конфигурации командой **configure terminal**, затем в режим настройки интерфейса командой **interface vlan 1**. Назначьте адрес командой **ip address 192.168.11.2 255.255.255.0** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        S2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S2(config)#interface vlan 1
        S2(config-if)#ip address 192.168.11.2 255.255.255.0
        S2(config-if)#end
        *Mar  1 00:03:22.940: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 6.** В приложении «Командная строка» компьютера PC3 повторите проверку командой **ping 192.168.11.2**. Коммутатор S2 отвечает: проблема устранена. Отметьте решение в документации как проверенное.

        ```
        C:\>ping 192.168.11.2

        Pinging 192.168.11.2 with 32 bytes of data:

        Reply from 192.168.11.2: bytes=32 time<1ms TTL=255
        Reply from 192.168.11.2: bytes=32 time<1ms TTL=255
        Reply from 192.168.11.2: bytes=32 time<1ms TTL=255
        Reply from 192.168.11.2: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.11.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```
    - title: "Проверка связи между сетями"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 снова проверьте связь с компьютером PC4 командой **ping 192.168.11.11**. Ответов по-прежнему нет, хотя обе локальные сети теперь работают.

        ```
        C:\>ping 192.168.11.11

        Pinging 192.168.11.11 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 192.168.11.11:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 2.** Откройте окно компьютера PC4 и в приложении «Командная строка» проверьте связь в обратную сторону, с компьютером PC1, командой **ping 192.168.10.10**. Ответ «Destination host unreachable» приходит от самого компьютера PC4 (192.168.11.11): он не нашел по протоколу ARP устройство, которому должен передать пакет в другую сеть, — свой шлюз по умолчанию.

        ```
        C:\>ping 192.168.10.10

        Pinging 192.168.10.10 with 32 bytes of data:

        Reply from 192.168.11.11: Destination host unreachable.
        Reply from 192.168.11.11: Destination host unreachable.
        Reply from 192.168.11.11: Destination host unreachable.
        Reply from 192.168.11.11: Destination host unreachable.

        Ping statistics for 192.168.10.10:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 3.** Сравните настройки компьютера PC4 с документацией: выведите их командой **ipconfig**. Шлюз по умолчанию компьютера — 192.168.11.254, а по документации он должен быть 192.168.11.1. Такого адреса в локальной сети нет, поэтому пакеты в другую сеть, в том числе ответы компьютеру PC1, компьютер PC4 отправить не может. Запишите проверку, проблему и решение — изменить шлюз по умолчанию компьютера PC4.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:C5FF:FE22:CE01
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.11.11
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.11.254
        ```

        **Шаг 4.** Задайте компьютеру PC4 параметры по документации командой **ipconfig 192.168.11.11 255.255.255.0 192.168.11.1** или в приложении «IP-конфигурация», в поле «Шлюз по умолчанию». Команда ничего не выводит.

        ```
        C:\>ipconfig 192.168.11.11 255.255.255.0 192.168.11.1
        ```

        **Шаг 5.** Повторите проверку командой **ping 192.168.10.10**. Компьютер PC1 отвечает: пакеты проходят через маршрутизатор R1, поэтому TTL в ответах на единицу меньше 128. Отметьте решение в документации как проверенное.

        ```
        C:\>ping 192.168.10.10

        Pinging 192.168.10.10 with 32 bytes of data:

        Reply from 192.168.10.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.10.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.10.10: bytes=32 time=1ms TTL=127
        Reply from 192.168.10.10: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.10.10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 6.** Проверьте связь компьютера PC4 с коммутатором S1 другой локальной сети командой **ping 192.168.10.2**. Коммутатор S1 не отвечает, хотя компьютеру PC1 из своей локальной сети он отвечал (шаг 5 страницы «Проверка связи в локальной сети 192.168.10.0/24»).

        ```
        C:\>ping 192.168.10.2

        Pinging 192.168.10.2 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 192.168.10.2:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 7.** Откройте консоль коммутатора S1, перейдите в привилегированный режим EXEC командой **enable** и выведите строку шлюза по умолчанию из текущей конфигурации командой **show running-config | include default-gateway**. Команда ничего не выводит: шлюз по умолчанию на коммутаторе S1 не задан, и ответ в другую сеть коммутатору отправить некуда. Запишите проверку, проблему и решение — задать коммутатору S1 шлюз по умолчанию по документации.

        ```
        S1>enable
        S1#show running-config | include default-gateway
        ```

        **Шаг 8.** Перейдите в режим глобальной конфигурации командой **configure terminal**, задайте шлюз по умолчанию командой **ip default-gateway 192.168.10.1** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#ip default-gateway 192.168.10.1
        S1(config)#end
        *Mar  1 00:05:23.936: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 9.** В приложении «Командная строка» компьютера PC4 повторите проверку командой **ping 192.168.10.2**. Коммутатор S1 отвечает: проблема устранена. Отметьте решение в документации как проверенное.

        ```
        C:\>ping 192.168.10.2

        Pinging 192.168.10.2 with 32 bytes of data:

        Reply from 192.168.10.2: bytes=32 time=1ms TTL=254
        Reply from 192.168.10.2: bytes=32 time=1ms TTL=254
        Reply from 192.168.10.2: bytes=32 time=1ms TTL=254
        Reply from 192.168.10.2: bytes=32 time=1ms TTL=254

        Ping statistics for 192.168.10.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```
    - title: "Проверка сквозного подключения"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 проверьте связь с компьютером PC4 командой **ping 192.168.11.11**. Компьютер PC4 отвечает.

        ```
        C:\>ping 192.168.11.11

        Pinging 192.168.11.11 with 32 bytes of data:

        Reply from 192.168.11.11: bytes=32 time=1ms TTL=127
        Reply from 192.168.11.11: bytes=32 time=1ms TTL=127
        Reply from 192.168.11.11: bytes=32 time=1ms TTL=127
        Reply from 192.168.11.11: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.11.11:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 2.** В консоли коммутатора S1 проверьте связь с коммутатором S2 другой локальной сети командой **ping 192.168.11.2**. Коммутатор S2 отвечает: оба коммутатора отправляют пакеты в другую сеть через свой шлюз по умолчанию. Первый эхо-запрос может остаться без ответа (точка в выводе), пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        S1#ping 192.168.11.2
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.11.2, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 1/2/4 ms
        ```

        **Шаг 3.** В консоли коммутатора S2 проверьте связь с компьютером PC1 командой **ping 192.168.10.10**. Компьютер PC1 отвечает.

        ```
        S2#ping 192.168.10.10
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.10.10, timeout is 2 seconds:
        !!!!!
        Success rate is 100 percent (5/5), round-trip min/avg/max = 2/3/5 ms
        ```

        **Шаг 4.** Аналогично убедитесь, что каждый из компьютеров PC1–PC4 получает ответы от трех других компьютеров, от коммутаторов S1 (192.168.10.2) и S2 (192.168.11.2) и от обоих интерфейсов маршрутизатора R1 (192.168.10.1 и 192.168.11.1).

        **Шаг 5.** Сравните свою документацию проверок с таблицей. Проверки, которые прошли успешно с первого раза, в таблице не повторяются.

        | Проверка | Успешно? | Проблема | Решение | Проверено |
        |---|---|---|---|---|
        | PC1 — PC2 | Нет | IPv4-адрес PC1 192.168.11.10 вместо 192.168.10.10 | Изменить IPv4-адрес PC1 | Да |
        | PC3 — S2 | Нет | У интерфейса VLAN 1 коммутатора S2 нет IP-адреса | Назначить адрес 192.168.11.2 | Да |
        | PC4 — PC1 | Нет | Шлюз по умолчанию PC4 192.168.11.254 вместо 192.168.11.1 | Изменить шлюз по умолчанию PC4 | Да |
        | PC4 — S1 | Нет | На коммутаторе S1 не задан шлюз по умолчанию | Задать шлюз 192.168.10.1 | Да |
