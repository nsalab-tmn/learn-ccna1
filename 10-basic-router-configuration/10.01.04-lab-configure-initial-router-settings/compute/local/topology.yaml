scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Консольный | PCA | RS232 | R1 | Console |

        IP-адресов в этой лабораторной работе нет: компьютер PCA работает с маршрутизатором R1 только по консольному кабелю.

        | Параметр | Значение |
        |---|---|
        | Имя устройства | R1 |
        | Текст баннера MOTD | Unauthorized access is strictly prohibited |
        | Пароль enable password | cisco |
        | Пароль enable secret | itsasecret |
        | Пароль консоли | letmein |
    - title: "Начальное состояние"
      body: |
        - Маршрутизатор R1 не настроен: все его параметры имеют значения по умолчанию, в том числе имя устройства (приглашение Router>). Пароли не заданы, а конфигурация не сохранена.
        - Консольный кабель соединяет порт RS232 компьютера PCA с консольным портом маршрутизатора R1. Щелчок по маршрутизатору на схеме консоль не открывает: страница сообщает, что к маршрутизатору R1 нужно подключиться с компьютера по консольному кабелю.
    - title: "Проверка конфигурации по умолчанию"
      body: |
        **Шаг 1.** Откройте окно компьютера PCA и на вкладке «Рабочий стол» запустите приложение «Терминал». Приложение подключается к консоли маршрутизатора R1 по консольному кабелю и выводит «Press RETURN to get started!». Нажмите Enter, чтобы получить приглашение пользовательского режима EXEC Router>.

        **Примечание.** Та же консоль открывается командой terminal в приложении «Командная строка» компьютера PCA. Сочетание клавиш Ctrl+] закрывает ее и возвращает в командную строку компьютера.

        **Шаг 2.** Перейдите в привилегированный режим EXEC командой **enable**. Приглашение меняется с Router> на Router#. В привилегированном режиме EXEC доступны все команды маршрутизатора, в том числе те, что меняют его параметры, поэтому доступ к этому режиму защищают паролем.

        **Шаг 3.** Выведите текущую конфигурацию маршрутизатора командой **show running-config**. Найдите в ней имя устройства (строка hostname), интерфейсы маршрутизатора (строки interface) и линии в конце конфигурации: консольную линию con 0 и линии VTY для удаленного доступа. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение Router#.

        ```
        Router>enable
        Router#show running-config
        Building configuration...

        Current configuration : 239 bytes
        !
        version 0.1
        !
        hostname Router
        !
        !
        !
        interface GigabitEthernet0/0
         no ip address
         shutdown
         duplex auto
         speed auto
        !
        interface GigabitEthernet0/1
         no ip address
         shutdown
         duplex auto
         speed auto
        !
        line con 0
        !
        line vty 0 4
         login
        !
        end
        ```

        **Шаг 4.** Ответьте на вопросы 1–5 в форме ответов.

        **Шаг 5.** Выведите загрузочную конфигурацию командой **show startup-config**. Маршрутизатор отвечает сообщением «startup-config is not present».

        ```
        Router#show startup-config
        startup-config is not present
        ```

        **Примечание.** Текущая конфигурация (running-config) хранится в оперативной памяти и действует, пока маршрутизатор включен. Загрузочная конфигурация (startup-config) хранится в энергонезависимой памяти NVRAM, и маршрутизатор загружает ее при включении. Пока текущую конфигурацию не сохранили, загрузочной конфигурации в NVRAM нет.

        **Шаг 6.** Ответьте на вопрос 6 в форме ответов.
    - title: "Настройка начальных параметров"
      body: |
        **Шаг 1.** Перейдите в режим глобальной конфигурации командой **configure terminal** и задайте имя устройства командой **hostname R1**. Приглашение меняется на R1(config)#.

        **Шаг 2.** Задайте баннер MOTD командой **banner motd "Unauthorized access is strictly prohibited"**.

        ```
        Router#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Router(config)#hostname R1
        R1(config)#banner motd "Unauthorized access is strictly prohibited"
        ```

        **Примечание.** Первый символ после banner motd — разделитель: текст баннера продолжается до следующего такого же символа. Кавычки в текст баннера не входят, а в конфигурации разделитель показан как ^C.

        **Шаг 3.** Включите шифрование паролей, которые хранятся в конфигурации открытым текстом, командой **service password-encryption**.

        **Шаг 4.** Задайте пароль привилегированного режима EXEC сначала командой **enable password cisco**, а затем командой **enable secret itsasecret**.

        ```
        R1(config)#service password-encryption
        R1(config)#enable password cisco
        R1(config)#enable secret itsasecret
        ```

        **Шаг 5.** Перейдите к настройке консольной линии командой **line console 0**, задайте пароль консоли командой **password letmein** и включите запрос пароля при входе командой **login**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1(config)#line console 0
        R1(config-line)#password letmein
        R1(config-line)#login
        R1(config-line)#end
        *Mar  1 00:00:35.395: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Команда password только задает пароль линии, а запрашивать его при входе маршрутизатор начинает после команды login. Сообщение %SYS-5-CONFIG_I маршрутизатор выводит при выходе из режима конфигурации.
    - title: "Проверка начальных параметров и входа с паролями"
      body: |
        **Шаг 1.** Проверьте начальные параметры: выведите текущую конфигурацию командой **show running-config**. В ней появились имя устройства R1, команда service password-encryption, пароли enable secret и enable password, баннер MOTD и пароль консольной линии con 0 с командой login. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение R1#.

        ```
        R1#show running-config
        Building configuration...

        Current configuration : 432 bytes
        !
        version 0.1
        service password-encryption
        !
        hostname R1
        !
        enable secret 5 $1$mERr$aaFgycF7RyVFzB8m
        enable password 7 00071A150754
        !
        !
        interface GigabitEthernet0/0
         no ip address
         shutdown
         duplex auto
         speed auto
        !
        interface GigabitEthernet0/1
         no ip address
         shutdown
         duplex auto
         speed auto
        !
        banner motd ^CUnauthorized access is strictly prohibited^C
        !
        line con 0
         password 7 00081612095E0208
         login
        !
        line vty 0 4
         login
        !
        end
        ```

        **Примечание.** Пароли enable password и консоли показаны с номером 7: они заданы открытым текстом, и команда service password-encryption сохранила их в зашифрованном виде. Пароль enable secret показан с номером 5: маршрутизатор хранит не сам пароль, а его хеш. Шифрование с номером 7 слабое и защищает пароль только от случайного взгляда, поэтому пароль привилегированного режима задают командой enable secret.

        **Шаг 2.** Ответьте на вопрос 7 в форме ответов.

        **Шаг 3.** Завершите сеанс в консоли командой **exit**. Маршрутизатор сообщает, что консольная линия свободна: «R1 con0 is now available» и «Press RETURN to get started.».

        **Шаг 4.** Нажмите Enter. Маршрутизатор выводит баннер MOTD «Unauthorized access is strictly prohibited» и запрашивает пароль консоли (User Access Verification).

        ```
        R1#exit


        R1 con0 is now available





        Press RETURN to get started.

        Unauthorized access is strictly prohibited

        User Access Verification
        ```

        **Примечание.** Баннер MOTD маршрутизатор показывает каждому, кто подключается к нему, до запроса пароля: так любой, кто пытается войти, предупрежден, что несанкционированный доступ запрещен.

        **Шаг 5.** Ответьте на вопросы 8 и 9 в форме ответов.

        **Шаг 6.** Введите пароль консоли letmein: символы пароля на экране не отображаются. Откроется пользовательский режим EXEC с приглашением R1>.

        **Шаг 7.** Введите команду **enable**. На запрос пароля сначала введите cisco, пароль enable password: маршрутизатор его не принимает и снова выводит «Password:». Затем введите itsasecret, пароль enable secret: откроется привилегированный режим EXEC с приглашением R1#.

        ```
        Password: 
        R1>enable
        Password: 
        Password: 
        ```

        **Примечание.** Если заданы оба пароля привилегированного режима, маршрутизатор принимает только пароль enable secret, а пароль enable password перестает действовать.

        **Шаг 8.** Ответьте на вопросы 10 и 11 в форме ответов.
    - title: "Сохранение конфигурации в NVRAM"
      body: |
        **Шаг 1.** Сохраните текущую конфигурацию в NVRAM как загрузочную командой **copy running-config startup-config**. На запрос имени файла «Destination filename [startup-config]?» нажмите Enter: имя в квадратных скобках предлагается по умолчанию.

        ```
        R1#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```

        **Шаг 2.** Ответьте на вопрос 12 в форме ответов.

        **Примечание.** Команды и их параметры можно вводить сокращенно: достаточно первых букв, если с них не начинается другая команда или другой параметр. Знак вопроса сразу после букв выводит все команды, которые с них начинаются, а знак вопроса через пробел после команды — ее параметры.

        **Шаг 3.** Введите **co?**: маршрутизатор перечисляет команды, которые начинаются с букв co, — configure и copy — и снова выводит набранные буквы. Нажмите Enter: сокращение co неоднозначно, и маршрутизатор отвечает «% Ambiguous command».

        ```
        R1#co?
        configure  copy

        R1#co
        % Ambiguous command:  "co"
        ```

        **Шаг 4.** Введите **copy ?**: маршрутизатор перечисляет, откуда команда copy может копировать, — flash:, running-config, startup-config и tftp: — и снова выводит набранную команду. Нажмите Enter: без параметров команда неполна, и маршрутизатор отвечает «% Incomplete command».

        ```
        R1#copy ?
          flash:          Copy from flash: file system
          running-config  Copy from current system configuration
          startup-config  Copy from startup configuration
          tftp:           Copy from tftp: file system

        R1#copy 
        % Incomplete command.
        ```

        **Шаг 5.** Сохраните конфигурацию еще раз, сократив команду copy и оба ее параметра до наименьшего однозначного числа букв, и нажмите Enter на запрос имени файла. Маршрутизатор сохраняет конфигурацию так же, как полной командой.

        ```
        R1#cop r s
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```

        **Шаг 6.** Ответьте на вопрос 13 в форме ответов.

        **Шаг 7.** Убедитесь, что начальные параметры сохранены в NVRAM, с помощью команды **show startup-config**: загрузочная конфигурация совпадает с текущей. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение R1#.

        ```
        R1#show startup-config
        Using 432 out of 262136 bytes
        !
        version 0.1
        service password-encryption
        !
        hostname R1
        !
        enable secret 5 $1$mERr$aaFgycF7RyVFzB8m
        enable password 7 00071A150754
        !
        !
        interface GigabitEthernet0/0
         no ip address
         shutdown
         duplex auto
         speed auto
        !
        interface GigabitEthernet0/1
         no ip address
         shutdown
         duplex auto
         speed auto
        !
        banner motd ^CUnauthorized access is strictly prohibited^C
        !
        line con 0
         password 7 00081612095E0208
         login
        !
        line vty 0 4
         login
        !
        end
        ```

        **Шаг 8.** Ответьте на вопрос 14 в форме ответов.
    - title: "Сохранение копии конфигурации во флеш-памяти"
      body: |
        **Шаг 1.** Выведите содержимое флеш-памяти командой **show flash**.

        ```
        R1#show flash
        System flash directory:
        File  Length   Name/status
          1   33591768 nr01-netos-0.1.0.bin
        [33591768 bytes used, 222152232 available, 255744000 total]
        249750K bytes of processor board System flash (Read/Write)
        ```

        **Примечание.** Во флеш-памяти хранится образ ОС: файл, из которого маршрутизатор загружает операционную систему при включении. Обычно это самый большой файл во флеш-памяти, с расширением .bin, а в его имени указаны модель устройства и версия ОС.

        **Шаг 2.** Ответьте на вопросы 15–17 в форме ответов.

        **Шаг 3.** Сохраните копию загрузочной конфигурации во флеш-памяти командой **copy startup-config flash**. На запрос имени файла нажмите Enter, чтобы сохранить копию под именем startup-config.

        ```
        R1#copy startup-config flash
        Destination filename [startup-config]? 
        432 bytes copied in 0.416 secs (864 bytes/sec)
        ```

        **Примечание.** Маршрутизатор загружает конфигурацию из NVRAM. Если загрузочная конфигурация в NVRAM повреждена, ее можно восстановить из копии во флеш-памяти.

        **Шаг 4.** Убедитесь с помощью команды **show flash**, что во флеш-памяти появился второй файл, startup-config.

        ```
        R1#show flash
        System flash directory:
        File  Length   Name/status
          1   33591768 nr01-netos-0.1.0.bin
          2   432      startup-config
        [33592200 bytes used, 222151800 available, 255744000 total]
        249750K bytes of processor board System flash (Read/Write)
        ```
