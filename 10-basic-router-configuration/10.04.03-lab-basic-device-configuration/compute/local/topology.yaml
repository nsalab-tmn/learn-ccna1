        Адрес fe80::1 на интерфейсах G0/0 и G0/1 — локальный адрес канала (LLA).

        | Устройство | Пароль консоли и линий VTY | Пароль привилегированного режима EXEC |
        |---|---|---|
        | College | cisco | class |
        | Class-B | cisco | class |
    - title: "Начальное состояние"
      body: |
        - Маршрутизатор College и коммутатор Class-B не настроены: все их параметры имеют значения по умолчанию, в том числе имя устройства (приглашения Router> и Switch>), а интерфейсы маршрутизатора выключены.
        - Коммутатор Class-A настроен по таблице адресации и защищен паролями. Доступа к нему у вас нет, и настраивать его не нужно. Интерфейс VLAN 1 коммутатора Class-A работает только по IPv4.
        - На компьютерах заданы только IPv4-адреса и маски подсети. Шлюзы по умолчанию и IPv6-адреса не заданы.

        В начальном состоянии компьютер Student-1 получает ответы от коммутатора Class-A своей сети (**ping 172.14.5.2** в приложении «Командная строка»), но не от маршрутизатора College (**ping 172.14.5.1**): интерфейсы маршрутизатора выключены и не имеют адресов.

        ```
        C:\>ping 172.14.5.2

        Pinging 172.14.5.2 with 32 bytes of data:

        Reply from 172.14.5.2: bytes=32 time<1ms TTL=255
        Reply from 172.14.5.2: bytes=32 time<1ms TTL=255
        Reply from 172.14.5.2: bytes=32 time<1ms TTL=255
        Reply from 172.14.5.2: bytes=32 time<1ms TTL=255

        Ping statistics for 172.14.5.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```

        ```
        C:\>ping 172.14.5.1

        Pinging 172.14.5.1 with 32 bytes of data:

        Reply from 172.14.5.10: Destination host unreachable.
        Reply from 172.14.5.10: Destination host unreachable.
        Reply from 172.14.5.10: Destination host unreachable.
        Reply from 172.14.5.10: Destination host unreachable.

        Ping statistics for 172.14.5.1:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        В консоли маршрутизатора (приглашение Router>) команда **show ip interface brief** в привилегированном режиме EXEC показывает, что оба интерфейса выключены (administratively down) и не имеют адресов.

        ```
        Router>enable
        Router#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  administratively down down
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами. Значения, отмеченные в таблице адресации знаком «?», вы определяете сами по требованиям.
    - title: "Базовая настройка устройств"
      body: |
        **Требование 1.** Имя устройства маршрутизатора — College, коммутатора — Class-B. Имена чувствительны к регистру и должны совпадать точно.

        **Требование 2.** На маршрутизаторе College и коммутаторе Class-B пароль привилегированного режима EXEC — class. Он задан как секретный пароль (enable secret) и хранится в конфигурации в виде хеша.

        **Требование 3.** На обоих устройствах вход с консоли защищен паролем cisco: консоль запрашивает пароль при входе.

        **Требование 4.** На обоих устройствах вход по всем линиям виртуальных терминалов (VTY) защищен паролем cisco.

        **Требование 5.** На обоих устройствах пароли, которые хранятся в конфигурации открытым текстом, зашифрованы.

        **Требование 6.** На обоих устройствах при подключении выводится баннер дня (MOTD) с предупреждением о том, что доступ разрешен только авторизованным пользователям. Текст баннера выбираете вы.
    - title: "Настройка интерфейсов маршрутизатора"
      body: |
        **Требование 7.** Интерфейсы G0/0 и G0/1 маршрутизатора College включены и имеют IPv4-адреса и маски подсети из таблицы адресации.

        **Требование 8.** У интерфейсов G0/0 и G0/1 есть глобальные индивидуальные IPv6-адреса (GUA) из таблицы адресации с длиной префикса /64, а их локальный адрес канала задан вручную: fe80::1 на обоих интерфейсах.

        **Требование 9.** Маршрутизатор College пересылает пакеты IPv6 между своими сетями.

        **Требование 10.** У интерфейсов G0/0 и G0/1 есть описания, например, к какой сети или к какому коммутатору подключен интерфейс.

        **Примечание.** Локальный адрес канала действует только в пределах своей сети, поэтому на разных интерфейсах маршрутизатора он может совпадать. Простой, заданный вручную адрес fe80::1 удобно указывать узлам как шлюз IPv6 по умолчанию.
    - title: "Настройка коммутатора Class-B"
      body: |
        **Требование 11.** Интерфейс управления коммутатора Class-B — интерфейс VLAN 1 — включен, имеет IP-адрес и маску подсети из таблицы адресации и описание.

        **Требование 12.** Коммутатор Class-B может обмениваться данными с узлами других сетей: его шлюз по умолчанию — интерфейс маршрутизатора College в той же сети, что и интерфейс управления коммутатора.
    - title: "Настройка компьютеров"
      body: |
        **Требование 13.** У каждого компьютера IPv4-адрес и маска подсети — из таблицы адресации, а шлюз по умолчанию — интерфейс маршрутизатора College в сети этого компьютера.

        **Требование 14.** У каждого компьютера IPv6-адрес и длина префикса — из таблицы адресации, а шлюз IPv6 по умолчанию — локальный адрес канала интерфейса маршрутизатора College в сети этого компьютера.
    - title: "Устранение неполадок и сохранение конфигурации"
      body: |
        **Требование 15.** В сети есть неполадки, мешающие связи. Они найдены и устранены: все устройства, кроме коммутатора Class-A, к которому у вас нет доступа, настроены так, как требуют таблица адресации и требования этой лабораторной работы.

        **Требование 16.** Текущая конфигурация маршрутизатора College и коммутатора Class-B сохранена в загрузочную конфигурацию (startup-config).
    - title: "Проверка связи"
      body: |
        После настройки подождите около 30 секунд: порты коммутаторов, к которым подключены включенные интерфейсы маршрутизатора, начинают пересылать кадры не сразу. Первый эхо-запрос может остаться без ответа, пока устройства определяют MAC-адреса друг друга. Затем проверьте результат.

        **Шаг 1.** В приложении «Командная строка» компьютера Student-1 проверьте связь с компьютером Student-4 по IPv4 командой **ping 172.14.10.11**. Компьютер Student-4 отвечает: маршрутизатор College пересылает пакеты между сетями 172.14.5.0/24 и 172.14.10.0/24.

        ```
        C:\>ping 172.14.10.11

        Pinging 172.14.10.11 with 32 bytes of data:

        Request timed out.
        Reply from 172.14.10.11: bytes=32 time=1ms TTL=127
        Reply from 172.14.10.11: bytes=32 time=1ms TTL=127
        Reply from 172.14.10.11: bytes=32 time=1ms TTL=127

        Ping statistics for 172.14.10.11:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 2.** С компьютера Student-1 проверьте связь с компьютером Student-4 по IPv6 командой **ping 2001:db8:b::11**. Компьютер Student-4 отвечает.

        ```
        C:\>ping 2001:db8:b::11

        Pinging 2001:DB8:B::11 with 32 bytes of data:

        Reply from 2001:DB8:B::11: bytes=32 time=4ms TTL=127
        Reply from 2001:DB8:B::11: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:B::11: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:B::11: bytes=32 time=1ms TTL=127

        Ping statistics for 2001:DB8:B::11:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 4ms, Average = 1ms
        ```

        **Шаг 3.** Откройте окно компьютера Student-4 и в приложении «Командная строка» проверьте связь с компьютером Student-1 по IPv6 командой **ping 2001:db8:a::10**. Компьютер Student-1 отвечает.

        ```
        C:\>ping 2001:db8:a::10

        Pinging 2001:DB8:A::10 with 32 bytes of data:

        Reply from 2001:DB8:A::10: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:A::10: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:A::10: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:A::10: bytes=32 time=1ms TTL=127

        Ping statistics for 2001:DB8:A::10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 4.** Откройте окно компьютера Student-3 и проверьте связь с коммутатором Class-A другой сети командой **ping 172.14.5.2**. Коммутатор Class-A отвечает.

        ```
        C:\>ping 172.14.5.2

        Pinging 172.14.5.2 with 32 bytes of data:

        Request timed out.
        Reply from 172.14.5.2: bytes=32 time=1ms TTL=254
        Reply from 172.14.5.2: bytes=32 time=1ms TTL=254
        Reply from 172.14.5.2: bytes=32 time=1ms TTL=254

        Ping statistics for 172.14.5.2:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 5.** Откройте окно компьютера Student-2 и проверьте связь с коммутатором Class-B командой **ping 172.14.10.2**. Коммутатор Class-B отвечает: его интерфейс управления включен, а шлюз по умолчанию позволяет ему ответить узлу другой сети.

        ```
        C:\>ping 172.14.10.2

        Pinging 172.14.10.2 with 32 bytes of data:

        Request timed out.
        Reply from 172.14.10.2: bytes=32 time=1ms TTL=254
        Reply from 172.14.10.2: bytes=32 time=1ms TTL=254
        Reply from 172.14.10.2: bytes=32 time=1ms TTL=254

        Ping statistics for 172.14.10.2:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 6.** Выйдите из консоли маршрутизатора College командой **exit** и снова нажмите Enter. Консоль выводит ваш баннер дня и запрашивает пароль: введите cisco. Так же проверьте консоль коммутатора Class-B.
