    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах HQ и Remote заданы имя устройства и статические маршруты к локальным сетям другого маршрутизатора через канал WAN. Маршруты рассчитаны на план адресации, построенный по требованиям 1–3. Интерфейсы маршрутизаторов не настроены и выключены.
        - На коммутаторах HQ-1, HQ-2, Remote-1 и Remote-2 задано только имя устройства, остальные параметры имеют значения по умолчанию.
        - На компьютерах IP-адреса не заданы.

        В начальном состоянии интерфейсы маршрутизатора HQ не имеют адресов и выключены (**show ip interface brief** в консоли HQ):

        ```
        HQ>enable
        HQ#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  administratively down down
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        Serial0/0/0                unassigned      YES unset  administratively down down
        Serial0/0/1                unassigned      YES unset  administratively down down
        ```

        У компьютеров нет IPv4-адреса (**ipconfig** в приложении «Командная строка» компьютера WS116):

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:78FF:FE56:6201
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами. Значения, отмеченные в таблицах знаком «?», вы определяете сами по требованиям.
    - title: "Разработка плана адресации"
      body: |
        **Требование 1.** Подсети четырех локальных сетей и канала WAN между маршрутизаторами HQ и Remote выделены из сети 192.168.203.0/24.

        **Требование 2.** Подсеть каждой локальной сети — наименьшая подсеть, в которой помещается число узлов из таблицы локальных сетей. Подсеть канала WAN — наименьшая подсеть для двух адресов узлов: максимально эффективная подсеть для канала «точка-точка».

        **Требование 3.** Подсети расположены одна за другой, начиная с адреса 192.168.203.0, без неиспользуемого адресного пространства между ними, в порядке убывания числа узлов: первой идет подсеть локальной сети с наибольшим числом узлов, последней — подсеть канала WAN.

        **Примечание.** Подсеть с префиксом /n содержит 2^(32−n) адресов, из них узлам можно назначить на два меньше: первый адрес подсети — сетевой, последний — широковещательный. Подсеть начинается с адреса, кратного ее размеру, поэтому при выделении от большей подсети к меньшей пропусков не возникает.
    - title: "Настройка маршрутизаторов"
      body: |
        **Требование 4.** Интерфейсы G0/0 и G0/1 маршрутизатора HQ, к которым подключены коммутаторы HQ-1 и HQ-2, имеют первый используемый адрес узла подсети своей локальной сети и маску этой подсети. Интерфейс S0/0/0 маршрутизатора HQ имеет первый используемый адрес узла подсети канала WAN.

        **Требование 5.** Интерфейсы G0/0 и G0/1 маршрутизатора Remote, к которым подключены коммутаторы Remote-1 и Remote-2, имеют первый используемый адрес узла подсети своей локальной сети и маску этой подсети. Интерфейс S0/0/0 маршрутизатора Remote имеет последний используемый адрес узла подсети канала WAN.

        **Требование 6.** Все шесть интерфейсов маршрутизаторов HQ и Remote включены.
    - title: "Настройка коммутаторов"
      body: |
        **Требование 7.** Интерфейс управления каждого коммутатора — интерфейс VLAN 1 — включен и имеет второй используемый адрес узла подсети своей локальной сети и маску этой подсети.

        **Требование 8.** Интерфейс управления каждого коммутатора доступен с узлов всех локальных сетей: шлюз по умолчанию коммутатора — интерфейс маршрутизатора в его локальной сети.
    - title: "Настройка компьютеров"
      body: |
        **Требование 9.** Каждому компьютеру назначен последний используемый адрес узла подсети его локальной сети и маска этой подсети: WS116 — в сети HQ-1, WS145 — в сети HQ-2, WS203 — в сети Remote-1, WS234 — в сети Remote-2.

        **Требование 10.** Шлюз по умолчанию каждого компьютера — интерфейс маршрутизатора в его локальной сети.
    - title: "Проверка связи"
      body: |
        **Примечание.** После включения интерфейса маршрутизатора порт коммутатора, к которому он подключен, начинает пересылать кадры примерно через 30 секунд: протокол STP сначала проверяет, нет ли петли. Первый эхо-запрос к узлу другой сети может остаться без ответа, пока устройства определяют MAC-адреса по протоколу ARP.

        **Шаг 1.** В консолях маршрутизаторов HQ и Remote выведите состояние интерфейсов командой **show ip interface brief**. Интерфейсы G0/0, G0/1 и S0/0/0 обоих маршрутизаторов находятся в состоянии up (столбцы «Status» и «Protocol»), и у каждого из них адрес из вашего плана адресации.

        **Шаг 2.** В приложении «Командная строка» компьютера WS116 проверьте связь с компьютерами WS145, WS203 и WS234 командой **ping** с их адресами. Компьютер WS116 получает ответы от всех трех: маршрутизаторы пересылают пакеты между четырьмя локальными сетями по статическим маршрутам.

        **Шаг 3.** Аналогично проверьте с компьютеров WS145, WS203 и WS234 связь друг с другом и с компьютером WS116. Ответы приходят от всех компьютеров.

        **Шаг 4.** С любого компьютера проверьте связь с интерфейсами управления всех четырех коммутаторов. Каждый коммутатор отвечает, в том числе коммутаторы другого офиса: их интерфейсы управления включены, а шлюзы по умолчанию позволяют им ответить узлу из другой сети.
