        | Локальная сеть ASW-3 | Building2 | 6 |
        | Локальная сеть ASW-4 | Building2 | 60 |
        | Соединение Building1 — Building2 | — | 2 |

        Адреса, маски и шлюзы, отмеченные знаком «?», вы рассчитаете на страницах «Расчет подсетей VLSM» и «Составление схемы адресации»: там же приведена заполненная таблица для проверки.

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | Building1 | G0/0 | ? | ? | — |
        | Building1 | G0/1 | ? | ? | — |
        | Building1 | S0/0/0 | ? | ? | — |
        | Building2 | G0/0 | ? | ? | — |
