scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Последовательный | Building1 | S0/0/0 | Building2 | S0/0/0 |
        | Медный | Building1 | G0/0 | ASW-1 | G0/1 |
        | Медный | Building1 | G0/1 | ASW-2 | G0/1 |
