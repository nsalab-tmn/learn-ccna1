        | Медный | Host-C | F0 | ASW-3 | F0/1 |
        | Медный | Host-D | F0 | ASW-4 | F0/1 |

        Блок адресов сети — 10.11.48.0/24. Требования к подсетям:

        | Подсеть | Здание | Нужно адресов узлов |
