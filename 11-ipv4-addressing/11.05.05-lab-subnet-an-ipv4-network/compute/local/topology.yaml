  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | CustomerRouter | G0/0 | LAN-A | G0/1 |
        | Медный | CustomerRouter | G0/1 | LAN-B | G0/1 |
