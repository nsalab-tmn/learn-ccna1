        | Локальная сеть LAN-B | не меньше 40 |
        | Две свободные подсети для расширения сети | — |

        Все подсети схемы получают маску подсети одной длины: маски переменной длины в этой сети не используются.

        Адреса, маски и шлюзы, отмеченные знаком «?», вы рассчитаете на страницах «Расчет маски подсети» и «Составление схемы адресации»: там же приведена заполненная таблица для проверки.

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | CustomerRouter | G0/0 | ? | ? | — |
        | CustomerRouter | G0/1 | ? | ? | — |
        | LAN-A | VLAN 1 | ? | ? | ? |
        | LAN-B | VLAN 1 | ? | ? | ? |
        | PC-A | NIC | ? | ? | ? |
        | PC-B | NIC | ? | ? | ? |
    - title: "Начальное состояние"
      body: |
        - Маршрутизатор не настроен: у него нет имени устройства (приглашение Router), паролей и адресов интерфейсов, а интерфейсы G0/0 и G0/1 выключены.
        - На коммутаторах LAN-A и LAN-B задано только имя устройства.
        - На компьютерах PC-A и PC-B адреса не заданы.

        **Шаг 1.** Откройте консоль маршрутизатора и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 2.** Выведите состояние интерфейсов командой **show ip interface brief**. Интерфейсы G0/0 и G0/1 не имеют адресов (unassigned) и выключены (administratively down).

        ```
        Router>enable
        Router#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  administratively down down
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        ```

        **Шаг 3.** Откройте консоль коммутатора LAN-A, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**. Выведите строку интерфейса VLAN 1 командой **show ip interface brief | include Vlan**: у интерфейса нет адреса, и он выключен.

        ```
        LAN-A>enable
        LAN-A#show ip interface brief | include Vlan
        Vlan1                      unassigned      YES unset  administratively down down
        ```

        **Шаг 4.** Откройте окно компьютера PC-A и на вкладке «Рабочий стол» запустите приложение «Командная строка». Выведите IP-настройки командой **ipconfig**: IPv4-адрес, маска подсети и шлюз по умолчанию равны 0.0.0.0.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:D1FF:FE20:9701
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```
    - title: "Расчет маски подсети"
      body: |
        **Шаг 1.** Определите, сколько адресов узлов нужно самой крупной подсети и сколько подсетей нужно сети: по одной на каждую локальную сеть и две свободные для расширения.

        **Шаг 2.** Ответьте на вопросы 1 и 2 в форме ответов.

        **Шаг 3.** Запишите маску /24 исходной сети в двоичном виде: четыре октета по 8 бит, разделенные точками, где первые 24 бита — единицы.

        **Шаг 4.** Ответьте на вопрос 3 в форме ответов.

        **Примечание.** Маска подсети состоит из двух частей — сетевой и узловой. В двоичном виде сетевая часть маски записана единицами, а узловая — нулями.

        **Шаг 5.** Ответьте на вопросы 4 и 5 в форме ответов.

        **Примечание.** Чтобы разделить сеть на подсети, биты узловой части исходной маски /24 заменяют битами подсети. Если заимствовать n бит, получится 2^n подсетей, а в каждой подсети останется 2^(8 − n) − 2 адресов узлов: первый адрес подсети — ее сетевой адрес, а последний — широковещательный, и узлам их не назначают.

        | Префикс | Маска подсети в двоичном виде |
        |---|---|
        | /25 | 11111111.11111111.11111111.10000000 |
        | /26 | 11111111.11111111.11111111.11000000 |
        | /27 | 11111111.11111111.11111111.11100000 |
        | /28 | 11111111.11111111.11111111.11110000 |
        | /29 | 11111111.11111111.11111111.11111000 |
        | /30 | 11111111.11111111.11111111.11111100 |

        **Шаг 6.** Для каждой маски из таблицы запишите ее десятичное представление с точками и посчитайте, сколько подсетей она дает и сколько адресов узлов будет в каждой подсети. Десятичное значение октета равно сумме весов его единичных битов: 128, 64, 32, 16, 8, 4, 2 и 1.

        **Шаг 7.** Ответьте на вопросы 6–17 в форме ответов.

        **Шаг 8.** Сравните результаты с требованиями к сети: подсети LAN-A нужно не меньше 50 адресов узлов, а сети — столько подсетей, сколько вы посчитали на шаге 1.

        **Шаг 9.** Ответьте на вопросы 18–20 в форме ответов.
    - title: "Составление схемы адресации"
      body: |
        **Шаг 1.** Разделите сеть 192.168.0.0/24 на подсети с выбранной маской. Подсети идут подряд с шагом 256 минус десятичное значение четвертого октета маски, начиная с адреса 192.168.0.0. Для каждой подсети запишите адрес подсети, первый и последний адреса узлов и широковещательный адрес: он на единицу меньше адреса следующей подсети.

        **Шаг 2.** Сверьте свою таблицу подсетей с таблицей ниже. Маска всех подсетей — 255.255.255.192 (/26).

        | Подсеть | Адрес подсети | Первый адрес узла | Последний адрес узла | Широковещательный адрес |
        |---|---|---|---|---|
        | LAN-A | 192.168.0.0/26 | 192.168.0.1 | 192.168.0.62 | 192.168.0.63 |
        | LAN-B | 192.168.0.64/26 | 192.168.0.65 | 192.168.0.126 | 192.168.0.127 |
        | Свободная | 192.168.0.128/26 | 192.168.0.129 | 192.168.0.190 | 192.168.0.191 |
        | Свободная | 192.168.0.192/26 | 192.168.0.193 | 192.168.0.254 | 192.168.0.255 |

        **Шаг 3.** Распределите адреса по правилам схемы. Первая подсеть — сети LAN-A, вторая — сети LAN-B. В каждой из них интерфейс маршрутизатора CustomerRouter получает первый адрес узла, коммутатор — второй, а компьютер — последний. Шлюз по умолчанию коммутатора и компьютера — адрес интерфейса маршрутизатора в их подсети.

        **Шаг 4.** Сверьте свою схему с таблицей адресации ниже.

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | CustomerRouter | G0/0 | 192.168.0.1 | 255.255.255.192 | — |
        | CustomerRouter | G0/1 | 192.168.0.65 | 255.255.255.192 | — |
        | LAN-A | VLAN 1 | 192.168.0.2 | 255.255.255.192 | 192.168.0.1 |
        | LAN-B | VLAN 1 | 192.168.0.66 | 255.255.255.192 | 192.168.0.65 |
        | PC-A | NIC | 192.168.0.62 | 255.255.255.192 | 192.168.0.1 |
        | PC-B | NIC | 192.168.0.126 | 255.255.255.192 | 192.168.0.65 |
    - title: "Настройка маршрутизатора CustomerRouter"
      body: |
        **Шаг 1.** На маршрутизаторе перейдите в режим глобальной конфигурации командой **configure terminal** и задайте имя устройства командой **hostname CustomerRouter**: приглашение сменится на CustomerRouter(config)#.

        **Шаг 2.** Задайте пароль привилегированного режима EXEC командой **enable secret Class123**.

        **Шаг 3.** Перейдите к настройке консоли командой **line console 0**, задайте пароль консоли командой **password Cisco123** и включите его проверку при входе командой **login**. Вернитесь в режим глобальной конфигурации командой **exit**.

        ```
        Router#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Router(config)#hostname CustomerRouter
        CustomerRouter(config)#enable secret Class123
        CustomerRouter(config)#line console 0
        CustomerRouter(config-line)#password Cisco123
        CustomerRouter(config-line)#login
        CustomerRouter(config-line)#exit
        ```

        **Примечание.** Пароли действуют со следующего входа: если консоль маршрутизатора запросит пароль («Password:»), введите Cisco123, а на запрос пароля после команды **enable** — Class123. Пароли чувствительны к регистру. Команда enable secret хранит в конфигурации не сам пароль, а его хеш.

        **Шаг 4.** Перейдите к настройке интерфейса G0/0, к которому подключен коммутатор LAN-A, командой **interface g0/0**. Назначьте ему первый адрес узла подсети LAN-A командой **ip address 192.168.0.1 255.255.255.192** и включите интерфейс командой **no shutdown**.

        **Шаг 5.** Аналогично настройте интерфейс G0/1, к которому подключен коммутатор LAN-B: **interface g0/1**, **ip address 192.168.0.65 255.255.255.192**, **no shutdown**. Вернитесь в привилегированный режим EXEC командой **end**. После включения каждого интерфейса в консоли появляются сообщения о том, что интерфейс и протокол канала перешли в состояние up.

        ```
        CustomerRouter(config)#interface g0/0
        CustomerRouter(config-if)#ip address 192.168.0.1 255.255.255.192
        CustomerRouter(config-if)#no shutdown
        CustomerRouter(config-if)#
        *Mar  1 00:01:29.646: %LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to up
        CustomerRouter(config-if)#
        *Mar  1 00:01:30.646: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to up
        CustomerRouter(config-if)#interface g0/1
        CustomerRouter(config-if)#ip address 192.168.0.65 255.255.255.192
        CustomerRouter(config-if)#no shutdown
        CustomerRouter(config-if)#
        *Mar  1 00:01:40.885: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        CustomerRouter(config-if)#
        *Mar  1 00:01:41.885: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        CustomerRouter(config-if)#end
        *Mar  1 00:01:44.903: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 6.** Убедитесь с помощью команды **show ip interface brief**, что интерфейсы G0/0 и G0/1 получили адреса 192.168.0.1 и 192.168.0.65 и работают (up в столбцах «Status» и «Protocol»).

        ```
        CustomerRouter#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         192.168.0.1     YES manual up                    up
        GigabitEthernet0/1         192.168.0.65    YES manual up                    up
        ```

        **Шаг 7.** Сохраните текущую конфигурацию в загрузочную командой **copy running-config startup-config** и подтвердите имя файла клавишей Enter.

        ```
        CustomerRouter#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```
    - title: "Настройка коммутаторов и компьютеров"
      body: |
        **Шаг 1.** На коммутаторе LAN-A перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса VLAN 1 командой **interface vlan 1**.

        **Шаг 2.** Назначьте интерфейсу второй адрес узла подсети LAN-A командой **ip address 192.168.0.2 255.255.255.192** и включите его командой **no shutdown**. Вернитесь в режим глобальной конфигурации командой **exit**.

        **Шаг 3.** Задайте шлюз по умолчанию — интерфейс G0/0 маршрутизатора CustomerRouter — командой **ip default-gateway 192.168.0.1** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        LAN-A#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        LAN-A(config)#interface vlan 1
        LAN-A(config-if)#ip address 192.168.0.2 255.255.255.192
        LAN-A(config-if)#no shutdown
        *Mar  1 00:02:04.273: %LINK-5-CHANGED: Interface Vlan1, changed state to up
        *Mar  1 00:02:04.273: %LINEPROTO-5-UPDOWN: Line protocol on Interface Vlan1, changed state to up
        LAN-A(config-if)#exit
        LAN-A(config)#ip default-gateway 192.168.0.1
        LAN-A(config)#end
        *Mar  1 00:02:13.605: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Кадры узлов коммутатор пересылает независимо от своего IP-адреса. Адрес интерфейса VLAN 1 и шлюз по умолчанию нужны для управления: к коммутатору можно подключиться по сети, в том числе из другой подсети.

        **Шаг 4.** Откройте консоль коммутатора LAN-B, нажмите Enter и перейдите в привилегированный режим EXEC командой **enable**. Аналогично назначьте интерфейсу VLAN 1 второй адрес узла подсети LAN-B (**ip address 192.168.0.66 255.255.255.192**, **no shutdown**) и задайте шлюз по умолчанию — интерфейс G0/1 маршрутизатора — командой **ip default-gateway 192.168.0.65**.

        ```
        LAN-B>enable
        LAN-B#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        LAN-B(config)#interface vlan 1
        LAN-B(config-if)#ip address 192.168.0.66 255.255.255.192
        LAN-B(config-if)#no shutdown
        *Mar  1 00:02:30.575: %LINK-5-CHANGED: Interface Vlan1, changed state to up
        *Mar  1 00:02:30.575: %LINEPROTO-5-UPDOWN: Line protocol on Interface Vlan1, changed state to up
        LAN-B(config-if)#exit
        LAN-B(config)#ip default-gateway 192.168.0.65
        LAN-B(config)#end
        *Mar  1 00:02:39.910: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 5.** В приложении «Командная строка» компьютера PC-A задайте последний адрес узла подсети LAN-A, маску подсети и шлюз по умолчанию командой **ipconfig 192.168.0.62 255.255.255.192 192.168.0.1**. Убедитесь с помощью команды **ipconfig**, что они заданы.

        ```
        C:\>ipconfig 192.168.0.62 255.255.255.192 192.168.0.1
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:D1FF:FE20:9701
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.0.62
           Subnet Mask.....................: 255.255.255.192
           Default Gateway.................: 192.168.0.1
        ```

        **Шаг 6.** Откройте окно компьютера PC-B и на вкладке «Рабочий стол» запустите приложение «Командная строка». Аналогично задайте последний адрес узла подсети LAN-B командой **ipconfig 192.168.0.126 255.255.255.192 192.168.0.65** и проверьте настройки командой **ipconfig**.

        ```
        C:\>ipconfig 192.168.0.126 255.255.255.192 192.168.0.65
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:BAFF:FE1C:1901
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.0.126
           Subnet Mask.....................: 255.255.255.192
           Default Gateway.................: 192.168.0.65
        ```
    - title: "Проверка связи"
      body: |
        **Шаг 1.** Убедитесь, что индикаторы всех соединений на схеме горят зеленым («Соединение активно» в условных обозначениях): после включения интерфейсов маршрутизатора на это уходит около 30 секунд.

        **Шаг 2.** В приложении «Командная строка» компьютера PC-A проверьте связь со шлюзом по умолчанию командой **ping 192.168.0.1**. Компьютер PC-A получает ответы от интерфейса G0/0 маршрутизатора.

        ```
        C:\>ping 192.168.0.1

        Pinging 192.168.0.1 with 32 bytes of data:

        Reply from 192.168.0.1: bytes=32 time=1ms TTL=255
        Reply from 192.168.0.1: bytes=32 time<1ms TTL=255
        Reply from 192.168.0.1: bytes=32 time<1ms TTL=255
        Reply from 192.168.0.1: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.0.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 3.** Ответьте на вопрос 21 в форме ответов.

        **Шаг 4.** В приложении «Командная строка» компьютера PC-B проверьте связь со шлюзом по умолчанию командой **ping 192.168.0.65**. Компьютер PC-B получает ответы от интерфейса G0/1 маршрутизатора.

        ```
        C:\>ping 192.168.0.65

        Pinging 192.168.0.65 with 32 bytes of data:

        Reply from 192.168.0.65: bytes=32 time=1ms TTL=255
        Reply from 192.168.0.65: bytes=32 time<1ms TTL=255
        Reply from 192.168.0.65: bytes=32 time<1ms TTL=255
        Reply from 192.168.0.65: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.0.65:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 5.** Ответьте на вопрос 22 в форме ответов.

        **Шаг 6.** В приложении «Командная строка» компьютера PC-A проверьте связь с компьютером PC-B командой **ping 192.168.0.126**. Компьютер PC-B отвечает: маршрутизатор CustomerRouter передает пакеты между подсетями LAN-A и LAN-B, поэтому значение TTL в ответах на единицу меньше, чем при отправке (128).

        ```
        C:\>ping 192.168.0.126

        Pinging 192.168.0.126 with 32 bytes of data:

        Reply from 192.168.0.126: bytes=32 time=1ms TTL=127
        Reply from 192.168.0.126: bytes=32 time=1ms TTL=127
        Reply from 192.168.0.126: bytes=32 time=1ms TTL=127
        Reply from 192.168.0.126: bytes=32 time=1ms TTL=127

        Ping statistics for 192.168.0.126:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 7.** Ответьте на вопрос 23 в форме ответов.

        **Шаг 8.** На маршрутизаторе CustomerRouter проверьте связь с коммутаторами LAN-A командой **ping 192.168.0.2** и LAN-B командой **ping 192.168.0.66**. В выводе команды ping на маршрутизаторе символ «!» означает полученный ответ, а «.» — эхо-запрос без ответа: первый запрос может остаться без ответа, пока маршрутизатор определяет MAC-адрес коммутатора по протоколу ARP.

        ```
        CustomerRouter#ping 192.168.0.2
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.0.2, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 1/2/4 ms
        CustomerRouter#ping 192.168.0.66
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.0.66, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 1/2/4 ms
        ```

        **Примечание.** Если какая-либо проверка не проходит, сверьте адреса, маски подсети и шлюзы по умолчанию устройств с таблицей адресации на странице «Составление схемы адресации».
