    - title: "Начальное состояние"
      body: |
        - На схеме размещены маршрутизаторы East и West, коммутаторы Switch1–Switch4, точка доступа AccessPoint, компьютеры PC1–PC9, ноутбук Laptop и планшет TabletPC. Кабелей между ними нет.
        - На маршрутизаторах заданы имена устройств и IP-адреса интерфейсов по таблице адресации. На интерфейсе S0/0/0 маршрутизатора East задана тактовая частота (clock rate) последовательного канала, а на маршрутизаторе West — маршрут по умолчанию через East.
        - На коммутаторах задано только имя устройства.
        - На компьютерах, ноутбуке и планшете заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - Точка доступа AccessPoint раздает беспроводную сеть Default без защиты; консоли у нее нет. Ноутбук Laptop и планшет TabletPC находятся в зоне ее действия, но к сети еще не подключены.

        **Шаг 1.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Проверьте связь со шлюзом по умолчанию командой **ping 172.29.1.1**. Эхо-запросы не выполняются: сообщение «General failure» означает, что сетевой адаптер компьютера ни к чему не подключен.

        ```
        C:\>ping 172.29.1.1

        Pinging 172.29.1.1 with 32 bytes of data:

        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.

        Ping statistics for 172.29.1.1:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```
    - title: "Определение интерфейсов маршрутизатора East"
      body: |
        **Шаг 1.** Наведите указатель на компьютер PC1, нажмите «Соединить» над ним и щелкните маршрутизатор East. В окне выбора кабеля выберите тип «Консольный» и посмотрите на поля «Порт PC1» и «Порт East»: в них указаны порты, к которым подключается консольный кабель. Нажмите «Отмена»: консольный кабель в этой лабораторной работе не нужен.

        **Шаг 2.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 3.** Откройте консоль маршрутизатора East и нажмите Enter. Выведите сведения об устройстве командой **show version**. Строки над строкой о памяти конфигурации перечисляют интерфейсы маршрутизатора по типам.

        ```
        East>show version
        NSALAB NetOS Software, NR11 Software (NR11-NETOS-M), Version 0.1.0, RELEASE SOFTWARE
        Copyright (c) 2026 NSALAB

        East uptime is 0 minutes
        System returned to ROM by power-on
        System image file is "flash:nr11-netos-0.1.0.bin"

        NSALAB NR11 (revision 1.0) with 524288K/65536K bytes of memory.
        Processor board ID NSA00000001
        4 FastEthernet interfaces
        2 Gigabit Ethernet interfaces
        2 Serial(sync/async) interfaces
        256K bytes of non-volatile configuration memory.

        Configuration register is 0x2102
        ```

        **Примечание.** Интерфейсы Ethernet (FastEthernet и Gigabit Ethernet) подключают маршрутизатор к локальным сетям (LAN), а последовательные интерфейсы (Serial) — к каналам глобальной сети (WAN).

        **Шаг 4.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 5.** Выведите краткие сведения об интерфейсах командой **show ip interface brief**. Все интерфейсы находятся в состоянии down: кабели не подключены. Интерфейс S0/0/1 выключен администратором (administratively down), а Vlan1 — виртуальный интерфейс: он существует только в ОС маршрутизатора.

        ```
        East>show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         172.30.1.1      YES manual down                  down
        GigabitEthernet0/1         172.31.1.1      YES manual down                  down
        Serial0/0/0                10.10.10.1      YES manual down                  down
        Serial0/0/1                unassigned      YES unset  administratively down down
        FastEthernet0/1/0          unassigned      YES unset  down                  down
        FastEthernet0/1/1          unassigned      YES unset  down                  down
        FastEthernet0/1/2          unassigned      YES unset  down                  down
        FastEthernet0/1/3          unassigned      YES unset  down                  down
        Vlan1                      172.29.1.1      YES manual up                    down
        ```

        **Шаг 6.** Ответьте на вопрос 3 в форме ответов.

        **Шаг 7.** Выведите сведения об интерфейсе G0/0 командой **show interfaces gigabitethernet 0/0**. Пропускная способность интерфейса указана в строке MTU, в значении BW.

        ```
        East>show interfaces gigabitethernet 0/0
        GigabitEthernet0/0 is down, line protocol is down
          Hardware is Gigabit Ethernet, address is 00d0.343d.d901 (bia 00d0.343d.d901)
          Internet address is 172.30.1.1/24
          MTU 1500 bytes, BW 1000000 Kbit/sec, DLY 10 usec,
             reliability 255/255, txload 1/255, rxload 1/255
          Encapsulation ARPA, loopback not set
        …
        ```

        **Шаг 8.** Ответьте на вопрос 4 в форме ответов.

        **Шаг 9.** Аналогично выведите сведения об интерфейсе S0/0/0 командой **show interfaces serial 0/0/0**.

        ```
        East>show interfaces serial 0/0/0
        Serial0/0/0 is down, line protocol is down
          Hardware is NetOS serial
          Internet address is 10.10.10.1/30
          MTU 1500 bytes, BW 1544 Kbit/sec, DLY 20000 usec,
             reliability 255/255, txload 1/255, rxload 1/255
          Encapsulation HDLC, crc 16, loopback not set
        …
        ```

        **Примечание.** Пропускная способность (BW) последовательного интерфейса используется протоколами маршрутизации для выбора лучшего пути к сети назначения. Она не равна фактической скорости канала, которую согласуют с поставщиком услуг.

        **Шаг 10.** Ответьте на вопрос 5 в форме ответов.
    - title: "Определение модулей"
      body: |
        **Примечание.** Модульный маршрутизатор или коммутатор расширяют модулями. Модуль устанавливают в слот, и его порты получают имена по номеру слота: например, GigabitEthernet5/1 — порт 1 модуля в слоте 5, а FastEthernet0/1/0 — порт 0 модуля в подслоте 1 слота 0.

        **Шаг 1.** Компьютеры PC1, PC2 и PC3 подключаются прямо к маршрутизатору East, без отдельного коммутатора. Найдите в выводе команды **show ip interface brief** на маршрутизаторе East интерфейсы FastEthernet0/1/0–FastEthernet0/1/3. У них нет своих IP-адресов: это порты модуля коммутатора, и они работают в сети VLAN 1, адрес которой 172.29.1.1 задан на интерфейсе Vlan1. Этот адрес — шлюз по умолчанию компьютеров PC1–PC3.

        **Шаг 2.** Ответьте на вопросы 6 и 7 в форме ответов.

        **Шаг 3.** Откройте консоль коммутатора Switch2, нажмите Enter и выведите краткие сведения об интерфейсах командой **show ip interface brief**. Номера интерфейсов показывают, в какие слоты установлены модули коммутатора.

        ```
        Switch2>show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        FastEthernet0/1            unassigned      YES unset  down                  down
        FastEthernet1/1            unassigned      YES unset  down                  down
        FastEthernet2/1            unassigned      YES unset  down                  down
        GigabitEthernet3/1         unassigned      YES unset  down                  down
        GigabitEthernet5/1         unassigned      YES unset  down                  down
        Vlan1                      unassigned      YES unset  administratively down down
        ```

        **Шаг 4.** Наведите указатель на коммутатор Switch2, нажмите «Соединить» и щелкните коммутатор Switch3. В окне выбора кабеля выберите тип «Оптика»: в полях «Порт Switch2» и «Порт Switch3» остается только порт оптоволоконного модуля. Нажмите «Отмена»: кабели вы проложите на следующей странице.

        **Шаг 5.** Ответьте на вопросы 8 и 9 в форме ответов.
    - title: "Подключение устройств"
      body: |
        **Примечание.** Медный прямой кабель соединяет устройства разных типов: коммутатор с маршрутизатором, компьютером или точкой доступа, а также компьютер с портом модуля коммутатора маршрутизатора. Медный перекрестный кабель соединяет однотипные устройства, например два коммутатора. Если тип медного кабеля не подходит к портам, окно выбора кабеля предупреждает об этом, а соединение не устанавливается.

        **Шаг 1.** Проложите кабель между маршрутизатором East и коммутатором Switch1: наведите указатель на East, нажмите «Соединить» над ним и щелкните Switch1. В окне выбора кабеля оставьте тип «Медный прямой» и порт G0/0 в поле «Порт East», в поле «Порт Switch1» выберите G0/1 и нажмите «Соединить».

        **Шаг 2.** Аналогично проложите остальные кабели типа «Медный прямой» по таблице соединений на странице «Топология и адресация»: от маршрутизатора East к коммутатору Switch4 и к компьютерам PC1, PC2 и PC3, от коммутатора Switch1 к компьютерам PC4, PC5 и PC6, от коммутатора Switch2 к компьютерам PC7, PC8, PC9 и к точке доступа AccessPoint. Каждый раз выбирайте порты обоих устройств по таблице: окно выбора кабеля предлагает первые свободные порты, и они не всегда совпадают с таблицей.

        **Шаг 3.** Соедините коммутатор Switch4 (порт G0/2) с коммутатором Switch3 (порт G3/1) кабелем типа «Медный перекрёстный». Если оставить тип «Медный прямой», окно выбора кабеля предупредит: «✗ Прямой кабель между двумя коммутаторами: соединение не установится — нужен перекрёстный».

        **Шаг 4.** Соедините коммутаторы Switch3 и Switch2 кабелем типа «Оптика» (порты G5/1 на обоих коммутаторах).

        **Шаг 5.** Соедините маршрутизаторы последовательным кабелем. Начните соединение с маршрутизатора East: наведите указатель на East, нажмите «Соединить» и щелкните West. Выберите тип «Последовательный» и порты S0/0/0 на обоих маршрутизаторах. Если навести указатель на проложенный кабель, рядом с ним появится надпись «последовательный кабель, DCE — East».

        **Примечание.** На последовательном канале одна сторона, DCE, задает тактовую частоту, а другая, DTE, принимает ее. DCE становится конец кабеля, с которого начато соединение, а тактовая частота в этой лабораторной работе задана на интерфейсе S0/0/0 маршрутизатора East.

        **Шаг 6.** Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым («Соединение активно» в условных обозначениях). Сразу после подключения порты коммутаторов около 30 секунд проверяют, нет ли в сети петли, и их индикаторы показывают «Порт заблокирован STP» или «Соединение устанавливается». Если индикаторы кабеля остались красными («Соединение отключено»), щелкните кабель правой кнопкой мыши, выберите «Сменить тип кабеля…» или «Удалить соединение» и проложите кабель заново.

        **Шаг 7.** Подключите ноутбук Laptop к беспроводной сети точки доступа: откройте окно ноутбука, на вкладке «Рабочий стол» запустите приложение «Беспроводная сеть» и откройте вкладку «Сети». В списке — сеть Default точки доступа AccessPoint; выберите ее и нажмите «Подключиться». Сеть без защиты, поэтому ключ не запрашивается. На вкладке «Состояние» показано подключение к сети Default через точку доступа AccessPoint. Так же подключите планшет TabletPC.

        **Примечание.** Точка доступа соединяет беспроводные устройства с проводной сетью: кадры ноутбука и планшета проходят через ее порт Port 0 к коммутатору Switch2, а друг другу ноутбук и планшет передают кадры через саму точку доступа.
    - title: "Проверка подключения"
      body: |
        **Шаг 1.** В консоли маршрутизатора East снова выведите краткие сведения об интерфейсах командой **show ip interface brief**. Подключенные интерфейсы теперь в состоянии up/up. Интерфейс S0/0/1 по-прежнему выключен, а F0/1/3 остается в состоянии down: к нему ничего не подключено.

        ```
        East>show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         172.30.1.1      YES manual up                    up
        GigabitEthernet0/1         172.31.1.1      YES manual up                    up
        Serial0/0/0                10.10.10.1      YES manual up                    up
        Serial0/0/1                unassigned      YES unset  administratively down down
        FastEthernet0/1/0          unassigned      YES unset  up                    up
        FastEthernet0/1/1          unassigned      YES unset  up                    up
        FastEthernet0/1/2          unassigned      YES unset  up                    up
        FastEthernet0/1/3          unassigned      YES unset  down                  down
        Vlan1                      172.29.1.1      YES manual up                    up
        ```

        **Шаг 2.** В приложении «Командная строка» компьютера PC1 проверьте связь с маршрутизатором West командой **ping 10.10.10.2**. Эхо-запросы выполняются успешно: пакеты проходят через модуль коммутатора маршрутизатора East и последовательный канал.

        ```
        C:\>ping 10.10.10.2

