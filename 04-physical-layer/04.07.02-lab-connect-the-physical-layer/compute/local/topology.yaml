scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        В начале лабораторной работы кабелей нет: по этой таблице соединений вы проложите их на странице «Подключение устройств». В столбце «Кабель» указан тип кабеля так, как он называется в окне выбора кабеля.

        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный прямой | East | G0/0 | Switch1 | G0/1 |
        | Медный прямой | East | G0/1 | Switch4 | G0/1 |
        | Медный прямой | East | F0/1/0 | PC1 | F0 |
        | Медный прямой | East | F0/1/1 | PC2 | F0 |
        | Медный прямой | East | F0/1/2 | PC3 | F0 |
        | Медный прямой | Switch1 | F0/1 | PC4 | F0 |
        | Медный прямой | Switch1 | F0/2 | PC5 | F0 |
        | Медный прямой | Switch1 | F0/3 | PC6 | F0 |
        | Медный перекрёстный | Switch4 | G0/2 | Switch3 | G3/1 |
        | Оптика | Switch3 | G5/1 | Switch2 | G5/1 |
        | Медный прямой | Switch2 | F0/1 | PC7 | F0 |
        | Медный прямой | Switch2 | F1/1 | PC8 | F0 |
        | Медный прямой | Switch2 | F2/1 | PC9 | F0 |
        | Медный прямой | Switch2 | G3/1 | AccessPoint | Port 0 |
        | Последовательный | East | S0/0/0 | West | S0/0/0 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию |
        |---|---|---|---|---|
        | East | G0/0 | 172.30.1.1 | 255.255.255.0 | — |
