    - code: ACCESSPOINT.PORTS.PORT0-LINK
      name: Port 0.Link to Switch2.Connects to GigabitEthernet3/1
      description: Port 0 соединён с Switch2 G3/1
      skills:
      - Physical
      max_mark: 1
      steps:
      - name: a cable AccessPoint Port 0 — Switch2 GigabitEthernet3/1
        code: check
        type: check
        device: Switch2
        action_chain:
        - action: validate_web_response
          action_vars:
            name: http://{lab_ip}:7681/api/topology
