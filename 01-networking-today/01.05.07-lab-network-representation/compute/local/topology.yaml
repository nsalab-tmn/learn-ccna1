        | D2 | G0/2 | 10.255.255.253 | 255.255.255.252 | — | — |
        | S1 | Vlan2 | 10.2.0.2 | 255.255.255.0 | 10.2.0.1 | — |
        | S2 | Vlan1 | 10.3.0.2 | 255.255.255.0 | 10.3.0.1 | — |
        | PC1 | NIC | 10.2.0.11 | 255.255.255.0 | 10.2.0.1 | 10.10.10.2 |
        | PC2 | NIC | 10.2.0.12 | 255.255.255.0 | 10.2.0.1 | 10.10.10.2 |
        | PC3 | NIC | 10.3.0.11 | 255.255.255.0 | 10.3.0.1 | 10.10.10.2 |
        | PC4 | NIC | 10.3.0.12 | 255.255.255.0 | 10.3.0.1 | 10.10.10.2 |
        | CentralServer | NIC | 10.10.10.2 | 255.255.255.0 | 10.10.10.1 | — |
        | ISP-Tier3a | G0/0 | 64.104.222.1 | 255.255.255.252 | — | — |
        | ISP-Tier3a | G0/1 | 64.104.223.1 | 255.255.255.252 | — | — |
        | ISP-Tier3a | S0/0/0 | 64.100.100.2 | 255.255.255.252 | — | — |
        | ISP-Tier3a | S0/0/1 | 64.100.150.2 | 255.255.255.252 | — | — |
        | ISP-Tier3b | F0/1 | 128.107.46.1 | 255.255.255.0 | — | — |
        | ISP-Tier3b | G0/1 | 64.104.222.2 | 255.255.255.252 | — | — |
        | ISP-Tier3b | G0/2 | 64.100.8.1 | 255.255.255.0 | — | — |
        | famous-dns | NIC | 64.100.8.8 | 255.255.255.0 | 64.100.8.1 | — |
        | netacad | NIC | 128.107.46.11 | 255.255.255.0 | 128.107.46.1 | — |
        | WRS | LAN | 192.168.0.1 | 255.255.255.0 | — | — |
        | HomeDesktop | NIC | 192.168.0.101 | 255.255.255.0 | 192.168.0.1 | 192.168.0.1 |
        | Home-Laptop | NIC | 192.168.0.100 | 255.255.255.0 | 192.168.0.1 | 192.168.0.1 |
        | Tablet | NIC | 192.168.0.102 | 255.255.255.0 | 192.168.0.1 | 192.168.0.1 |

        Сеть 172.16.0.0/24 — это Branch Office, сети 10.2.0.0/24, 10.3.0.0/24 и 10.10.10.0/24 — Intercity, сеть 192.168.0.0/24 — Home City. Сети 10.255.255.x/30 соединяют между собой маршрутизаторы и коммутаторы Intercity, а сети 64.100.x.x, 64.104.x.x и 128.107.46.0/24 принадлежат поставщику услуг и серверам Интернета.
    - title: "Начальное состояние"
      body: |
        - Маршрутизаторы R4, R2 и ISP-Tier3a настроены: интерфейсам назначены адреса по таблице, между площадками заданы статические маршруты. На R4 включено преобразование сетевых адресов (NAT с перегрузкой): узлы Branch Office выходят во внешние сети под одним адресом.
        - Коммутаторы D1 и D2 сети Intercity выполняют маршрутизацию и обмениваются маршрутами с R2 по протоколу OSPF. Коммутатор ISP-Tier3b тоже маршрутизирует.
        - Компьютеры, ноутбуки и серверы имеют адреса, маски подсети и шлюзы по умолчанию по таблице адресации. Адрес DNS-сервера указан у компьютеров и ноутбуков: в Branch Office это BranchServer, в Intercity — CentralServer, в Home City — WRS.
        - Серверы BranchServer и CentralServer работают как DNS-серверы и как веб-серверы. BranchServer хранит записи для имен branchserver.pka, netacad.pka и centralserver.pka, CentralServer — для имен centralserver.pka, netacad.pka и famous.dns.pka. Сервер famous-dns работает как DNS-сервер (famous.dns.pka и netacad.pka), а у сервера netacad есть веб-страница.
        - Принтеры, IP-телефоны, модем и два облака только нарисованы: у них нет консоли и нет настроек. Поэтому сеть Home City работает только внутри: WRS, HomeDesktop, Home-Laptop и Tablet видят друг друга, но трафик за пределы домашней сети не выходит.
        - Трафика в сети еще не было, поэтому таблицы ARP компьютеров пусты. Настраивать в этой лабораторной работе ничего не нужно.

        **Шаг 1.** Найдите на кабелях зеленые индикаторы («Соединение активно» в условных обозначениях): у работающих устройств они горят сразу после открытия схемы, а если еще нет, подождите несколько секунд. Индикаторы у нарисованных устройств (принтеров, IP-телефонов, модема и облаков) тоже зеленые, но трафика по этим кабелям нет, а у коаксиального кабеля между Modem и Cable-Provider индикаторов нет. Маршрутизаторам Intercity нужно еще немного времени, чтобы обменяться маршрутами: проверяйте связь не раньше чем через минуту после запуска.
    - title: "Определение областей и устройств сети"
      body: |
        На схеме видны три области с подписями и сеть поставщика услуг между ними.

        | Область | Что в ней |
        |---|---|
        | Branch Office | сеть филиала: R4, S4, Wireless-AP, BranchServer, Sales, Accounting, Guest, Smart-Phone, Laser, IP-Phone0, IP-Phone1 |
        | Intercity | сеть офиса в другом городе: R2, D1, D2, S1, S2, S3, PC1, PC2, PC3, PC4, CentralServer, облако Intranet |
        | Home City | домашняя сеть: Cable-Provider, Modem, WRS, HomeDesktop, Home-Laptop, Tablet, Inkjet |
        | без подписи | поставщик услуг: ISP-Tier3a, ISP-Tier3b, famous-dns, netacad |

        **Шаг 1.** Нажмите «Добавить устройство» над схемой. Откроется «Палитра» с фильтрами «Все», «Сетевые» и «Оконечные». Нажмите «Сетевые»: в палитре останутся «Маршрутизатор», «Коммутатор L2» и «Коммутатор L3». Нажмите «Оконечные»: останутся «ПК», «Ноутбук» и «Сервер». Нажмите «Закрыть», ничего не добавляя.

        **Шаг 2.** Найдите на схеме промежуточные устройства, которых нет в палитре: точку доступа Wireless-AP, домашний маршрутизатор WRS и модем Modem. Ответьте на вопрос 1 в форме ответов.

        **Примечание.** Оконечное устройство создает данные или получает их: компьютер, ноутбук, сервер, принтер, IP-телефон. Промежуточное устройство соединяет оконечные устройства и передает данные между ними и между сетями: маршрутизатор, коммутатор, точка доступа. Облака обозначают сети, которых на схеме нет, поэтому к устройствам не относятся.

        **Шаг 3.** Не считая облаков, сосчитайте значки оконечных устройств: у каждого из них только одно соединение, кабельное или беспроводное. Ответьте на вопрос 2 в форме ответов.

        **Шаг 4.** Не считая облаков, сосчитайте значки промежуточных устройств: у каждого из них несколько соединений. Ответьте на вопрос 3 в форме ответов.

        **Шаг 5.** Определите, сколько из оконечных устройств не являются настольными компьютерами. Ответьте на вопрос 4 в форме ответов.

        **Шаг 6.** Под схемой найдите условные обозначения и посмотрите, какие виды подключений в них перечислены. Наведите указатель на любое соединение на схеме: в подсказке появятся устройства, порты и вид кабеля, например «BranchServer F0 — S4 F0/1 (медный кабель)». Ответьте на вопрос 5 в форме ответов.

        **Примечание.** Коаксиальный кабель между Modem и Cable-Provider на схеме показан такой же линией, как медный: это рисунок, а не работающее соединение.
    - title: "Назначение устройств"
      body: |
        Серверами на схеме служат устройства типа «Сервер»: BranchServer, CentralServer, famous-dns и netacad. У них в окне есть вкладка «Службы», у компьютеров и ноутбуков ее нет.

        **Шаг 1.** Щелкните компьютер PC1 в сети Intercity: откроется окно устройства. На вкладке «Рабочий стол» запустите приложение «Командная строка» и проверьте связь с сервером CentralServer командой **ping 10.10.10.2**.

        ```
        C:\>ping 10.10.10.2

        Pinging 10.10.10.2 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Reply from 10.10.10.2: bytes=32 time=2ms TTL=126
        Reply from 10.10.10.2: bytes=32 time=2ms TTL=126

        Ping statistics for 10.10.10.2:
            Packets: Sent = 4, Received = 2, Lost = 2 (50% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Примечание.** Первые эхо-запросы могут пропасть: узлы и маршрутизаторы на пути еще не знают MAC-адресов соседей и узнают их по протоколу ARP. Когда таблицы ARP заполнены, потерь нет.

        **Шаг 2.** Узнайте IP-адрес сервера netacad по имени командой **nslookup netacad.pka**. Компьютер PC1 выступает клиентом: он спрашивает DNS-сервер, адрес которого указан в строке Server, а сервер отвечает.

        ```
        C:\>nslookup netacad.pka

        Server: [10.10.10.2]
        Address:  10.10.10.2

        Non-authoritative answer:
        Name:   netacad.pka
        Address:   128.107.46.11
        ```

        **Шаг 3.** Проверьте связь с сервером по имени командой **ping netacad.pka**. Компьютер сначала запрашивает адрес у DNS-сервера, а затем отправляет эхо-запросы на найденный адрес.

        ```
        C:\>ping netacad.pka

        Pinging 128.107.46.11 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Reply from 128.107.46.11: bytes=32 time=2ms TTL=124
        Reply from 128.107.46.11: bytes=32 time=2ms TTL=124

        Ping statistics for 128.107.46.11:
            Packets: Sent = 4, Received = 2, Lost = 2 (50% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** На вкладке «Рабочий стол» запустите приложение «Веб-браузер», введите в поле «Адрес» http://netacad.pka и нажмите «Перейти». Открывается страница с заголовком «Web server» и строкой «The HTTP service on this server is running.»: браузер выступил клиентом, а netacad — веб-сервером.

        **Шаг 5.** Откройте окно компьютера Sales в сети Branch Office. В приложении «Командная строка» выполните команды **nslookup branchserver.pka** и **nslookup netacad.pka**. В строке Server теперь адрес 172.16.0.3: компьютеры этой сети спрашивают свой сервер BranchServer.

        ```
        C:\>nslookup branchserver.pka

        Server: [172.16.0.3]
        Address:  172.16.0.3

        Non-authoritative answer:
        Name:   branchserver.pka
        Address:   172.16.0.3

        C:\>nslookup netacad.pka

        Server: [172.16.0.3]
        Address:  172.16.0.3

        Non-authoritative answer:
        Name:   netacad.pka
        Address:   128.107.46.11
        ```

        **Шаг 6.** Проверьте связь с сервером netacad командой **ping netacad.pka**. Запросы проходят через маршрутизатор R4 и сеть поставщика услуг.

        ```
        C:\>ping netacad.pka

        Pinging 128.107.46.11 with 32 bytes of data:

        Reply from 128.107.46.11: bytes=32 time=2ms TTL=125
        Reply from 128.107.46.11: bytes=32 time=2ms TTL=125
        Reply from 128.107.46.11: bytes=32 time=2ms TTL=125
        Reply from 128.107.46.11: bytes=32 time=2ms TTL=125

        Ping statistics for 128.107.46.11:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 7.** В приложении «Веб-браузер» компьютера Sales откройте http://branchserver.pka, а затем http://netacad.pka. Оба раза открывается страница «Web server».

        **Шаг 8.** Щелкните сервер CentralServer и откройте вкладку «Службы». В списке выберите DNS: в таблице записи, по которым сервер отвечает на запросы.

        | № | Имя | Тип | Значение |
        |---|---|---|---|
        | 1 | centralserver.pka | A | 10.10.10.2 |
        | 2 | netacad.pka | A | 128.107.46.11 |
        | 3 | famous.dns.pka | A | 64.100.8.8 |

        **Шаг 9.** Ответьте на вопрос 6 в форме ответов.

        **Шаг 10.** Наведите указатель на маршрутизатор R2 и нажмите «Осмотреть R2». Откроется таблица устройства: вкладка «MAC» недоступна, потому что у маршрутизатора нет такой таблицы. Откройте вкладку «Маршруты»: по этим записям маршрутизатор решает, куда отправить пакет. Коды в столбце «Код»: `C` — подключенная сеть, `L` — адрес самого интерфейса, `O` — маршрут, полученный по протоколу OSPF, `S*` — статический маршрут по умолчанию.

        | Код | Сеть | Через |
        |---|---|---|
        | `S*` | 0.0.0.0/0 | 64.100.100.2 |
        | `O` | 10.2.0.0/24 | 10.255.255.246 |
        | `O` | 10.3.0.0/24 | 10.255.255.250 |
        | `C` | 10.10.10.0/24 | G0/2 |
        | `L` | 10.10.10.1/32 | G0/2 |
        | `C` | 10.255.255.244/30 | G0/0 |
        | `L` | 10.255.255.245/32 | G0/0 |
        | `C` | 10.255.255.248/30 | G0/1 |
        | `L` | 10.255.255.249/32 | G0/1 |
        | `O` | 10.255.255.252/30 | 10.255.255.246 |
        | `O` | 10.255.255.252/30 | 10.255.255.250 |
        | `C` | 64.100.100.0/30 | S0/0/0 |
        | `L` | 64.100.100.1/32 | S0/0/0 |
        | `C` | 64.100.200.0/30 | S0/0/1 |
        | `L` | 64.100.200.2/32 | S0/0/1 |

        **Шаг 11.** Закройте таблицу и нажмите «Осмотреть S4». На вкладке «MAC» коммутатор показывает, за каким портом находится каждый узел, чьи кадры он видел. Вкладка «Маршруты» недоступна: коммутатор S4 не маршрутизирует.

        | VLAN | MAC | Порт |
        |---|---|---|
        | 1 | 00d0.53b6.0301 | G0/1 |
        | 1 | 00d0.6ded.b801 | F0/1 |
        | 1 | 00d0.89fd.f701 | F0/3 |

        **Шаг 12.** Нажмите «Осмотреть PC1» и откройте вкладку «IP-настройки»: это то, что нужно оконечному устройству, чтобы обмениваться данными.

        | Параметр | Значение |
        |---|---|
        | IPv4-адрес | 10.2.0.11 |
        | Маска | 255.255.255.0 |
        | Шлюз | 10.2.0.1 |
        | DNS-сервер | 10.10.10.2 |

        **Примечание.** Таблицы в окне «Осмотреть» обновляются сами, поэтому строки и MAC-адреса у вас могут отличаться от показанных.

        **Шаг 13.** Ответьте на вопрос 7 в форме ответов.

        **Шаг 14.** Откройте таблицу кабелей на первой странице. Сравните, какие кабели соединяют устройства внутри площадок, а какие — маршрутизаторы друг с другом и с облаком Intranet. Ответьте на вопрос 8 в форме ответов.
    - title: "Сравнение локальных и глобальных сетей"
      body: |
        Локальная сеть охватывает одну площадку и принадлежит одной организации. Глобальная сеть соединяет площадки на большом расстоянии, и ее каналы обычно арендуют у поставщика услуг.

        **Шаг 1.** Нажмите «Консоль R2» над маршрутизатором R2 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и выведите сводку интерфейсов командой **show ip interface brief**. Интерфейсы GigabitEthernet0/0, GigabitEthernet0/1 и GigabitEthernet0/2 подключены к локальной сети Intercity (D1, D2 и S3). Интерфейсы Serial0/0/0 и Serial0/0/1 — последовательные: первый ведет к маршрутизатору поставщика услуг ISP-Tier3a, второй — к облаку Intranet, то есть в глобальную сеть.

        ```
        R2>enable
        R2#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         10.255.255.245  YES manual up                    up
        GigabitEthernet0/1         10.255.255.249  YES manual up                    up
        GigabitEthernet0/2         10.10.10.1      YES manual up                    up
        Serial0/0/0                64.100.100.1    YES manual up                    up
        Serial0/0/1                64.100.200.2    YES manual up                    up
        ```

        **Шаг 2.** В приложении «Командная строка» компьютера PC1 выполните трассировку маршрута к серверу netacad командой **tracert netacad.pka**. Первые два узла (10.2.0.1 — D1 и 10.255.255.245 — R2) находятся в локальной сети Intercity, третий (64.100.100.2) — маршрутизатор ISP-Tier3a на другом конце последовательного канала, а дальше пакет проходит по сети поставщика услуг.

        ```
        C:\>tracert netacad.pka

        Tracing route to 128.107.46.11 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  10.2.0.1
          2     1 ms     1 ms     1 ms  10.255.255.245
          3     1 ms     1 ms     1 ms  64.100.100.2
          4     2 ms     2 ms     2 ms  64.104.222.2
          5     2 ms     2 ms     2 ms  128.107.46.11

        Trace complete.
        ```

        **Шаг 3.** Ответьте на вопросы 9, 10 и 11 в форме ответов. Опирайтесь на таблицу кабелей на первой странице: последовательные кабели идут между маршрутизаторами и к облакам, а внутри площадок устройства соединены медными кабелями и радиоканалом.

        **Шаг 4.** Откройте окно компьютера HomeDesktop в области Home City и в приложении «Командная строка» проверьте связь с домашним маршрутизатором WRS командой **ping 192.168.0.1**.

        ```
        C:\>ping 192.168.0.1

        Pinging 192.168.0.1 with 32 bytes of data:

        Reply from 192.168.0.1: bytes=32 time<1ms TTL=255
        Reply from 192.168.0.1: bytes=32 time<1ms TTL=255
        Reply from 192.168.0.1: bytes=32 time<1ms TTL=255
        Reply from 192.168.0.1: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.0.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```

        **Шаг 5.** Откройте окно ноутбука Tablet и проверьте связь с компьютером HomeDesktop командой **ping 192.168.0.101**. Ноутбук подключен к WRS по радиоканалу, а ответы идут: беспроводные устройства входят в локальную сеть так же, как проводные.

        ```
        C:\>ping 192.168.0.101

        Pinging 192.168.0.101 with 32 bytes of data:

        Reply from 192.168.0.101: bytes=32 time=1ms TTL=128
        Reply from 192.168.0.101: bytes=32 time<1ms TTL=128
        Reply from 192.168.0.101: bytes=32 time<1ms TTL=128
        Reply from 192.168.0.101: bytes=32 time<1ms TTL=128

        Ping statistics for 192.168.0.101:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Примечание.** Выход Home City во внешние сети показан только рисунком: модем Modem, коаксиальный кабель и облако Cable-Provider не моделируются, поэтому домашняя сеть на этой схеме работает как локальная и в Интернет не выходит.

        **Шаг 6.** Ответьте на вопросы 12, 13 и 14 в форме ответов. Для вопроса 12 используйте устройства поставщика услуг на схеме, для вопроса 13 — область Home City, для вопроса 14 — последовательный канал между R4 и ISP-Tier3a.
    - title: "Добавление оконечного устройства"
      body: |
        **Шаг 1.** Нажмите «Добавить устройство», выберите фильтр «Оконечные» и щелкните плитку «ПК». В свободном месте схемы появится новый компьютер PC5. Он добавляется выключенным: значок бледный. Нажмите «Закрыть».

        **Шаг 2.** Подключите PC5 к коммутатору S4 сети Branch Office: нажмите «Соединить» над PC5 и потяните к S4. Откроется окно выбора кабеля, и в нем уже выбран «Тип кабеля» «Медный прямой»: компьютер и коммутатор — устройства разных видов, им нужен прямой кабель. В полях «Порт PC5» и «Порт S4» оставьте первые свободные порты (F0 и F0/2) и нажмите «Соединить».

        **Примечание.** Медный кабель подбирают по видам устройств на концах: между устройствами разных видов (компьютер и коммутатор, коммутатор и маршрутизатор) нужен прямой кабель, между однотипными (два коммутатора, два маршрутизатора, два компьютера) — перекрестный. Если выбрать «Медный перекрёстный» между PC5 и S4, окно предупредит: «✗ Перекрёстный кабель между коммутатором и компьютером: соединение не установится — нужен прямой».

        **Шаг 3.** Наведите указатель на новое соединение: в подсказке «PC5 F0 — S4 F0/2 (медный прямой кабель)». Над PC5 нажмите «Включить PC5» и подождите около 30 секунд, пока индикаторы соединения не покажут «Соединение активно».

        **Шаг 4.** Щелкните PC5 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Когда загрузка закончится и появится «Press RETURN to get started!», нажмите Enter. Выведите настройки компьютера командой **ipconfig** и проверьте связь с сервером BranchServer командой **ping 172.16.0.3**. У нового компьютера нет IP-адреса, поэтому эхо-запросы не отправляются. Локальный адрес канала IPv6 (FE80::…) у вас может отличаться.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:64FF:FE1E:3701
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0

        C:\>ping 172.16.0.3

        Pinging 172.16.0.3 with 32 bytes of data:

        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.

        Ping statistics for 172.16.0.3:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 5.** На вкладке «Рабочий стол» окна PC5 запустите приложение «IP-конфигурация». Выберите «Статический» и введите: «IPv4-адрес» 172.16.0.20, «Маска» 255.255.255.0, «Шлюз по умолчанию» 172.16.0.1 и «DNS-сервер» 172.16.0.3. Поле сохраняется сразу, как только вы выходите из него или нажимаете Enter.

        **Шаг 6.** Вернитесь в приложение «Командная строка» и повторите **ipconfig** и **ping 172.16.0.3**. Теперь настройки на месте, а BranchServer отвечает.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:64FF:FE1E:3701
           IPv6 Address....................: ::
           IPv4 Address....................: 172.16.0.20
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 172.16.0.1

        C:\>ping 172.16.0.3

        Pinging 172.16.0.3 with 32 bytes of data:

        Reply from 172.16.0.3: bytes=32 time=1ms TTL=128
        Reply from 172.16.0.3: bytes=32 time<1ms TTL=128
        Reply from 172.16.0.3: bytes=32 time<1ms TTL=128
        Reply from 172.16.0.3: bytes=32 time<1ms TTL=128

        Ping statistics for 172.16.0.3:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 7.** Ответьте на вопрос 15 в форме ответов.
    - title: "Добавление промежуточного устройства"
      body: |
        **Шаг 1.** Нажмите «Добавить устройство», выберите фильтр «Сетевые» и щелкните плитку «Маршрутизатор». В свободном месте схемы появится выключенный маршрутизатор R1. Нажмите «Закрыть».

        **Шаг 2.** Подключите R1 к коммутатору S4: нажмите «Соединить» над R1, потяните к S4, оставьте «Медный прямой» (маршрутизатор и коммутатор — устройства разных видов) и первые свободные порты и нажмите «Соединить». Если вы выполняли предыдущую страницу, порты будут G0/0 у R1 и F0/9 у S4.

        **Шаг 3.** Нажмите «Включить R1» и подождите около 30 секунд. Индикаторы нового соединения не загорятся зеленым. Наведите указатель на индикатор у R1: «R1 G0/0 — порт выключен командой shutdown». Индикатор у S4 говорит: «S4 F0/9 — соединение отключено (сосед: shutdown)».

        **Шаг 4.** Нажмите «Консоль R1». На вопрос «Would you like to enter the initial configuration dialog? [yes/no]:» ответьте no. Когда появится «Press RETURN to get started!», нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и выведите сводку интерфейсов командой **show ip interface brief**. У новых интерфейсов нет IP-адресов, и все они выключены.

        ```
        Would you like to enter the initial configuration dialog? [yes/no]: no


        Press RETURN to get started!

        Router>enable
        Router#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  administratively down down
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        Serial0/0/0                unassigned      YES unset  administratively down down
        Serial0/0/1                unassigned      YES unset  administratively down down
        ```

        **Шаг 5.** Ответьте на вопрос 16 в форме ответов.
    - title: "Построение двух небольших сетей"
      body: |
        Постройте в свободной области схемы две небольшие локальные сети, соединенные глобальной. Свободная область — правый верхний угол схемы: правее серверов famous-dns и netacad и выше принтера Laser. Устройства получают первые свободные имена; ниже даны имена для последовательного выполнения страниц, у вас они могут отличаться.

        **Шаг 1.** Нажмите «Добавить устройство» и перетащите плитки из палитры в этот угол: два «ПК», два «Коммутатор L2» и два «Маршрутизатор». Разместите их двумя колонками: в каждой сверху вниз стоят компьютер, коммутатор и маршрутизатор. В левой колонке получатся PC6, S5 и R3, в правой — PC7, S6 и R5. Нажмите «Закрыть». Если устройство появилось не в углу, а посреди схемы, перетащите его в угол прямо на схеме.

        **Шаг 2.** В каждой колонке соедините компьютер с коммутатором и коммутатор с маршрутизатором кабелем «Медный прямой»: нажмите «Соединить» над компьютером или маршрутизатором и потяните к коммутатору. Соедините маршрутизаторы R3 и R5 кабелем «Последовательный»: нажмите «Соединить» над R3 и потяните к R5. Порты оставьте первыми свободными.

        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный прямой | PC6 | F0 | S5 | F0/1 |
        | Медный прямой | R3 | G0/0 | S5 | F0/2 |
        | Медный прямой | PC7 | F0 | S6 | F0/1 |
        | Медный прямой | R5 | G0/0 | S6 | F0/2 |
        | Последовательный | R3 | S0/0/0 | R5 | S0/0/0 |

        **Шаг 3.** Нажмите «Включить» над каждым из шести устройств и подождите около минуты. Наведите указатель на последовательное соединение: в подсказке «R3 S0/0/0 — R5 S0/0/0 (последовательный кабель, DCE — R3)». Конец DCE — тот, от которого проложен кабель.

        **Шаг 4.** Откройте окно компьютера PC6 и в приложении «Командная строка» нажмите Enter, когда появится «Press RETURN to get started!». Выведите настройки командой **ipconfig**.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:53FF:FEDA:BC01
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```

        **Шаг 5.** Нажмите «Консоль R3» и ответьте no на вопрос о начальной настройке. Когда появится «Press RETURN to get started!», нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и выведите сводку интерфейсов командой **show ip interface brief**.

        ```
        Would you like to enter the initial configuration dialog? [yes/no]: no


        Press RETURN to get started!

        Router>enable
        Router#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  administratively down down
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        Serial0/0/0                unassigned      YES unset  administratively down down
        Serial0/0/1                unassigned      YES unset  administratively down down
        ```

        **Шаг 6.** Подумайте, чего не хватает, чтобы компьютеры двух сетей обменивались данными, и запишите свои предположения для себя: форма ответов их не требует. Когда вы научитесь настраивать маршрутизаторы, вернитесь к построенной сети и доведите ее до рабочего состояния.
