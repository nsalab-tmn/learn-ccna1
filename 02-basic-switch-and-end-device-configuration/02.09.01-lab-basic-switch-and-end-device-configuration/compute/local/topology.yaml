scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | S1 | F0/1 | S2 | F0/1 |
        | Медный | PC-A | F0 | S1 | F0/6 |
        | Медный | PC-B | F0 | S2 | F0/18 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети |
        |---|---|---|---|
        | S1 | VLAN 1 | 192.168.1.1 | 255.255.255.0 |
        | S2 | VLAN 1 | 192.168.1.2 | 255.255.255.0 |
        | PC-A | NIC | 192.168.1.10 | 255.255.255.0 |
        | PC-B | NIC | 192.168.1.11 | 255.255.255.0 |

        Все устройства находятся в одной сети 192.168.1.0/24, поэтому шлюз по умолчанию им не нужен.
    - title: "Начальное состояние"
      body: |
        - Коммутаторы S1 и S2 соединены кабелем и не настроены: все их параметры имеют значения по умолчанию, в том числе имя устройства (приглашение Switch>). Паролей на них нет.
        - На компьютерах PC-A и PC-B IP-адреса не заданы.

        В начальном состоянии у компьютера PC-A нет IPv4-адреса: команда **ipconfig** в приложении «Командная строка» выводит адрес и маску 0.0.0.0.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:D1FF:FE20:9701
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```

        В консоли коммутатора S1 команда **show ip interface brief | include Vlan** в привилегированном режиме EXEC показывает, что интерфейс VLAN 1 выключен (administratively down) и не имеет адреса.

        ```
        Switch>enable
        Switch#show ip interface brief | include Vlan
        Vlan1                      unassigned      YES unset  administratively down down
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами.
    - title: "Базовая настройка коммутаторов"
      body: |
        **Требование 1.** Имя устройства первого коммутатора — S1, второго — S2. Имена чувствительны к регистру и должны совпадать точно.

        **Требование 2.** На коммутаторах S1 и S2 пароль привилегированного режима EXEC — class. Он задан как секретный пароль (enable secret) и хранится в конфигурации в виде хеша.

        **Требование 3.** На обоих коммутаторах вход с консоли защищен паролем cisco: консоль запрашивает пароль при входе.

        **Требование 4.** На обоих коммутаторах вход по всем линиям виртуальных терминалов (VTY 0–15) защищен паролем cisco.

        **Требование 5.** На обоих коммутаторах пароли, которые хранятся в конфигурации открытым текстом, зашифрованы.

        **Требование 6.** На обоих коммутаторах при подключении выводится баннер дня (MOTD) с предупреждением о том, что доступ разрешен только авторизованным пользователям. Текст баннера выбираете вы.
    - title: "Настройка IP-адресации"
      body: |
        **Требование 7.** Интерфейс VLAN 1 каждого коммутатора включен и имеет IP-адрес и маску подсети из таблицы адресации.

        **Требование 8.** У компьютеров PC-A и PC-B IPv4-адреса и маски подсети — из таблицы адресации.

        **Примечание.** Кадры между компьютерами коммутатор передает и без IP-адреса. Адрес на интерфейсе VLAN 1 нужен, чтобы управлять самим коммутатором по сети и проверять связь с ним.
    - title: "Сохранение конфигурации"
      body: |
        **Требование 9.** Текущая конфигурация коммутаторов S1 и S2 сохранена в загрузочную конфигурацию (startup-config).
    - title: "Проверка связи"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC-A проверьте связь с компьютером PC-B командой **ping 192.168.1.11**. Компьютер PC-B отвечает: кадры проходят через коммутаторы S1 и S2.

        ```
        C:\>ping 192.168.1.11

        Pinging 192.168.1.11 with 32 bytes of data:

        Reply from 192.168.1.11: bytes=32 time=2ms TTL=128
        Reply from 192.168.1.11: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.11: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.11: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.1.11:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        **Шаг 2.** С компьютера PC-A проверьте связь с коммутатором S1 командой **ping 192.168.1.1**. Коммутатор S1 отвечает: его интерфейс VLAN 1 включен и имеет адрес.

        ```
        C:\>ping 192.168.1.1

        Pinging 192.168.1.1 with 32 bytes of data:

        Reply from 192.168.1.1: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.1: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.1: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.1: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.1.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```

        **Шаг 3.** Откройте окно компьютера PC-B и в приложении «Командная строка» проверьте связь с коммутатором S2 командой **ping 192.168.1.2**. Коммутатор S2 отвечает.

        ```
        C:\>ping 192.168.1.2

        Pinging 192.168.1.2 with 32 bytes of data:

        Reply from 192.168.1.2: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.2: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.2: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.2: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.1.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```

        **Шаг 4.** Выйдите из консоли коммутатора S1 командой **exit** и снова нажмите Enter. Консоль выводит ваш баннер дня и запрашивает пароль: введите cisco. Так же проверьте консоль коммутатора S2.
