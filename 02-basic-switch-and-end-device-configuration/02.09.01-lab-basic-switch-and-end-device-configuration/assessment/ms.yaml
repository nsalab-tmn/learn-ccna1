  - code: PC-A.CONNECTIVITY-TESTS
    name: Connectivity Tests
    aspects:
    - code: PC-A.CONNECTIVITY-TESTS.CT-0
      name: 'PC-A to 192.168.1.11 : 192.168.1.11 (ICMP)'
      description: 'PC-A → 192.168.1.11 (PING): проходит'
      skills:
      - Other
      max_mark: 3
      steps:
      - name: 'ping -n 2 192.168.1.11: has : bytes='
        code: check
        type: check
        device: PC-A
        action_chain:
        - action: verify_output
          action_vars:
            command: ping -n 2 192.168.1.11
            assert_tags:
            - ': bytes='
            tags_are_present: true
            retries: 3
            retry_interval: 15
    - code: PC-A.CONNECTIVITY-TESTS.CT-1
      name: 'PC-A to 192.168.1.1 : 192.168.1.1 (ICMP)'
