    - title: "Начальное состояние"
      body: |
        - Коммутаторы S1 и S2 не настроены: все их параметры имеют значения по умолчанию, в том числе имя устройства. На схеме коммутаторы подписаны S1 и S2, но в их конфигурации имя устройства — Switch (приглашение Switch>).
        - Пароли на коммутаторах не заданы, а конфигурация в NVRAM не сохранялась.
        - Компьютеры PC1 и PC2 подключены к коммутаторам и в этой лабораторной работе не настраиваются.

        **Шаг 1.** Откройте консоль коммутатора S1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**: приглашение Switch> сменяется на Switch#. В привилегированном режиме EXEC доступны все команды коммутатора, в том числе команда **configure**, которая открывает режимы настройки.

        **Шаг 2.** Выведите текущую конфигурацию коммутатора командой **show running-config**. Конфигурация по умолчанию содержит имя устройства Switch, интерфейсы коммутатора без настроек, интерфейс Vlan1 без адреса и линии: консоль (line con 0) и линии VTY. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение Switch#.

        ```
        Switch>enable
        Switch#show running-config
        Building configuration...

        Current configuration : 949 bytes
        !
        version 0.1
        !
        hostname Switch
        !
        !
        !
        spanning-tree mode pvst
        spanning-tree extend system-id
        !
        interface FastEthernet0/1
        !
        interface FastEthernet0/2
        !
        interface FastEthernet0/3
        !
        interface FastEthernet0/4
        !
        interface FastEthernet0/5
        !
        interface FastEthernet0/6
        !
        interface FastEthernet0/7
        !
        interface FastEthernet0/8
        !
        interface FastEthernet0/9
        !
        interface FastEthernet0/10
        !
        interface FastEthernet0/11
        !
        interface FastEthernet0/12
        !
        interface FastEthernet0/13
        !
        interface FastEthernet0/14
        !
        interface FastEthernet0/15
        !
        interface FastEthernet0/16
        !
        interface FastEthernet0/17
        !
        interface FastEthernet0/18
        !
        interface FastEthernet0/19
        !
        interface FastEthernet0/20
        !
        interface FastEthernet0/21
        !
        interface FastEthernet0/22
        !
        interface FastEthernet0/23
        !
        interface FastEthernet0/24
        !
        interface GigabitEthernet0/1
        !
        interface GigabitEthernet0/2
        !
        interface Vlan1
         no ip address
         shutdown
        !
        line con 0
        !
        line vty 0 4
         login
        !
        line vty 5 15
         login
        !
        end
        ```

        **Шаг 3.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 4.** Ответьте на вопрос 2 в форме ответов.

        **Примечание.** Линия консоли (line con 0) — подключение к коммутатору через его консольный порт. Линии VTY (virtual terminal) — виртуальные линии, через которые к коммутатору подключаются удаленно, по сети, по протоколу Telnet или SSH. Каждый сеанс удаленного подключения занимает одну линию VTY.

        **Шаг 5.** Ответьте на вопрос 3 в форме ответов.

        **Шаг 6.** Выведите загрузочную конфигурацию, которая хранится в энергонезависимой памяти NVRAM, командой **show startup-config**. Коммутатор отвечает «startup-config is not present».

        ```
        Switch#show startup-config
        startup-config is not present
        ```

        **Шаг 7.** Ответьте на вопрос 4 в форме ответов.

        **Шаг 8.** Ответьте на вопрос 5 в форме ответов.
    - title: "Настройка имени устройства и пароля консоли"
      body: |
        **Шаг 1.** На коммутаторе S1 перейдите в режим глобальной конфигурации командой **configure terminal** и задайте имя устройства командой **hostname S1**. Приглашение сразу меняется на S1(config)#. Вернитесь в привилегированный режим EXEC командой **exit**.

        ```
        Switch#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Switch(config)#hostname S1
        S1(config)#exit
        ```

        **Шаг 2.** Снова перейдите в режим глобальной конфигурации командой **configure terminal** и к настройке линии консоли командой **line console 0**.

        **Шаг 3.** Задайте пароль консоли командой **password letmein** и включите проверку пароля при входе командой **login**. Вернитесь в привилегированный режим EXEC, дважды выполнив команду **exit**: первая возвращает из настройки линии в режим глобальной конфигурации, вторая — в привилегированный режим EXEC.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#line console 0
        S1(config-line)#password letmein
        S1(config-line)#login
        S1(config-line)#exit
        S1(config)#exit
        ```

        **Шаг 4.** Убедитесь, что консоль защищена паролем: выйдите из привилегированного режима командой **exit**. Коммутатор завершает сеанс консоли («S1 con0 is now available») и предлагает нажать Enter («Press RETURN to get started.»).

        **Шаг 5.** Нажмите Enter. Коммутатор запрашивает пароль консоли («User Access Verification», «Password:»). Введите пароль **letmein** и нажмите Enter: символы пароля на экране не отображаются, а после входа появляется приглашение пользовательского режима EXEC S1>.

        ```
        S1#exit


        S1 con0 is now available





        Press RETURN to get started.


        User Access Verification

        Password: 
        ```

        **Шаг 6.** Ответьте на вопрос 6 в форме ответов.

        **Примечание.** Команда password только задает пароль линии, а проверку пароля при входе включает команда login. Если после выхода коммутатор не запрашивает пароль, на линии консоли не выполнена команда login.
    - title: "Защита привилегированного режима EXEC"
      body: |
        **Шаг 1.** На коммутаторе S1 перейдите в привилегированный режим EXEC командой **enable**: пароль пока не запрашивается. Перейдите в режим глобальной конфигурации командой **configure terminal**.

        **Шаг 2.** Задайте пароль привилегированного режима командой **enable password c1$c0** и вернитесь в привилегированный режим EXEC командой **exit**. Последний символ пароля — цифра ноль, а не буква O.

        ```
        S1>enable
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#enable password c1$c0
        S1(config)#exit
        ```

        **Шаг 3.** Выйдите из привилегированного режима командой **exit**, нажмите Enter и войдите с паролем консоли **letmein**.

        **Шаг 4.** Перейдите в привилегированный режим EXEC командой **enable**. Теперь коммутатор запрашивает пароль привилегированного режима: введите **c1$c0**.

        ```
        S1#exit


        S1 con0 is now available





        Press RETURN to get started.


        User Access Verification

        Password: 
        S1>enable
        Password: 
        ```

        **Шаг 5.** Выведите текущую конфигурацию командой **show running-config**. Пароль привилегированного режима (строка enable password) и пароль консоли (строка password в разделе line con 0) хранятся открытым текстом: их увидит любой, кто видит экран администратора или копию конфигурации. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение S1#.

        ```
        S1#show running-config
        Building configuration...

        Current configuration : 992 bytes
        !
        version 0.1
        !
        hostname S1
        !
        enable password c1$c0
        !
        !
        spanning-tree mode pvst
        spanning-tree extend system-id
        !
        interface FastEthernet0/1
        !
        …
        interface Vlan1
         no ip address
         shutdown
        !
        line con 0
         password letmein
         login
        !
        line vty 0 4
         login
        !
        line vty 5 15
         login
        !
        end
        ```

        **Примечание.** Слова команды можно сокращать до первых букв, если сокращение однозначно определяет слово в текущем режиме: **config t** — это **configure terminal**, а **show run** — **show running-config**.

        **Шаг 6.** Задайте пароль привилегированного режима, который хранится в зашифрованном виде: перейдите в режим глобальной конфигурации сокращенной командой **config t**, задайте пароль командой **enable secret itsasecret** и вернитесь в привилегированный режим EXEC командой **exit**.

        ```
        S1#config t
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#enable secret itsasecret
        S1(config)#exit
        ```

        **Примечание.** Пароль enable secret заменяет пароль enable password: если заданы оба, для перехода в привилегированный режим EXEC подходит только пароль enable secret, а пароль c1$c0 коммутатор больше не принимает.

        **Шаг 7.** Выведите текущую конфигурацию сокращенной командой **show run**. В конфигурации появилась строка enable secret, а строка enable password осталась без изменений. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение S1#.

        ```
        S1#show run
        Building configuration...

        Current configuration : 1033 bytes
        !
        version 0.1
        !
        hostname S1
        !
        enable secret 5 $1$mERr$aaFgycF7RyVFzB8m
        enable password c1$c0
        …
        ```

        **Шаг 8.** Ответьте на вопрос 7 в форме ответов.

        **Шаг 9.** Ответьте на вопрос 8 в форме ответов.

        **Примечание.** Пароль enable secret хранится в конфигурации не сам по себе, а в виде хеша (цифра 5 перед ним обозначает тип хеша): по хешу коммутатор проверяет введенный пароль, а восстановить по нему пароль нельзя.

        **Шаг 10.** Зашифруйте пароли, которые хранятся открытым текстом: перейдите в режим глобальной конфигурации командой **config t**, выполните команду **service password-encryption** и вернитесь в привилегированный режим EXEC командой **exit**.

        ```
        S1#config t
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#service password-encryption
        S1(config)#exit
        ```

        **Шаг 11.** Убедитесь с помощью команды **show run**, что пароли зашифрованы: в начале конфигурации появилась строка service password-encryption, а вместо паролей в строках enable password и password раздела line con 0 стоит цифра 7 и зашифрованное значение. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение S1#.

        ```
        S1#show run
        Building configuration...

        Current configuration : 1081 bytes
        !
        version 0.1
        service password-encryption
        !
        hostname S1
        !
        enable secret 5 $1$mERr$aaFgycF7RyVFzB8m
        enable password 7 00074242070B
        !
        !
        spanning-tree mode pvst
        spanning-tree extend system-id
        !
        interface FastEthernet0/1
        !
        …
        interface Vlan1
         no ip address
         shutdown
        !
        line con 0
         password 7 00081612095E0208
         login
        !
        line vty 0 4
         login
        !
        line vty 5 15
         login
        !
        end
        ```

        **Шаг 12.** Ответьте на вопрос 9 в форме ответов.

        **Примечание.** Команда service password-encryption шифрует пароли, уже заданные открытым текстом, и пароли, которые задаются позже, пока команда остается в конфигурации. Это обратимое шифрование (тип 7): оно скрывает пароли от случайного взгляда на экран, но не заменяет хеш, поэтому пароль привилегированного режима задают командой enable secret.
    - title: "Настройка баннера MOTD и сохранение конфигурации"
      body: |
        **Шаг 1.** На коммутаторе S1 перейдите в режим глобальной конфигурации командой **config t** и задайте баннер MOTD командой **banner motd "This is a secure system. Authorized Access Only!"**. Вернитесь в привилегированный режим EXEC командой **exit**.

        ```
        S1#config t
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#banner motd "This is a secure system. Authorized Access Only!"
        S1(config)#exit
        ```

        **Примечание.** Текст баннера заключают в символы-разделители: коммутатор считает баннером все, что стоит между первым разделителем и следующим таким же. Здесь разделитель — двойная кавычка, поэтому в самом тексте ее быть не должно.

        **Шаг 2.** Выйдите из привилегированного режима командой **exit** и нажмите Enter. Войдите с паролем консоли **letmein** и перейдите в привилегированный режим EXEC командой **enable** с паролем **itsasecret**: пароль c1$c0 коммутатор больше не принимает.

        ```
        S1#exit


        S1 con0 is now available





        Press RETURN to get started.

        This is a secure system. Authorized Access Only!

        User Access Verification

        Password: 
        S1>enable
        Password: 
        ```

        **Шаг 3.** Ответьте на вопрос 10 в форме ответов.

        **Шаг 4.** Ответьте на вопрос 11 в форме ответов.

        **Шаг 5.** Сохраните текущую конфигурацию в NVRAM командой **copy running-config startup-config**. На запрос имени файла («Destination filename [startup-config]?») нажмите Enter, чтобы принять имя по умолчанию.

        ```
        S1#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```

        **Шаг 6.** Проверьте, как коммутатор принимает сокращения: введите **co r s**. Коммутатор отвечает «% Ambiguous command»: с букв co начинается несколько команд привилегированного режима, например configure и copy.

        ```
        S1#co r s
        % Ambiguous command:  "co"
        ```

        **Шаг 7.** Введите сокращение **cop r s** и на запрос имени файла нажмите Enter: сокращение однозначно, и коммутатор снова сохраняет конфигурацию.

        ```
        S1#cop r s
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```

        **Шаг 8.** Ответьте на вопрос 12 в форме ответов.

        **Шаг 9.** Выведите загрузочную конфигурацию командой **show startup-config**. Теперь она есть в NVRAM: в ней те же имя устройства, пароли и баннер, что и в текущей конфигурации, и после перезагрузки коммутатор применит их снова. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение S1#.

        ```
        S1#show startup-config
        Using 1148 out of 262136 bytes
        !
        version 0.1
        service password-encryption
        !
        hostname S1
        !
        enable secret 5 $1$mERr$aaFgycF7RyVFzB8m
        enable password 7 00074242070B
        !
        !
        spanning-tree mode pvst
        spanning-tree extend system-id
        !
        interface FastEthernet0/1
        !
        …
        interface Vlan1
         no ip address
         shutdown
        !
        banner motd ^CThis is a secure system. Authorized Access Only!^C
        !
        line con 0
         password 7 00081612095E0208
         login
        !
        line vty 0 4
         login
        !
        line vty 5 15
         login
        !
        end
        ```

        **Шаг 10.** Ответьте на вопрос 13 в форме ответов.
    - title: "Настройка коммутатора S2"
      body: |
        **Шаг 1.** Откройте консоль коммутатора S2 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**, в режим глобальной конфигурации командой **configure terminal** и задайте имя устройства командой **hostname S2**.

        **Шаг 2.** Аналогично коммутатору S1 защитите консоль паролем: перейдите к настройке линии консоли командой **line console 0**, задайте пароль командой **password letmein** и включите его проверку командой **login**. Вернитесь в режим глобальной конфигурации командой **exit**.

        ```
        Switch>enable
        Switch#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Switch(config)#hostname S2
        S2(config)#line console 0
        S2(config-line)#password letmein
        S2(config-line)#login
        S2(config-line)#exit
        ```

        **Шаг 3.** Задайте пароли привилегированного режима командами **enable password c1$c0** и **enable secret itsasecret**.

        **Шаг 4.** Зашифруйте пароли командой **service password-encryption** и задайте баннер MOTD командой **banner motd "This is a secure system. Authorized Access Only!"**. Вернитесь в привилегированный режим EXEC командой **exit**.

        ```
        S2(config)#enable password c1$c0
        S2(config)#enable secret itsasecret
        S2(config)#service password-encryption
        S2(config)#banner motd "This is a secure system. Authorized Access Only!"
        S2(config)#exit
        ```

        **Шаг 5.** Сохраните конфигурацию командой **copy running-config startup-config** и на запрос имени файла нажмите Enter.

        ```
        S2#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```
    - title: "Проверка конфигурации коммутатора S2"
      body: |
        **Шаг 1.** На коммутаторе S2 выйдите из привилегированного режима командой **exit** и нажмите Enter. Консоль показывает баннер MOTD и запрашивает пароль консоли: введите **letmein**.

        **Шаг 2.** Перейдите в привилегированный режим EXEC командой **enable** с паролем **itsasecret**.

        ```
        S2#exit


        S2 con0 is now available





        Press RETURN to get started.

        This is a secure system. Authorized Access Only!

        User Access Verification

        Password: 
        S2>enable
        Password: 
        ```

        **Шаг 3.** Убедитесь с помощью команды **show running-config**, что конфигурация коммутатора S2 такая же, как у коммутатора S1: имя устройства S2, строка service password-encryption, пароль enable secret в виде хеша, зашифрованные пароль enable password и пароль консоли с командой login, баннер MOTD. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение S2#.

        ```
        S2#show running-config
        Building configuration...

        Current configuration : 1148 bytes
        !
        version 0.1
        service password-encryption
        !
        hostname S2
        !
        enable secret 5 $1$mERr$aaFgycF7RyVFzB8m
        enable password 7 00074242070B
        !
        !
        spanning-tree mode pvst
        spanning-tree extend system-id
        !
        interface FastEthernet0/1
        !
        …
        interface Vlan1
         no ip address
         shutdown
        !
        banner motd ^CThis is a secure system. Authorized Access Only!^C
        !
        line con 0
         password 7 00081612095E0208
         login
        !
        line vty 0 4
         login
        !
        line vty 5 15
         login
        !
        end
        ```

        **Шаг 4.** Убедитесь с помощью команды **show startup-config**, что конфигурация сохранена в NVRAM: в загрузочной конфигурации есть имя устройства S2 и баннер MOTD. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение S2#.

        ```
        S2#show startup-config
        Using 1148 out of 262136 bytes
        !
        version 0.1
        service password-encryption
        !
        hostname S2
        !
        enable secret 5 $1$mERr$aaFgycF7RyVFzB8m
        enable password 7 00074242070B
        !
        !
        spanning-tree mode pvst
        spanning-tree extend system-id
        !
        interface FastEthernet0/1
        !
        …
        interface Vlan1
         no ip address
         shutdown
        !
        banner motd ^CThis is a secure system. Authorized Access Only!^C
        …
        ```
