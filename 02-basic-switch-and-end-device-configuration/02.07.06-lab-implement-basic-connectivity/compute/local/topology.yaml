    - title: "Начальное состояние"
      body: |
        - Коммутаторы S1 и S2 не настроены: у них имя устройства по умолчанию Switch, паролей нет, интерфейсу VLAN 1 не назначен IP-адрес, и он выключен. Загрузочной конфигурации нет.
        - Компьютеры PC1 и PC2 не настроены: их IPv4-адрес и маска подсети равны 0.0.0.0.
        - Порты, к которым подключены кабели, работают.

        **Шаг 1.** Откройте консоль коммутатора S1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**: пароль пока не запрашивается.

        **Шаг 2.** Выведите краткие сведения об интерфейсах командой **show ip interface brief**. Порты F0/1 и F0/2, к которым подключены кабели, работают (up/up), а интерфейсу Vlan1 не назначен адрес (unassigned), и он выключен (administratively down). Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение Switch#.

        ```
        Switch>enable
        Switch#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        FastEthernet0/1            unassigned      YES unset  up                    up
        FastEthernet0/2            unassigned      YES unset  up                    up
        …
        Vlan1                      unassigned      YES unset  administratively down down
        ```

        **Шаг 3.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Выведите параметры сетевого адаптера командой **ipconfig**. IPv4-адрес и маска подсети равны 0.0.0.0: компьютер не настроен.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```
    - title: "Настройка базовых параметров коммутаторов"
      body: |
        **Шаг 1.** В консоли коммутатора S1 перейдите в режим глобальной конфигурации командой **configure terminal** и задайте имя устройства командой **hostname S1**. Приглашение командной строки сразу меняется на S1(config)#.

        **Шаг 2.** Задайте пароль консоли: перейдите к настройке консольной линии командой **line console 0**, задайте пароль командой **password cisco**, включите его запрос при входе командой **login** и вернитесь в режим глобальной конфигурации командой **exit**.

        **Шаг 3.** Задайте пароль привилегированного режима EXEC командой **enable secret class**.

        **Шаг 4.** Задайте баннер дня (MOTD) с предупреждением о несанкционированном доступе командой **banner motd "Authorized access only. Violators will be prosecuted to the full extent of the law."**: кавычки отмечают начало и конец текста баннера. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        Switch#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Switch(config)#hostname S1
        S1(config)#line console 0
        S1(config-line)#password cisco
        S1(config-line)#login
        S1(config-line)#exit
        S1(config)#enable secret class
        S1(config)#banner motd "Authorized access only. Violators will be prosecuted to the full extent of the law."
        S1(config)#end
        *Mar  1 00:01:30.016: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Пароль консоли запрашивается, только если на линии задана команда **login**. Команда **enable secret** хранит пароль привилегированного режима EXEC в конфигурации в зашифрованном виде, а пароль консоли, заданный командой **password**, хранится в ней открытым текстом.

        **Шаг 5.** Проверьте пароли: завершите сеанс командой **exit** и нажмите Enter. Коммутатор выводит баннер и запрашивает пароль консоли (Password:): введите cisco. Вводимый пароль не отображается.

        **Шаг 6.** Перейдите в привилегированный режим EXEC командой **enable**. Теперь коммутатор запрашивает пароль: введите class.

        ```
        S1#exit


        S1 con0 is now available





        Press RETURN to get started.

        Authorized access only. Violators will be prosecuted to the full extent of the law.

        User Access Verification

        Password: 
        S1>enable
        Password: 
        ```

        **Шаг 7.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 8.** Сохраните текущую конфигурацию в загрузочную командой **copy running-config startup-config** и на запрос имени файла (Destination filename [startup-config]?) нажмите Enter.

        ```
        S1#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```

        **Примечание.** Текущая конфигурация (running-config) хранится в оперативной памяти коммутатора и пропадает при его выключении. Загрузочная конфигурация (startup-config) хранится в энергонезависимой памяти (NVRAM), и с нее коммутатор начинает работу после включения.

        **Шаг 9.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 10.** Аналогично настройте коммутатор S2: откройте его консоль, нажмите Enter, перейдите в привилегированный режим EXEC командой **enable**, задайте имя устройства командой **hostname S2**, те же пароль консоли cisco, пароль привилегированного режима EXEC class и баннер и сохраните конфигурацию командой **copy running-config startup-config**.
    - title: "Настройка IP-адресов компьютеров"
      body: |
        **Шаг 1.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «IP-конфигурация». В разделе IPv4 выберите «Статический», в поле «IPv4-адрес» введите 192.168.1.1, а в поле «Маска» — 255.255.255.0. Значение поля сохраняется, когда вы переходите к другому полю или нажимаете Enter: под полем, в котором стоит курсор, написано «Сохраняется сразу».

        **Примечание.** Если после ввода адреса поле «Маска» пустое, в нем появляется маска по умолчанию для класса адреса: для 192.168.1.1 это 255.255.255.0. Шлюз по умолчанию в этой лабораторной работе не нужен: компьютеры обмениваются данными только с устройствами своей сети.

        **Шаг 2.** Откройте окно компьютера PC2 и аналогично задайте ему IPv4-адрес 192.168.1.2 и маску 255.255.255.0.

        **Шаг 3.** В окне компьютера PC1 вернитесь к приложениям рабочего стола кнопкой «К рабочему столу» (✕) и запустите приложение «Командная строка». Убедитесь с помощью команды **ipconfig**, что IPv4-адрес 192.168.1.1 и маска 255.255.255.0 заданы.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.1.1
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 0.0.0.0
        ```

        **Шаг 4.** Проверьте связь с коммутатором S1 командой **ping 192.168.1.253**. Эхо-запросы не выполняются: сообщение «Destination host unreachable» выдает сам компьютер PC1 (192.168.1.1).

        ```
        C:\>ping 192.168.1.253

        Pinging 192.168.1.253 with 32 bytes of data:

        Reply from 192.168.1.1: Destination host unreachable.
        Reply from 192.168.1.1: Destination host unreachable.
        Reply from 192.168.1.1: Destination host unreachable.
        Reply from 192.168.1.1: Destination host unreachable.

        Ping statistics for 192.168.1.253:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 5.** Проверьте связь с компьютером PC2 командой **ping 192.168.1.2**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 192.168.1.2

        Pinging 192.168.1.2 with 32 bytes of data:

        Reply from 192.168.1.2: bytes=32 time=2ms TTL=128
        Reply from 192.168.1.2: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.2: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.2: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.1.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        **Примечание.** Коммутатор пересылает кадры между портами по MAC-адресам, и IP-адрес ему для этого не нужен, поэтому компьютеры PC1 и PC2 обмениваются данными через ненастроенные коммутаторы. Адрес 192.168.1.253 пока не принадлежит ни одному устройству: на ARP-запрос компьютера PC1 о MAC-адресе для него никто не отвечает, и PC1 сообщает, что получатель недоступен.

        **Шаг 6.** Ответьте на вопрос 3 в форме ответов.
    - title: "Настройка интерфейсов управления коммутаторов"
      body: |
        **Шаг 1.** В консоли коммутатора S1 перейдите в режим глобальной конфигурации командой **configure terminal**, а затем к настройке интерфейса VLAN 1 командой **interface vlan 1**.

        **Шаг 2.** Назначьте интерфейсу адрес и маску командой **ip address 192.168.1.253 255.255.255.0** и включите его командой **no shutdown**. Коммутатор сообщает, что интерфейс Vlan1 и протокол канала на нем перешли в состояние up. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        S1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#interface vlan 1
        S1(config-if)#ip address 192.168.1.253 255.255.255.0
        S1(config-if)#no shutdown
        *Mar  1 00:03:02.198: %LINK-5-CHANGED: Interface Vlan1, changed state to up
        *Mar  1 00:03:02.198: %LINEPROTO-5-UPDOWN: Line protocol on Interface Vlan1, changed state to up
        S1(config-if)#end
        *Mar  1 00:03:05.309: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** IP-адрес нужен коммутатору не для пересылки кадров, а для управления самим коммутатором по сети: по этому адресу к нему подключаются удаленно, например по протоколу SSH, и проверяют его доступность командой ping. Адрес назначают интерфейсу VLAN 1 — виртуальному интерфейсу сети VLAN 1, которой по умолчанию принадлежат все порты коммутатора. Этот интерфейс по умолчанию выключен, как показал вывод на странице «Начальное состояние».

        **Шаг 3.** Ответьте на вопрос 4 в форме ответов.

        **Шаг 4.** Ответьте на вопрос 5 в форме ответов.

        **Шаг 5.** Аналогично в консоли коммутатора S2 назначьте интерфейсу VLAN 1 адрес 192.168.1.254 с маской 255.255.255.0 и включите интерфейс.

        **Шаг 6.** Убедитесь с помощью команды **show ip interface brief** на коммутаторе S1, что интерфейсу Vlan1 назначен адрес 192.168.1.253 и он работает (up/up). Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение S1#.

        ```
        S1#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        FastEthernet0/1            unassigned      YES unset  up                    up
        FastEthernet0/2            unassigned      YES unset  up                    up
        …
        Vlan1                      192.168.1.253   YES manual up                    up
        ```

        **Шаг 7.** Сохраните конфигурацию коммутатора S1 командой **copy running-config startup-config** и на запрос имени файла нажмите Enter. Аналогично сохраните конфигурацию коммутатора S2.

        ```
        S1#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```

        ```
        S2#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```

        **Примечание.** Команда **copy running-config startup-config** записывает в загрузочную конфигурацию то, что есть в текущей конфигурации в момент ее выполнения. Загрузочная конфигурация, сохраненная после базовых настроек, не содержит адреса интерфейса VLAN 1, поэтому после изменений конфигурацию сохраняют снова.

        **Шаг 8.** Ответьте на вопрос 6 в форме ответов.
    - title: "Проверка связи"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 проверьте связь с компьютером PC2 командой **ping 192.168.1.2**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 192.168.1.2

        Pinging 192.168.1.2 with 32 bytes of data:

        Reply from 192.168.1.2: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.2: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.2: bytes=32 time=1ms TTL=128
        Reply from 192.168.1.2: bytes=32 time=1ms TTL=128

        Ping statistics for 192.168.1.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 2.** Проверьте связь с коммутатором S1 командой **ping 192.168.1.253**. Теперь коммутатор отвечает: адрес 192.168.1.253 назначен его интерфейсу VLAN 1.

        ```
        C:\>ping 192.168.1.253

        Pinging 192.168.1.253 with 32 bytes of data:

        Reply from 192.168.1.253: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.253: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.253: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.253: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.1.253:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```

        **Шаг 3.** Проверьте связь с коммутатором S2 командой **ping 192.168.1.254**. Коммутатор S2 тоже отвечает.

        ```
        C:\>ping 192.168.1.254

        Pinging 192.168.1.254 with 32 bytes of data:

        Reply from 192.168.1.254: bytes=32 time=1ms TTL=255
        Reply from 192.168.1.254: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.254: bytes=32 time<1ms TTL=255
        Reply from 192.168.1.254: bytes=32 time<1ms TTL=255

        Ping statistics for 192.168.1.254:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 4.** Команда ping есть и у коммутатора. В консоли коммутатора S1 проверьте связь с компьютером PC2 командой **ping 192.168.1.2**. Коммутатор отправляет пять эхо-запросов: восклицательный знак (!) означает полученный ответ, а точка (.) — эхо-запрос, оставшийся без ответа. Первый эхо-запрос остается без ответа, пока коммутатор определяет MAC-адрес компьютера PC2 по протоколу ARP, поэтому успешны 80 процентов эхо-запросов.

        ```
        S1#ping 192.168.1.2
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.1.2, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 1/2/4 ms
        ```

        **Шаг 5.** Повторите команду **ping 192.168.1.2**. Теперь MAC-адрес компьютера PC2 известен коммутатору, и ответы приходят на все пять эхо-запросов.

        ```
        S1#ping 192.168.1.2
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 192.168.1.2, timeout is 2 seconds:
        !!!!!
        Success rate is 100 percent (5/5), round-trip min/avg/max = 1/2/4 ms
        ```
