scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Консольный | PC1 | RS232 | S1 | Console |

        IP-адресов в этой лабораторной работе нет: компьютер PC1 связан с коммутатором S1 только консольным кабелем.
    - title: "Начальное состояние"
      body: |
        - Консольный кабель соединяет порт RS232 компьютера PC1 с консольным портом коммутатора S1.
        - На коммутаторе S1 задано только имя устройства, остальные параметры имеют значения по умолчанию. Часы коммутатора не установлены.
        - У компьютера PC1 нет IP-адреса: в этой лабораторной работе он служит консолью коммутатора.
        - Консоль коммутатора S1 со схемы не открывается: при щелчке по S1 на схеме появляется сообщение: подключитесь с компьютера по консольному кабелю командой terminal.
    - title: "Подключение к консоли и изучение справки"
      body: |
        **Шаг 1.** Щелкните компьютер PC1 на схеме: откроется окно устройства. На вкладке «Рабочий стол» запустите приложение «Командная строка» и введите команду **terminal**. Компьютер подключится по консольному кабелю к консоли коммутатора S1 и сообщит параметры соединения.

        **Шаг 2.** Нажмите Enter, чтобы получить приглашение коммутатора.

        ```
        C:\>terminal
        Connected to S1 console (9600 8N1, no flow control). Press Ctrl+] to return to PC1.

        S1>
        ```

        **Примечание.** Консольное соединение — последовательная линия с параметрами по умолчанию: скорость 9600 бит/с, 8 бит данных, без контроля четности, 1 стоповый бит (8N1) и без управления потоком. Ту же консоль коммутатора открывает приложение «Терминал» на вкладке «Рабочий стол» компьютера PC1. В командной строке компьютера сочетание клавиш Ctrl+] закрывает консоль коммутатора и возвращает к приглашению C:\>.

        **Шаг 3.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 4.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 5.** В приглашении пользовательского режима EXEC S1> введите вопросительный знак **?**. Нажимать Enter не нужно: справка выводится сразу. Коммутатор показывает команды, доступные в этом режиме, с их описаниями.

        ```
        S1>?
          enable      Turn on privileged commands
          exit        Exit from the EXEC
          logout      Exit from the EXEC
          ping        Send echo messages
          show        Show running system information
          ssh         Open a secure shell client connection
          telnet      Open a telnet connection
          terminal    Set terminal line parameters
          traceroute  Trace route to destination
        ```

        **Шаг 6.** Ответьте на вопрос 3 в форме ответов.

        **Шаг 7.** Введите букву **t** и вопросительный знак: **t?**. Справка покажет только команды, которые начинаются с буквы t, а затем коммутатор снова выведет приглашение вместе с уже введенной буквой t.

        ```
        S1>t?
        telnet  terminal  traceroute

        S1>t
        ```

        **Шаг 8.** Ответьте на вопрос 4 в форме ответов.

        **Шаг 9.** Допишите к букве t букву **e** и снова введите вопросительный знак: в строке получится **te?**.

        ```
        S1>te?
        telnet  terminal

        S1>te
        ```

        **Шаг 10.** Ответьте на вопрос 5 в форме ответов.

        **Примечание.** Такая справка называется контекстной: она показывает варианты для того, что уже введено в строке. Чем больше символов команды введено, тем короче список.
    - title: "Изучение режимов EXEC"
      body: |
        **Шаг 1.** Удалите символы te клавишей Backspace (два нажатия) и снова введите **?**. Найдите в списке команду enable и ее описание.

        ```
        S1>?
          enable      Turn on privileged commands
          exit        Exit from the EXEC
          logout      Exit from the EXEC
          ping        Send echo messages
          show        Show running system information
          ssh         Open a secure shell client connection
          telnet      Open a telnet connection
          terminal    Set terminal line parameters
          traceroute  Trace route to destination
        ```

        **Шаг 2.** Ответьте на вопрос 6 в форме ответов.

        **Шаг 3.** Введите **en** и нажмите клавишу Tab.

        ```
        S1>enable 
        ```

        **Шаг 4.** Ответьте на вопрос 7 в форме ответов.

        **Примечание.** Клавиша Tab дописывает начатую команду, если введенных символов достаточно, чтобы определить ее однозначно: с букв en в этом режиме начинается только команда enable. Коммутатор дописывает ее целиком и ставит после нее пробел.

        **Шаг 5.** Нажимайте Backspace, пока после приглашения S1> не останется символов. Введите **te** и нажмите клавишу Tab.

        ```
        S1>te
        ```

        **Шаг 6.** Ответьте на вопрос 8 в форме ответов.

        **Шаг 7.** Удалите символы te клавишей Backspace, введите команду **enable** и нажмите Enter.

        ```
        S1>enable
        S1#
        ```

        **Шаг 8.** Ответьте на вопрос 9 в форме ответов.

        **Примечание.** Приглашение показывает режим: знак > — пользовательский режим EXEC, в котором доступны только команды просмотра и проверки, знак # — привилегированный режим EXEC, в котором доступны все команды просмотра и управления устройством. Команда disable возвращает в пользовательский режим EXEC.

        **Шаг 9.** Введите **?**, чтобы вывести команды привилегированного режима EXEC.

        ```
        S1#?
          clear       Reset functions
          clock       Manage the system clock
          configure   Enter configuration mode
          copy        Copy from one file to another
          debug       Debugging functions (see also 'undebug')
          delete      Delete a file
          dir         List files on a filesystem
          disable     Turn off privileged commands
          enable      Turn on privileged commands
          erase       Erase a filesystem
          exit        Exit from the EXEC
          logout      Exit from the EXEC
          no          Disable debugging functions
          ping        Send echo messages
          release     Release a resource
          reload      Halt and perform a cold restart
          renew       Renew a resource
          show        Show running system information
          ssh         Open a secure shell client connection
          telnet      Open a telnet connection
          terminal    Set terminal line parameters
          traceroute  Trace route to destination
          undebug     Disable debugging functions (see also 'debug')
          write       Write running configuration to memory, network, or terminal
        ```

        **Шаг 10.** Ответьте на вопрос 10 в форме ответов.

        **Шаг 11.** Введите **conf** и нажмите клавишу Tab: коммутатор допишет команду configure. Нажмите Enter. Команда configure без параметра спрашивает, откуда брать конфигурацию, и предлагает в квадратных скобках вариант по умолчанию.

        ```
        S1#configure 
        Configuring from terminal, memory, or network [terminal]? 
        ```

        **Шаг 12.** Ответьте на вопрос 11 в форме ответов.

        **Шаг 13.** Нажмите Enter, чтобы принять вариант по умолчанию terminal.

        ```
        Configuring from terminal, memory, or network [terminal]? 
        Enter configuration commands, one per line.  End with CNTL/Z.
        S1(config)#
        ```

        **Шаг 14.** Ответьте на вопрос 12 в форме ответов.

        **Шаг 15.** Вернитесь в привилегированный режим EXEC командой **exit**.

        ```
        S1(config)#exit
        S1#
        ```

        **Примечание.** В режиме глобальной конфигурации, приглашение которого S1(config)#, изменяют настройки всего устройства, и из него переходят в режимы настройки отдельных интерфейсов и линий. Сразу в этот режим переходят командой configure terminal. В привилегированный режим EXEC из него возвращают команды exit и end и сочетание клавиш Ctrl+Z.
    - title: "Настройка часов"
      body: |
        **Шаг 1.** Выведите время на коммутаторе командой **show clock**.

        ```
        S1#show clock
        *00:00:29.349 UTC Mon Mar 1 1993
        ```

        **Примечание.** Часы коммутатора не установлены: после включения они отсчитывают время от даты по умолчанию, 1 марта 1993 года. Звездочка в начале строки означает, что время не установлено и ему нельзя доверять.

        **Шаг 2.** Ответьте на вопрос 13 в форме ответов.

        **Шаг 3.** Введите команду **clock** и нажмите Enter.

        ```
        S1#clock
        % Incomplete command.
        ```

        **Шаг 4.** Ответьте на вопрос 14 в форме ответов.

        **Шаг 5.** Введите **clock ?** — с пробелом перед вопросительным знаком. Справка покажет не команды, которые начинаются с clock, а параметры, которые могут следовать за командой clock.

        ```
        S1#clock ?
          set  Set the time and date

        S1#clock 
        ```

        **Шаг 6.** Ответьте на вопрос 15 в форме ответов.

        **Шаг 7.** Допишите к строке **set ?**: в строке получится clock set ?. Справка покажет, что следующим параметром команды clock set вводится время.

        ```
        S1#clock set ?
          hh:mm:ss  Current Time

        S1#clock set 
        ```

        **Шаг 8.** Нажмите Enter, не дописывая время, чтобы ввести команду clock set без параметров.

        ```
        S1#clock set 
        % Incomplete command.
        ```

        **Шаг 9.** Ответьте на вопрос 16 в форме ответов.

        **Шаг 10.** Нажмите клавишу со стрелкой вверх (↑): коммутатор вызовет предыдущую команду clock set. Допишите время 15:00 в 24-часовом формате и вопросительный знак: **15:00:00 ?**.

        ```
        S1#clock set 15:00:00 ?
          <1-31>  Day of the month
          MONTH   Month of the year

        S1#clock set 15:00:00 
        ```

        **Шаг 11.** Допишите день и месяц и снова введите вопросительный знак: **31 Jan ?**. Справка покажет, что осталось ввести год, и допустимый диапазон лет.

        ```
        S1#clock set 15:00:00 31 Jan ?
          <1993-2035>  Year

        S1#clock set 15:00:00 31 Jan 
        ```

        **Шаг 12.** Допишите год **2035** и нажмите Enter. Коммутатор устанавливает часы на 15:00:00 31 января 2035 года и сообщает об этом системным сообщением.

        ```
        S1#clock set 15:00:00 31 Jan 2035
        Jan 31 15:00:00.000: %SYS-6-CLOCKUPDATE: System clock has been updated from 00:00:39 UTC Mon Mar 1 1993 to 15:00:00 UTC Wed Jan 31 2035, configured from console by console.
        ```

        **Примечание.** Полная команда — **clock set 15:00:00 31 Jan 2035**: время, день месяца, месяц и год. Месяц вводят английским названием или его первыми тремя буквами. Клавиши со стрелками вверх (↑) и вниз (↓) перебирают ранее введенные команды, и вызванную команду можно дописать или исправить перед нажатием Enter.
    - title: "Изучение сообщений об ошибках"
      body: |
        **Шаг 1.** Введите **cl** и нажмите клавишу Tab. Строка не меняется: с букв cl в привилегированном режиме EXEC начинаются две команды, clear и clock.

        ```
        S1#cl
        ```

        **Шаг 2.** Допишите к строке **ock** и нажмите Enter: получится команда clock без параметров.

        ```
        S1#clock
        % Incomplete command.
        ```

        **Шаг 3.** Введите команду **clock set 25:00:00** и нажмите Enter.

        **Шаг 4.** Введите команду **clock set 15:00:00 32** и нажмите Enter.

        ```
        S1#clock set 25:00:00
                     ^
        % Invalid input detected at '^' marker.

        S1#clock set 15:00:00 32
                              ^
        % Invalid input detected at '^' marker.
        ```

        **Примечание.** Сообщение «% Incomplete command.» означает, что команде не хватает параметров. Сообщение «% Invalid input detected at '^' marker.» означает, что коммутатор не смог разобрать команду, и знак ^ под строкой указывает место ошибки: часов в сутках не может быть 25, а дней в месяце — 32. Команда с ошибкой не выполняется, поэтому часы коммутатора остаются такими, как вы их установили.
    - title: "Проверка настройки часов"
      body: |
        **Шаг 1.** Убедитесь, что часы коммутатора установлены, с помощью команды **show clock**. Коммутатор показывает 31 января 2035 года и время немного позже 15:00:00, а звездочки в начале строки нет: время установлено.

        ```
        S1#show clock
        15:00:06.830 UTC Wed Jan 31 2035
        ```
