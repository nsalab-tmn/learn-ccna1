    - title: "Начальное состояние"
      body: |
        - На маршрутизаторе Building-1 включена маршрутизация IPv6, остальные параметры имеют значения по умолчанию, в том числе имя устройства (приглашение Router>). Интерфейсы маршрутизатора выключены и не имеют адресов.
        - Коммутатор First-Floor-Switch настроен и защищен паролями: его консоль запрашивает пароль, которого у вас нет. Настраивать этот коммутатор не нужно.
        - На коммутаторе Second-Floor-Switch задано только имя устройства, остальные параметры имеют значения по умолчанию.
        - На компьютерах Host-1, Host-2, Host-3 и сервере Server IP-адреса не заданы.

        В консоли маршрутизатора (приглашение Router>) команда **show ip interface brief** в привилегированном режиме EXEC показывает, что оба интерфейса выключены (administratively down) и не имеют адресов.

        ```
        Router>enable
        Router#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  administratively down down
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        ```

        У компьютеров нет IPv4-адреса и глобального IPv6-адреса (**ipconfig** в приложении «Командная строка» компьютера Host-1):

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:EEFF:FEE8:6E01
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами. Значения, отмеченные в таблицах знаком «?», вы определяете сами по требованиям.
    - title: "Расчет плана IPv4-адресации"
      body: |
        **Требование 1.** Сеть 192.168.1.0/24 разделена на подсети по 30 адресов узлов в каждой с минимальной потерей адресов. Подсети нумеруются по порядку, начиная с подсети с адресом 192.168.1.0. Четвертая из этих подсетей — сеть интерфейса G0/0 маршрутизатора Building-1, в которой находятся компьютеры Host-1 и Host-2.

        **Требование 2.** Адресное пространство, начиная с пятой подсети требования 1, снова разделено на подсети по 14 адресов узлов в каждой с минимальной потерей адресов. Вторая из этих новых подсетей — сеть интерфейса G0/1, в которой находятся компьютер Host-3, сервер Server и коммутатор Second-Floor-Switch.

        **Требование 3.** Адреса в подсетях распределены так:

        - интерфейсы G0/0 и G0/1 маршрутизатора Building-1 — последний адрес узла своей подсети;
        - интерфейс VLAN 1 коммутатора Second-Floor-Switch — предпоследний адрес узла подсети интерфейса G0/1;
        - компьютеры и сервер — первые адреса узлов своих подсетей по порядку: в сети интерфейса G0/0 — Host-1, затем Host-2, в сети интерфейса G0/1 — Host-3, затем Server.

        **Примечание.** Подсеть с префиксом /n содержит 2^(32−n) адресов, из них узлам можно назначить на два меньше: первый адрес подсети — сетевой, последний — широковещательный. Подсеть с минимальной потерей адресов — наименьшая подсеть, в которой помещается нужное число адресов узлов.
    - title: "Настройка адресации компьютеров и сервера"
      body: |
        **Требование 4.** У компьютеров Host-1, Host-2, Host-3 и сервера Server IPv4-адрес и маска подсети — по плану адресации, а шлюз по умолчанию — интерфейс маршрутизатора Building-1 в их сети.

        **Требование 5.** У компьютеров и сервера IPv6-адрес и длина префикса — из таблицы адресации, а шлюз IPv6 по умолчанию — локальный адрес канала (LLA) интерфейса маршрутизатора Building-1 в их сети.
    - title: "Начальная настройка и защита маршрутизатора"
      body: |
        **Требование 6.** Имя устройства маршрутизатора — Building-1, с дефисом. Имя чувствительно к регистру и должно совпадать точно.

        **Требование 7.** Маршрутизатор не принимает пароли короче 10 символов.

        **Требование 8.** Пароль привилегированного режима EXEC — Ciscoenpa55. Он задан как секретный пароль (enable secret) и хранится в конфигурации в виде хеша.

        **Требование 9.** Вход с консоли защищен паролем Ciscoconpa55: консоль запрашивает пароль при входе.

        **Требование 10.** Пароли, которые хранятся в конфигурации открытым текстом, зашифрованы.

        **Требование 11.** При подключении к маршрутизатору выводится баннер дня (MOTD) с предупреждением о том, что доступ разрешен только авторизованным пользователям. Текст баннера выбираете вы.

        **Требование 12.** Доменное имя маршрутизатора — ccna-lab.com, и на маршрутизаторе созданы ключи RSA длиной не менее 2048 бит.

        **Требование 13.** На маршрутизаторе есть локальный пользователь Admin1 с паролем Admin1pa55, заданным как секретный пароль (secret).

        **Требование 14.** Линии виртуальных терминалов (VTY) 0–4 маршрутизатора принимают подключения только по протоколу SSH и проверяют имя и пароль пользователя по локальной базе пользователей маршрутизатора.

        **Примечание.** Протокол SSH шифрует весь сеанс удаленного управления, в том числе имя и пароль пользователя, а Telnet передает их открытым текстом. Для SSH маршрутизатору нужны имя устройства, доменное имя и ключи RSA.
    - title: "Настройка интерфейсов маршрутизатора"
      body: |
        **Требование 15.** Интерфейсы G0/0 и G0/1 маршрутизатора Building-1 включены и имеют IPv4-адреса и маски подсети по плану адресации.

        **Требование 16.** У интерфейсов G0/0 и G0/1 есть глобальные индивидуальные IPv6-адреса (GUA) из таблицы адресации с длиной префикса /64, а их локальный адрес канала задан вручную: fe80::1 на обоих интерфейсах.

        **Требование 17.** У интерфейсов G0/0 и G0/1 есть описания, например, к какой сети подключен интерфейс.

        **Примечание.** Локальный адрес канала действует только в пределах своей сети, поэтому на разных интерфейсах маршрутизатора он может совпадать. Простой, заданный вручную адрес fe80::1 удобно указывать узлам как шлюз IPv6 по умолчанию.
    - title: "Настройка коммутатора Second-Floor-Switch"
      body: |
        **Требование 18.** Интерфейс управления коммутатора Second-Floor-Switch — интерфейс VLAN 1 — включен и имеет IPv4-адрес и маску подсети по плану адресации.

        **Требование 19.** Коммутатор может обмениваться данными с узлами других сетей: его шлюз по умолчанию — интерфейс маршрутизатора Building-1 в той же сети, что и интерфейс управления коммутатора.

        **Требование 20.** Линии VTY коммутатора принимают подключения по Telnet, и при подключении коммутатор запрашивает пароль Ciscovtypa55.
    - title: "Проверка связи и удаленного доступа"
      body: |
        После настройки подождите около 30 секунд: порты коммутаторов, к которым подключены включенные интерфейсы маршрутизатора, начинают пересылать кадры не сразу. Первый эхо-запрос может остаться без ответа, пока устройства определяют MAC-адреса друг друга. Затем проверьте результат.

        **Шаг 1.** В приложении «Командная строка» компьютера Host-1 проверьте связь с сервером Server по IPv6 командой **ping 2001:db8:acad:b::15**. Сервер отвечает: маршрутизатор Building-1 пересылает пакеты IPv6 между двумя локальными сетями.

        ```
        C:\>ping 2001:db8:acad:b::15

        Pinging 2001:DB8:ACAD:B::15 with 32 bytes of data:

        Reply from 2001:DB8:ACAD:B::15: bytes=32 time=4ms TTL=127
        Reply from 2001:DB8:ACAD:B::15: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:ACAD:B::15: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:ACAD:B::15: bytes=32 time=1ms TTL=127

        Ping statistics for 2001:DB8:ACAD:B::15:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 4ms, Average = 1ms
        ```

        **Шаг 2.** Откройте окно компьютера Host-3 и в приложении «Командная строка» проверьте связь с компьютером Host-2 по IPv6 командой **ping 2001:db8:acad:a::15**. Компьютер Host-2 отвечает.

        ```
        C:\>ping 2001:db8:acad:a::15

        Pinging 2001:DB8:ACAD:A::15 with 32 bytes of data:

        Reply from 2001:DB8:ACAD:A::15: bytes=32 time=4ms TTL=127
        Reply from 2001:DB8:ACAD:A::15: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:ACAD:A::15: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:ACAD:A::15: bytes=32 time=1ms TTL=127

        Ping statistics for 2001:DB8:ACAD:A::15:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 4ms, Average = 1ms
        ```

        **Шаг 3.** С компьютера Host-1 проверьте связь по IPv4 с компьютером Host-3 и сервером Server командой **ping** с их адресами из вашего плана адресации. Оба узла отвечают.

        **Шаг 4.** С компьютера Host-1 проверьте связь с интерфейсом управления коммутатора Second-Floor-Switch командой **ping** с адресом его интерфейса VLAN 1. Коммутатор отвечает: его интерфейс управления включен, а шлюз по умолчанию позволяет ему ответить узлу другой сети.

        **Шаг 5.** С компьютера Host-1 подключитесь к маршрутизатору по SSH командой **ssh -l Admin1** с адресом интерфейса G0/0 маршрутизатора. Маршрутизатор выводит ваш баннер дня и запрашивает пароль: введите Admin1pa55. Появляется приглашение Building-1>. Завершите сеанс командой **exit**.

        **Шаг 6.** Попробуйте подключиться к маршрутизатору с компьютера Host-1 по Telnet командой **telnet** с тем же адресом. Маршрутизатор отклоняет подключение («% Connection refused by remote host»): линии VTY принимают только SSH.

        **Шаг 7.** В приложении «Командная строка» компьютера Host-3 подключитесь к коммутатору Second-Floor-Switch по Telnet командой **telnet** с адресом его интерфейса VLAN 1. Коммутатор запрашивает пароль: введите Ciscovtypa55. Появляется приглашение Second-Floor-Switch>. Завершите сеанс командой **exit**.

        **Шаг 8.** Выйдите из консоли маршрутизатора Building-1 командой **exit** и снова нажмите Enter. Консоль выводит ваш баннер дня и запрашивает пароль: введите Ciscoconpa55.
