    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1, R2 и R3 заданы IPv4- и IPv6-адреса интерфейсов по таблице адресации и включена маршрутизация IPv6.
        - Маршруты между сетями статические: на маршрутизаторах R1 и R3 заданы маршруты по умолчанию через R2, а на маршрутизаторе R2 — маршруты к локальным сетям R1 и R3, для IPv4 и для IPv6.
        - На компьютерах PC1 и PC2 заданы IPv4- и IPv6-адреса и шлюзы по умолчанию. Их значения вы определите сами.
        - На коммутаторах S1 и S2 параметры имеют значения по умолчанию.
        - Настраивать в этой лабораторной работе ничего не нужно: вы проверяете адресацию и связь в уже настроенной сети.
    - title: "Заполнение таблицы адресации"
      body: |
        **Шаг 1.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка».

        **Шаг 2.** Выведите параметры сетевого адаптера командой **ipconfig /all**. Запишите в таблицу адресации IPv4-адрес (строка «IPv4 Address»), маску подсети («Subnet Mask») и IPv4-шлюз по умолчанию — IPv4-адрес в строке «Default Gateway».

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-84-55-DC-01
           DHCP Enabled....................: No
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: 2001:DB8:1:1::A
           IPv4 Address....................: 10.10.1.100
           Subnet Mask.....................: 255.255.255.224
           Default Gateway.................: FE80::1
                                             10.10.1.97
           DHCP Servers....................: 0.0.0.0
           DNS Servers.....................: 0.0.0.0
        ```

        **Шаг 3.** Откройте окно компьютера PC2 и в приложении «Командная строка» аналогично выведите его параметры командой **ipconfig /all**. Запишите в таблицу IPv4-адрес, маску подсети и IPv4-шлюз по умолчанию компьютера PC2.

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-22-27-60-01
           DHCP Enabled....................: No
           Link-local IPv6 Address.........: FE80::2D0:22FF:FE27:6001
           IPv6 Address....................: 2001:DB8:1:4::A
           IPv4 Address....................: 10.10.1.20
           Subnet Mask.....................: 255.255.255.240
           Default Gateway.................: FE80::3
                                             10.10.1.17
           DHCP Servers....................: 0.0.0.0
           DNS Servers.....................: 0.0.0.0
        ```

        **Примечание.** В строке «Default Gateway» указаны два шлюза: для IPv6 — локальный адрес канала маршрутизатора (FE80::1 у PC1, FE80::3 у PC2), для IPv4 — IPv4-адрес интерфейса маршрутизатора. Шлюзом по умолчанию IPv6-узла обычно служит локальный адрес канала маршрутизатора, а не его глобальный индивидуальный адрес (GUA).

        **Шаг 4.** В приложении «Командная строка» компьютера PC1 выведите параметры IPv6 командой **ipv6config /all**. Запишите в таблицу IPv6-адрес с длиной префикса (строка «IPv6 Address») и IPv6-шлюз по умолчанию («Default Gateway»).

        ```
        C:\>ipv6config /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-84-55-DC-01
           IPv6 Auto Config................: No
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: 2001:DB8:1:1::A/64
           Default Gateway.................: FE80::1
           DNS Servers.....................: ::
        ```

        **Шаг 5.** Аналогично выведите параметры IPv6 компьютера PC2 командой **ipv6config /all** и запишите их в таблицу.

        ```
        C:\>ipv6config /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-22-27-60-01
           IPv6 Auto Config................: No
           Link-local IPv6 Address.........: FE80::2D0:22FF:FE27:6001
           IPv6 Address....................: 2001:DB8:1:4::A/64
           Default Gateway.................: FE80::3
           DNS Servers.....................: ::
        ```

        **Примечание.** Кроме глобального индивидуального адреса у каждого IPv6-интерфейса есть локальный адрес канала (строка «Link-local IPv6 Address»). Компьютеры создали его сами из префикса FE80::/10 и идентификатора интерфейса, полученного из MAC-адреса по методу EUI-64: у PC1 с MAC-адресом 00-D0-84-55-DC-01 это FE80::2D0:84FF:FE55:DC01.
    - title: "Проверка связи командой ping"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 проверьте связь с IPv4-адресом компьютера PC2 командой **ping 10.10.1.20**. Первый эхо-запрос может остаться без ответа: в это время PC1 и маршрутизаторы на пути определяют MAC-адреса следующих устройств по протоколу ARP.

        ```
        C:\>ping 10.10.1.20

        Pinging 10.10.1.20 with 32 bytes of data:

        Request timed out.
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125

        Ping statistics for 10.10.1.20:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Примечание.** Значение TTL=125 в ответах показывает, что ответ прошел через три маршрутизатора: компьютер PC2 отправляет пакет с TTL 128, а каждый маршрутизатор на пути уменьшает это значение на единицу.

        **Шаг 2.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 3.** В приложении «Командная строка» компьютера PC2 проверьте связь с IPv4-адресом компьютера PC1 командой **ping 10.10.1.100**.

        ```
        C:\>ping 10.10.1.100

        Pinging 10.10.1.100 with 32 bytes of data:

        Reply from 10.10.1.100: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.100: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.100: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.100: bytes=32 time=2ms TTL=125

        Ping statistics for 10.10.1.100:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 5.** На компьютере PC1 проверьте связь с IPv6-адресом компьютера PC2 командой **ping 2001:db8:1:4::a**.

        ```
        C:\>ping 2001:db8:1:4::a

        Pinging 2001:DB8:1:4::A with 32 bytes of data:

        Reply from 2001:DB8:1:4::A: bytes=32 time=5ms TTL=125
        Reply from 2001:DB8:1:4::A: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:1:4::A: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:1:4::A: bytes=32 time=2ms TTL=125

        Ping statistics for 2001:DB8:1:4::A:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 5ms, Average = 2ms
        ```

        **Шаг 6.** Ответьте на вопрос 3 в форме ответов.

        **Шаг 7.** На компьютере PC2 проверьте связь с IPv6-адресом компьютера PC1 командой **ping 2001:db8:1:1::a**.

        ```
        C:\>ping 2001:db8:1:1::a

        Pinging 2001:DB8:1:1::A with 32 bytes of data:

        Reply from 2001:DB8:1:1::A: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:1:1::A: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:1:1::A: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:1:1::A: bytes=32 time=2ms TTL=125

        Ping statistics for 2001:DB8:1:1::A:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 8.** Ответьте на вопрос 4 в форме ответов.
    - title: "Проверка пути командой tracert"
      body: |
        **Примечание.** Команда tracert отправляет пакеты к получателю с растущим значением TTL (в IPv6 — предела переходов): 1, 2, 3 и так далее. Маршрутизатор, на котором это значение истекает, отбрасывает пакет и сообщает об этом источнику сообщением ICMP со своего адреса. Поэтому каждая строка трассировки — один переход на пути: адрес интерфейса маршрутизатора, обращенного в сторону источника, а последняя строка — адрес самого получателя.

        **Шаг 1.** На компьютере PC1 проследите путь до IPv4-адреса компьютера PC2 командой **tracert 10.10.1.20**. Трассировка показывает четыре перехода.

        ```
        C:\>tracert 10.10.1.20

        Tracing route to 10.10.1.20 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  10.10.1.97
          2     1 ms     1 ms     1 ms  10.10.1.5
          3     1 ms     1 ms     1 ms  10.10.1.10
          4     2 ms     2 ms     2 ms  10.10.1.20

        Trace complete.
        ```

        **Шаг 2.** По таблице адресации определите, каким интерфейсам каких устройств принадлежат эти адреса, и ответьте на вопросы 5 и 6 в форме ответов.

        **Шаг 3.** На компьютере PC2 проследите путь до IPv4-адреса компьютера PC1 командой **tracert 10.10.1.100**.

        ```
        C:\>tracert 10.10.1.100

        Tracing route to 10.10.1.100 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  10.10.1.17
          2     1 ms     1 ms     1 ms  10.10.1.9
          3     1 ms     1 ms     1 ms  10.10.1.6
          4     2 ms     2 ms     2 ms  10.10.1.100

        Trace complete.
        ```

        **Шаг 4.** Ответьте на вопросы 7 и 8 в форме ответов.

        **Шаг 5.** На компьютере PC1 проследите путь до IPv6-адреса компьютера PC2 командой **tracert 2001:db8:1:4::a**.

        ```
        C:\>tracert 2001:db8:1:4::a

        Tracing route to 2001:DB8:1:4::A over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  2001:DB8:1:1::1
          2     1 ms     1 ms     1 ms  2001:DB8:1:2::1
          3     1 ms     1 ms     1 ms  2001:DB8:1:3::2
          4     2 ms     2 ms     2 ms  2001:DB8:1:4::A

        Trace complete.
        ```

        **Шаг 6.** Ответьте на вопросы 9 и 10 в форме ответов.

        **Шаг 7.** На компьютере PC2 проследите путь до IPv6-адреса компьютера PC1 командой **tracert 2001:db8:1:1::a**.

        ```
        C:\>tracert 2001:db8:1:1::a

        Tracing route to 2001:DB8:1:1::A over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  2001:DB8:1:4::1
          2     1 ms     1 ms     1 ms  2001:DB8:1:3::1
          3     1 ms     1 ms     1 ms  2001:DB8:1:2::2
          4     2 ms     2 ms     2 ms  2001:DB8:1:1::A

        Trace complete.
        ```

        **Шаг 8.** Ответьте на вопросы 11 и 12 в форме ответов.
