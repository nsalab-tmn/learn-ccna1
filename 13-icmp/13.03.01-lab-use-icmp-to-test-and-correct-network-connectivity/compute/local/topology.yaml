    - title: "Начальное состояние"
      body: |
        - Маршрутизаторы RTR-1, RTR-2, RTR-3 и Corporate настроены: на их интерфейсах заданы IPv4- и IPv6-адреса, а маршруты между сетями настроены статически. Маршрутизатор Corporate изображает корпоративную сеть.
        - На компьютерах, ноутбуках и серверах заданы IP-настройки. Компьютеры PC-1, PC-4, ноутбук Laptop-A и сервер Server1 работают в сетях IPv4, компьютеры PC-2, PC-3 и ноутбуки Laptop-B и Laptop-C — в сетях IPv6, а сервер Corporate-Server — в обеих.
        - На коммутаторах SW-1–SW-4 параметры имеют значения по умолчанию.
        - В сети есть неполадки, из-за которых часть узлов не может связаться с другими узлами и с корпоративным сервером.

        После запуска лабораторной работы дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым. Компьютер PC-1 получает ответы на эхо-запросы от сервера Corporate-Server (**ping 203.0.113.100** в приложении «Командная строка»). Первые эхо-запросы остаются без ответа, пока устройства на пути определяют MAC-адреса следующих переходов по протоколу ARP.

        ```
        C:\>ping 203.0.113.100

        Pinging 203.0.113.100 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Reply from 203.0.113.100: bytes=32 time=2ms TTL=125
        Reply from 203.0.113.100: bytes=32 time=2ms TTL=125

        Ping statistics for 203.0.113.100:
            Packets: Sent = 4, Received = 2, Lost = 2 (50% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами.
    - title: "Поиск неполадок"
      body: |
        **Требование 1.** Для каждого узла известно, с какими узлами и с сервером Corporate-Server у него есть связь. Для каждого недоступного узла найдено, на каком переходе обрывается путь к нему и на каком устройстве находится неполадка. Для поиска используются эхо-запросы и трассировка маршрута (протокол ICMP).

        **Примечание.** Узлы IPv4 проверяют по IPv4-адресам, а узлы IPv6 — по IPv6-адресам. Трассировка до недоступного узла продолжается до 30 переходов; прервать ее можно клавишами Ctrl+C в приложении «Командная строка».
    - title: "Устранение неполадок"
      body: |
        **Требование 2.** IPv4- и IPv6-адреса, маски подсети, длины префиксов и шлюзы по умолчанию всех устройств соответствуют таблице адресации. На интерфейсах маршрутизаторов нет адресов, которых нет в таблице.

        **Требование 3.** Все узлы настроены статически, по таблице адресации: DHCP-сервера в сети нет, и ни один узел не получает адрес по DHCP.
    - title: "Проверка связи"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC-1 проверьте связь с компьютером PC-4 командой **ping 10.10.5.10**. PC-1 получает ответы от PC-4. Первый эхо-запрос может остаться без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 10.10.5.10

        Pinging 10.10.5.10 with 32 bytes of data:

        Request timed out.
        Reply from 10.10.5.10: bytes=32 time=2ms TTL=125
        Reply from 10.10.5.10: bytes=32 time=2ms TTL=125
        Reply from 10.10.5.10: bytes=32 time=2ms TTL=125

        Ping statistics for 10.10.5.10:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Откройте окно компьютера PC-4 и в приложении «Командная строка» проверьте связь с сервером Corporate-Server командой **ping 203.0.113.100**. PC-4 получает ответы от корпоративного сервера.

        ```
        C:\>ping 203.0.113.100

        Pinging 203.0.113.100 with 32 bytes of data:

        Reply from 203.0.113.100: bytes=32 time=2ms TTL=125
        Reply from 203.0.113.100: bytes=32 time=2ms TTL=125
        Reply from 203.0.113.100: bytes=32 time=2ms TTL=125
        Reply from 203.0.113.100: bytes=32 time=2ms TTL=125

        Ping statistics for 203.0.113.100:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 3.** Откройте окно сервера Server1 и в приложении «Командная строка» проверьте связь с ноутбуком Laptop-A другого филиала командой **ping 10.10.1.20**. Server1 получает ответы. Первый эхо-запрос может остаться без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 10.10.1.20

        Pinging 10.10.1.20 with 32 bytes of data:

        Request timed out.
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125

        Ping statistics for 10.10.1.20:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** Откройте окно компьютера PC-2 и в приложении «Командная строка» проверьте связь с ноутбуком Laptop-B другого филиала командой **ping 2001:db8:5::10**. PC-2 получает ответы по IPv6.

        ```
        C:\>ping 2001:db8:5::10

        Pinging 2001:DB8:5::10 with 32 bytes of data:

        Reply from 2001:DB8:5::10: bytes=32 time=5ms TTL=125
        Reply from 2001:DB8:5::10: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:5::10: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:5::10: bytes=32 time=2ms TTL=125

        Ping statistics for 2001:DB8:5::10:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 5ms, Average = 2ms
        ```

        **Шаг 5.** Откройте окно ноутбука Laptop-C и в приложении «Командная строка» проверьте связь с сервером Corporate-Server командой **ping 2001:db8:acad::100**. Laptop-C получает ответы от корпоративного сервера по IPv6.

        ```
        C:\>ping 2001:db8:acad::100

        Pinging 2001:DB8:ACAD::100 with 32 bytes of data:

        Reply from 2001:DB8:ACAD::100: bytes=32 time=4ms TTL=125
        Reply from 2001:DB8:ACAD::100: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:ACAD::100: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:ACAD::100: bytes=32 time=2ms TTL=125

        Ping statistics for 2001:DB8:ACAD::100:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 4ms, Average = 2ms
        ```

        **Шаг 6.** В приложении «Командная строка» компьютера PC-1 выполните трассировку маршрута до сервера Corporate-Server командой **tracert 203.0.113.100**. Трассировка завершается («Trace complete.»): путь проходит через маршрутизаторы RTR-2 (10.10.1.1), RTR-1 (10.10.2.2) и Corporate (192.168.1.2).

        ```
        C:\>tracert 203.0.113.100

        Tracing route to 203.0.113.100 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  10.10.1.1
          2     1 ms     1 ms     1 ms  10.10.2.2
          3     1 ms     1 ms     1 ms  192.168.1.2
          4     2 ms     2 ms     2 ms  203.0.113.100

        Trace complete.
        ```
