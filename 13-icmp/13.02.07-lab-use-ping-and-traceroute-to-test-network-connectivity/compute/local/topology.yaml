    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1, R2 и R3 заданы IPv4- и IPv6-адреса интерфейсов и статические маршруты между сетями. Вход с консоли защищен паролем cisco, пароль привилегированного режима EXEC — class.
        - На компьютерах PC1 и PC3 заданы IPv4-адрес, маска подсети и шлюз по умолчанию, на компьютерах PC2 и PC4 — IPv6-адрес, длина префикса и шлюз по умолчанию.
        - На коммутаторах S1–S4 все параметры имеют значения по умолчанию.
        - По сообщениям пользователей, компьютер PC1 не может связаться с PC3, а компьютер PC2 — с PC4.

        **Шаг 1.** Откройте окно компьютера PC1 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Выведите параметры сетевого адаптера командой **ipconfig /all**. Строки «IPv4 Address», «Subnet Mask» и «Default Gateway» показывают значения, отмеченные в таблице IPv4-адресации знаком «?».

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-84-55-DC-01
           DHCP Enabled....................: No
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           IPv4 Address....................: 10.10.1.100
           Subnet Mask.....................: 255.255.255.224
           Default Gateway.................: 10.10.1.97
           DHCP Servers....................: 0.0.0.0
           DNS Servers.....................: 0.0.0.0
        ```

        **Шаг 2.** Аналогично выведите параметры компьютера PC3 командой **ipconfig /all**.

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-49-97-6D-01
           DHCP Enabled....................: No
           Link-local IPv6 Address.........: FE80::2D0:49FF:FE97:6D01
           IPv6 Address....................: ::
           IPv4 Address....................: 10.10.1.20
           Subnet Mask.....................: 255.255.255.240
           Default Gateway.................: 10.10.1.17
           DHCP Servers....................: 0.0.0.0
           DNS Servers.....................: 0.0.0.0
        ```

        **Шаг 3.** В приложении «Командная строка» компьютера PC1 проверьте связь с компьютером PC3 командой **ping 10.10.1.20**. Эхо-запросы не выполняются.

        ```
        C:\>ping 10.10.1.20

        Pinging 10.10.1.20 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 10.10.1.20:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```
    - title: "Поиск причины сбоя IPv4-подключения"
      body: |
        **Примечание.** Команда tracert отправляет пакеты с увеличивающимся значением TTL: 1, 2, 3 и так далее. Каждый маршрутизатор на пути уменьшает TTL на единицу и, когда значение доходит до нуля, отбрасывает пакет и сообщает об этом отправителю. Поэтому каждая строка трассировки — очередной узел на пути, а строка «Request timed out» означает, что ответ от следующего узла до отправителя не дошел.

        **Шаг 1.** В приложении «Командная строка» компьютера PC1 выполните трассировку маршрута к компьютеру PC3 командой **tracert 10.10.1.20**. Трассировка продолжается до 30 переходов: после двух-трех строк «Request timed out» остановите ее, нажав Ctrl+C.

        ```
        C:\>tracert 10.10.1.20

        Tracing route to 10.10.1.20 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  10.10.1.97
          2     *        *        *     Request timed out.
          3     *        *   ^C
        ```

        **Шаг 2.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 3.** В приложении «Командная строка» компьютера PC3 выполните трассировку маршрута к компьютеру PC1 командой **tracert 10.10.1.100**. Эта трассировка заканчивается сама.

        ```
        C:\>tracert 10.10.1.100

        Tracing route to 10.10.1.100 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  10.10.1.17
          2     1 ms     1 ms     1 ms  10.10.1.9
          3  10.10.1.9  reports: Destination host unreachable.

        Trace complete.
        ```

        **Шаг 4.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 5.** Откройте консоль маршрутизатора R1 и нажмите Enter. На запрос «Password:» введите пароль cisco: при вводе он не отображается.

        **Шаг 6.** Выведите список интерфейсов и их адресов командой **show ip interface brief**. У маршрутизатора R1 два IPv4-адреса, и один из них, 10.10.1.97, вы уже видели в трассировке.

        ```
        Password: 
        R1>show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  up                    up
        GigabitEthernet0/1         10.10.1.97      YES manual up                    up
        Serial0/0/0                unassigned      YES unset  administratively down down
        Serial0/0/1                10.10.1.6       YES manual up                    up
        ```

        **Шаг 7.** Ответьте на вопрос 3 в форме ответов.

        **Шаг 8.** Выведите таблицу маршрутизации командой **show ip route**. Для интерфейса Serial0/0/1 в ней две записи: с кодом C и с кодом L.

        ```
        R1>show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is 10.10.1.5 to network 0.0.0.0

        S*    0.0.0.0/0 [1/0] via 10.10.1.5
              10.0.0.0/8 is variably subnetted, 4 subnets, 3 masks
        C        10.10.1.4/30 is directly connected, Serial0/0/1
        L        10.10.1.6/32 is directly connected, Serial0/0/1
        C        10.10.1.96/27 is directly connected, GigabitEthernet0/1
        L        10.10.1.97/32 is directly connected, GigabitEthernet0/1
        ```

        **Шаг 9.** Ответьте на вопрос 4 в форме ответов.

        **Шаг 10.** Аналогично откройте консоль маршрутизатора R3, войдите с паролем cisco и выведите его интерфейсы и таблицу маршрутизации командами **show ip interface brief** и **show ip route**.

        ```
        Password: 
        R3>show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  up                    up
        GigabitEthernet0/1         10.10.1.17      YES manual up                    up
        Serial0/0/0                unassigned      YES unset  administratively down down
        Serial0/0/1                10.10.1.10      YES manual up                    up
        R3>show ip route
        Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP
               D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area
               N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2
               E1 - OSPF external type 1, E2 - OSPF external type 2, E - EGP
               i - IS-IS, L1 - IS-IS level-1, L2 - IS-IS level-2, ia - IS-IS inter area
               * - candidate default, U - per-user static route, o - ODR
               P - periodic downloaded static route

        Gateway of last resort is 10.10.1.9 to network 0.0.0.0

        S*    0.0.0.0/0 [1/0] via 10.10.1.9
              10.0.0.0/8 is variably subnetted, 4 subnets, 3 masks
        C        10.10.1.8/30 is directly connected, Serial0/0/1
        L        10.10.1.10/32 is directly connected, Serial0/0/1
        C        10.10.1.16/28 is directly connected, GigabitEthernet0/1
        L        10.10.1.17/32 is directly connected, GigabitEthernet0/1
        ```

        **Шаг 11.** Откройте консоль маршрутизатора R2, войдите с паролем cisco и выведите его интерфейсы командой **show ip interface brief**. Сравните адреса интерфейсов маршрутизатора R2 с документацией сети на странице «Топология и адресация».

        ```
        Password: 
        R2>show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  administratively down down
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        Serial0/0/0                10.10.1.2       YES manual up                    up
        Serial0/0/1                10.10.1.9       YES manual up                    up
        ```

        **Шаг 12.** Ответьте на вопросы 5 и 6 в форме ответов.
    - title: "Устранение ошибки IPv4-адресации"
      body: |
        **Шаг 1.** На маршрутизаторе R2 перейдите в привилегированный режим EXEC командой **enable** с паролем class, затем в режим глобальной конфигурации командой **configure terminal** и к настройке интерфейса S0/0/0 командой **interface s0/0/0**.

        **Шаг 2.** Задайте интерфейсу адрес из документации сети командой **ip address 10.10.1.5 255.255.255.252** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R2>enable
        Password: 
        R2#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R2(config)#interface s0/0/0
        R2(config-if)#ip address 10.10.1.5 255.255.255.252
        R2(config-if)#end
        *Mar  1 00:02:04.178: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Шаг 3.** В приложении «Командная строка» компьютера PC1 снова проверьте связь с компьютером PC3 командой **ping 10.10.1.20**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 10.10.1.20

        Pinging 10.10.1.20 with 32 bytes of data:

        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125

        Ping statistics for 10.10.1.20:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** В приложении «Командная строка» компьютера PC3 проверьте связь с компьютером PC1 командой **ping 10.10.1.100**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 10.10.1.100

        Pinging 10.10.1.100 with 32 bytes of data:

        Reply from 10.10.1.100: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.100: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.100: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.100: bytes=32 time=2ms TTL=125

        Ping statistics for 10.10.1.100:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 5.** Ответьте на вопрос 7 в форме ответов.
    - title: "Поиск причины сбоя IPv6-подключения"
      body: |
        **Шаг 1.** Откройте окно компьютера PC2 и в приложении «Командная строка» выведите его параметры IPv6 командой **ipv6config /all**. Строки «IPv6 Address» и «Default Gateway» показывают значения, отмеченные в таблице IPv6-адресации знаком «?».

        ```
        C:\>ipv6config /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-22-27-60-01
           IPv6 Auto Config................: No
           Link-local IPv6 Address.........: FE80::2D0:22FF:FE27:6001
           IPv6 Address....................: 2001:DB8:1:1::A/64
           Default Gateway.................: FE80::1
           DNS Servers.....................: ::
        ```

        **Шаг 2.** Аналогично выведите параметры IPv6 компьютера PC4 командой **ipv6config /all**.

        ```
        C:\>ipv6config /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-C5-22-CE-01
           IPv6 Auto Config................: No
           Link-local IPv6 Address.........: FE80::2D0:C5FF:FE22:CE01
           IPv6 Address....................: 2001:DB8:1:4::A/64
           Default Gateway.................: FE80::1
           DNS Servers.....................: ::
        ```

        **Шаг 3.** В приложении «Командная строка» компьютера PC2 проверьте связь с компьютером PC4 командой **ping 2001:db8:1:4::a**. Эхо-запросы не выполняются.

        ```
        C:\>ping 2001:db8:1:4::a

        Pinging 2001:DB8:1:4::A with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 2001:DB8:1:4::A:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 4.** Выполните трассировку маршрута к компьютеру PC4 командой **tracert 2001:db8:1:4::a**. После двух-трех строк «Request timed out» остановите ее, нажав Ctrl+C.

        ```
        C:\>tracert 2001:db8:1:4::a

        Tracing route to 2001:DB8:1:4::A over a maximum of 30 hops:

          1     1 ms    <1 ms    <1 ms  2001:DB8:1:1::1
          2     1 ms     1 ms     1 ms  2001:DB8:1:2::1
          3     1 ms     1 ms     1 ms  2001:DB8:1:3::2
          4     *        *        *     Request timed out.
          5     *        *        *     Request timed out.
          6^C
        ```

        **Шаг 5.** Ответьте на вопрос 8 в форме ответов.

        **Шаг 6.** В приложении «Командная строка» компьютера PC4 выполните трассировку маршрута к компьютеру PC2 командой **tracert 2001:db8:1:1::a**. Трассировка сразу заканчивается сообщением «Destination host unreachable».

        ```
        C:\>tracert 2001:db8:1:1::a

        Tracing route to 2001:DB8:1:1::A over a maximum of 30 hops:

          1  2001:DB8:1:4::A  reports: Destination host unreachable.

        Trace complete.
        ```

        **Шаг 7.** Ответьте на вопрос 9 в форме ответов.

        **Примечание.** Шлюзом по умолчанию узла IPv6 обычно указывают локальный адрес канала маршрутизатора. Такой адрес действует только в пределах своего канала, поэтому шлюзом может быть только локальный адрес канала интерфейса маршрутизатора, подключенного к той же сети, что и узел.

        **Шаг 8.** В консоли маршрутизатора R3 выведите IPv6-адреса интерфейсов командой **show ipv6 interface brief**. Для каждого интерфейса первым указан его локальный адрес канала. Сравните локальный адрес канала интерфейса G0/0, к сети которого подключен компьютер PC4, с адресом шлюза по умолчанию на PC4.

        ```
        R3>show ipv6 interface brief
        GigabitEthernet0/0     [up/up]
            FE80::3
            2001:DB8:1:4::1
        GigabitEthernet0/1     [up/up]
            unassigned
        Serial0/0/0            [administratively down/down]
            unassigned
        Serial0/0/1            [up/up]
            FE80::3
            2001:DB8:1:3::2
        ```

        **Шаг 9.** Ответьте на вопросы 10, 11 и 12 в форме ответов.
    - title: "Устранение ошибки настройки IPv6"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC4 задайте IPv6-адрес с длиной префикса и шлюз по умолчанию из документации сети командой **ipv6config 2001:db8:1:4::a/64 fe80::3**. Команда ничего не выводит.

        **Шаг 2.** Убедитесь с помощью команды **ipconfig**, что шлюзом по умолчанию компьютера PC4 стал адрес FE80::3 (строка «Default Gateway»).

        ```
        C:\>ipv6config 2001:db8:1:4::a/64 fe80::3
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:C5FF:FE22:CE01
           IPv6 Address....................: 2001:DB8:1:4::A
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: FE80::3
                                             0.0.0.0
        ```

        **Шаг 3.** В приложении «Командная строка» компьютера PC2 снова проверьте связь с компьютером PC4 командой **ping 2001:db8:1:4::a**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 2001:db8:1:4::a

        Pinging 2001:DB8:1:4::A with 32 bytes of data:

        Reply from 2001:DB8:1:4::A: bytes=32 time=3ms TTL=125
        Reply from 2001:DB8:1:4::A: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:1:4::A: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:1:4::A: bytes=32 time=2ms TTL=125

        Ping statistics for 2001:DB8:1:4::A:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 3ms, Average = 2ms
        ```

        **Шаг 4.** В приложении «Командная строка» компьютера PC4 проверьте связь с компьютером PC2 командой **ping 2001:db8:1:1::a**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 2001:db8:1:1::a

        Pinging 2001:DB8:1:1::A with 32 bytes of data:

        Reply from 2001:DB8:1:1::A: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:1:1::A: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:1:1::A: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:1:1::A: bytes=32 time=2ms TTL=125

        Ping statistics for 2001:DB8:1:1::A:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 5.** Ответьте на вопрос 13 в форме ответов.
    - title: "Параметры команды ping"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 отправьте компьютеру PC3 только два эхо-запроса командой **ping -n 2 10.10.1.20**. Параметр -n задает число эхо-запросов вместо четырех по умолчанию.

        ```
        C:\>ping -n 2 10.10.1.20

        Pinging 10.10.1.20 with 32 bytes of data:

        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125

        Ping statistics for 10.10.1.20:
            Packets: Sent = 2, Received = 2, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Отправляйте эхо-запросы компьютеру PC3 непрерывно командой **ping -t 10.10.1.20**. Когда появится несколько ответов, остановите команду, нажав Ctrl+C: компьютер выведет статистику по всем отправленным запросам. Непрерывные эхо-запросы удобны, чтобы наблюдать, как меняется связь, пока вы переключаете кабели или интерфейсы.

        ```
        C:\>ping -t 10.10.1.20

        Pinging 10.10.1.20 with 32 bytes of data:

        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125
        Reply from 10.10.1.20: bytes=32 time=2ms TTL=125

        Ping statistics for 10.10.1.20:
            Packets: Sent = 8, Received = 8, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        Control-C
        ^C
        ```

        **Примечание.** Расширенная команда ping на маршрутизаторе в привилегированном режиме EXEC задает параметры эхо-запросов по одному: протокол, адрес получателя, число повторов, размер датаграммы, время ожидания и, в дополнительных параметрах (Extended commands), адрес источника. Ответы возвращаются на адрес источника, поэтому эхо-запрос с адреса интерфейса G0/1 проверяет, что на пути обратно известен и маршрут к сети компьютера PC1, а не только к последовательному каналу.

        **Шаг 3.** В консоли маршрутизатора R1 перейдите в привилегированный режим EXEC командой **enable** с паролем class и введите **ping** без параметров.

        **Шаг 4.** Ответьте на вопросы команды: протокол — нажмите Enter (по умолчанию ip); «Target IP address» — 10.10.1.20; «Repeat count» — 20; размер датаграммы и время ожидания — Enter; «Extended commands» — y; «Source address or interface» — 10.10.1.97, адрес интерфейса G0/1. На остальные вопросы нажмите Enter. Маршрутизатор отправляет 20 эхо-запросов с адреса 10.10.1.97 (строка «Packet sent with a source address of 10.10.1.97»), и каждый ответ отмечается восклицательным знаком.

        ```
        R1>enable
        Password: 
        R1#ping
        Protocol [ip]: 
        Target IP address: 10.10.1.20
        Repeat count [5]: 20
        Datagram size [100]: 
        Timeout in seconds [2]: 
        Extended commands [n]: y
        Source address or interface: 10.10.1.97
        Type of service [0]: 
        Set DF bit in IP header? [no]: 
        Validate reply data? [no]: 
        Data pattern [0x0000ABCD]: 
        Loose, Strict, Record, Timestamp, Verbose[none]: 
        Sweep range of sizes [n]: 
        Type escape sequence to abort.
        Sending 20, 100-byte ICMP Echos to 10.10.1.20, timeout is 2 seconds:
        Packet sent with a source address of 10.10.1.97
        !!!!!!!!!!!!!!!!!!!!
        Success rate is 100 percent (20/20), round-trip min/avg/max = 2/3/5 ms
        ```

        **Шаг 5.** Проверьте связь с адресом 10.10.1.200 командой **ping 10.10.1.200**. Узла с таким адресом в сети нет, и маршрута к нему нет на маршрутизаторе R2: вместо восклицательных знаков выводятся символы U и точки.

        ```
        R1#ping 10.10.1.200
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 10.10.1.200, timeout is 2 seconds:
        U.U.U
        Success rate is 0 percent (0/5)
        ```

        **Примечание.** В выводе команды ping на маршрутизаторе восклицательный знак (!) означает полученный ответ, точка (.) — эхо-запрос, на который ответ не пришел за время ожидания, а символ U — сообщение ICMP о недоступности получателя от маршрутизатора на пути. Маршрутизатор отправляет такие сообщения не чаще определенного интервала, поэтому символы U чередуются с точками.

        **Шаг 6.** Проверьте связь с компьютером PC4 по протоколу IPv6 командой **ping 2001:db8:1:4::a**: команда ping на маршрутизаторе принимает и IPv6-адрес.

        ```
        R1#ping 2001:db8:1:4::a
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 2001:DB8:1:4::A, timeout is 2 seconds:
        !!!!!
        Success rate is 100 percent (5/5), round-trip min/avg/max = 2/3/5 ms
        ```
    - title: "Проверка маршрутов"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC1 снова выполните трассировку маршрута к компьютеру PC3 командой **tracert 10.10.1.20**. Теперь трассировка доходит до PC3 и заканчивается сама: пакеты проходят через маршрутизаторы R1 (10.10.1.97), R2 (10.10.1.5) и R3 (10.10.1.10).

        ```
        C:\>tracert 10.10.1.20

        Tracing route to 10.10.1.20 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  10.10.1.97
          2     1 ms     1 ms     1 ms  10.10.1.5
          3     1 ms     1 ms     1 ms  10.10.1.10
          4     2 ms     2 ms     2 ms  10.10.1.20

        Trace complete.
        ```

        **Шаг 2.** В приложении «Командная строка» компьютера PC2 снова выполните трассировку маршрута к компьютеру PC4 командой **tracert 2001:db8:1:4::a**. Трассировка доходит до PC4 через те же три маршрутизатора.

        ```
        C:\>tracert 2001:db8:1:4::a

        Tracing route to 2001:DB8:1:4::A over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  2001:DB8:1:1::1
          2     1 ms     1 ms     1 ms  2001:DB8:1:2::1
          3     1 ms     1 ms     1 ms  2001:DB8:1:3::2
          4     2 ms     2 ms     2 ms  2001:DB8:1:4::A

        Trace complete.
        ```
