        Узлы названы по своим адресам: PC-31-2 — это узел 172.16.31.2, Laptop-10-2 — узел 10.10.10.2 и так далее.
    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах Router0 и Router1 заданы адреса интерфейсов по таблице адресации и статические маршруты к локальной сети другого маршрутизатора.
        - На коммутаторах Switch0, Switch1 и Access-Point задано только имя устройства. Access-Point в этой лабораторной работе — коммутатор: ноутбуки подключены к нему кабелем.
        - На компьютерах и ноутбуках заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - Трафика в сети еще не было, поэтому таблицы ARP узлов и таблицы MAC-адресов коммутаторов пусты. Настраивать в этой лабораторной работе ничего не нужно.

        **Шаг 1.** Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым («Соединение активно» в условных обозначениях): после запуска на это уходит около 30 секунд.

        **Шаг 2.** Откройте окно компьютера PC-31-2 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Выведите таблицу ARP компьютера командой **arp -a**. Таблица пуста: компьютер еще ни с кем не обменивался данными.

        ```
        C:\>arp -a
        No ARP Entries Found
        ```
    - title: "Анализ ARP-запроса"
      body: |
        **Примечание.** Таблица ARP хранит соответствия IPv4-адресов и MAC-адресов, которые узел уже узнал. Если для адреса назначения в таблице нет записи, узел сначала отправляет ARP-запрос на широковещательный MAC-адрес, а пакет ждет ответа. Получатель запроса отвечает ARP-ответом, отправленным прямо узлу, который его спросил.

        **Шаг 1.** В приложении «Командная строка» компьютера PC-31-2 очистите таблицу ARP командой **arp -d**. Команда ничего не выводит.

        ```
        C:\>arp -d
        ```

        **Шаг 2.** Нажмите «Симуляция» вверху страницы. Под схемой откроется панель «Симуляция» со списком событий. Время в сети остановится: следующее событие выполняется по кнопке «Шаг».

        **Шаг 3.** В приложении «Командная строка» компьютера PC-31-2 выполните команду **ping 172.16.31.3**. В списке событий появятся две строки: ARP-запрос «запрос «кто 172.16.31.3?»» и эхо-запрос ICMP «echo → 172.16.31.3 · ждёт ответа ARP». Конверт ICMP над компьютером PC-31-2 бледный: эхо-запрос ждет, пока компьютер узнает MAC-адрес получателя.

        **Шаг 4.** Нажмите «Шаг» один раз. ARP-запрос дойдет до коммутатора Switch1: в столбце «Что происходит» появится строка «широковещательный кадр в F0/1 → рассылка в F0/2, F0/3, G0/1».

        **Шаг 5.** Откройте PDU этого события: щелкните цветной квадрат в столбце «Тип» его строки. В окне PDU откройте вкладку «Входящий PDU» и найдите в разделе «Ethernet II» строку «MAC назначения».

        **Шаг 6.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 7.** Нажмите «Шаг» еще три раза. Копии ARP-запроса дойдут до компьютеров PC-31-3 и PC-31-4 и маршрутизатора Router1 — до всех узлов, подключенных к портам из строки коммутатора. PC-31-4 и Router1 отбрасывают запрос («не для PC-31-4 · отброшен»), а PC-31-3 «узнаёт свой адрес и отвечает».

        **Шаг 8.** Ответьте на вопросы 2 и 3 в форме ответов.

        **Шаг 9.** Нажмите «Шаг» еще раз. ARP-ответ компьютера PC-31-3 дойдет до коммутатора Switch1: «кадр в F0/2 → F0/1». Откройте PDU этого события на вкладке «Входящий PDU» и сравните строки «MAC источника» и «MAC назначения» с теми же строками ARP-запроса из шага 5.

        **Шаг 10.** Ответьте на вопрос 4 в форме ответов.

        **Шаг 11.** Нажмите «Шаг» еще раз. ARP-ответ вернется на компьютер PC-31-2: «ответ получен: 172.16.31.3 = 0060.7036.2849 · запись в ARP-таблице». Коммутатор передал ответ только в порт F0/1, к которому подключен PC-31-2.

        **Шаг 12.** Ответьте на вопрос 5 в форме ответов.
    - title: "Изучение таблицы ARP"
      body: |
        **Шаг 1.** Нажмите «Шаг» еще раз. Теперь, когда MAC-адрес получателя известен, эхо-запрос ICMP отправляется: на коммутаторе Switch1 появится строка «кадр в F0/1 → F0/2». Откройте PDU этого события на вкладке «Входящий PDU» и сравните MAC-адреса в разделе «Ethernet II» с IPv4-адресами в строках «Источник» и «Назначение» раздела «IPv4».

        **Шаг 2.** Ответьте на вопрос 6 в форме ответов.

        **Шаг 3.** Нажимайте «Шаг», пока в списке событий не появится строка «echo-ответ от 172.16.31.3 получен» на компьютере PC-31-2.

        **Шаг 4.** Нажмите «Лаборатория» вверху страницы. Панель «Симуляция» закроется, и время в сети снова пойдет: команда **ping** отправит остальные три эхо-запроса без пауз. Дождитесь приглашения `C:\>` в приложении «Командная строка» компьютера PC-31-2.

        **Шаг 5.** Выведите таблицу ARP командой **arp -a**. В ней появилась запись, которую компьютер получил из ARP-ответа.

        ```
        C:\>arp -a
          Internet Address      Physical Address      Type
          172.16.31.3           0060.7036.2849        dynamic
        ```

        **Шаг 6.** Ответьте на вопросы 7 и 8 в форме ответов.
    - title: "Изучение таблиц MAC-адресов коммутаторов"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC-31-2 проверьте связь с компьютером PC-31-4 командой **ping 172.16.31.4**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 172.16.31.4

        Pinging 172.16.31.4 with 32 bytes of data:

        Reply from 172.16.31.4: bytes=32 time=1ms TTL=128
        Reply from 172.16.31.4: bytes=32 time<1ms TTL=128
        Reply from 172.16.31.4: bytes=32 time<1ms TTL=128
        Reply from 172.16.31.4: bytes=32 time<1ms TTL=128

        Ping statistics for 172.16.31.4:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 2.** Откройте окно ноутбука Laptop-10-2 и в приложении «Командная строка» проверьте связь с ноутбуком Laptop-10-3 командой **ping 10.10.10.3**.

        ```
        C:\>ping 10.10.10.3

        Pinging 10.10.10.3 with 32 bytes of data:

        Reply from 10.10.10.3: bytes=32 time=1ms TTL=128
        Reply from 10.10.10.3: bytes=32 time<1ms TTL=128
        Reply from 10.10.10.3: bytes=32 time<1ms TTL=128
        Reply from 10.10.10.3: bytes=32 time<1ms TTL=128

        Ping statistics for 10.10.10.3:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 3.** Ответьте на вопрос 9 в форме ответов.

        **Шаг 4.** Откройте консоль коммутатора Switch1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и выведите таблицу MAC-адресов командой **show mac address-table**. Коммутатор запомнил MAC-адреса трех компьютеров и порты, к которым они подключены.

        ```
        Switch1>enable
        Switch1#show mac address-table
                  Mac Address Table
        -------------------------------------------

        Vlan    Mac Address       Type        Ports
        ----    -----------       --------    -----
           1    0002.1640.8d75    DYNAMIC     Fa0/3
           1    000c.85cc.1da7    DYNAMIC     Fa0/1
           1    0060.7036.2849    DYNAMIC     Fa0/2
        Total Mac Addresses for this criterion: 3
        ```

        **Шаг 5.** Ответьте на вопрос 10 в форме ответов.

        **Шаг 6.** Откройте консоль коммутатора Switch0, нажмите Enter и аналогично выведите таблицу MAC-адресов командами **enable** и **show mac address-table**. В таблице одна запись: MAC-адрес ноутбука Laptop-10-2 за портом F0/2.

        ```
        Switch0>enable
        Switch0#show mac address-table
                  Mac Address Table
        -------------------------------------------

        Vlan    Mac Address       Type        Ports
        ----    -----------       --------    -----
           1    0060.2f84.4ab6    DYNAMIC     Fa0/2
        Total Mac Addresses for this criterion: 1
        ```

        **Примечание.** Коммутатор запоминает MAC-адрес отправителя каждого кадра, который приходит на его порт. ARP-запрос ноутбука Laptop-10-2 был широковещательным и дошел до коммутатора Switch0, а ответы ноутбука Laptop-10-3 коммутатор Access-Point передал прямо в свой порт F0/2, к которому подключен Laptop-10-2. До коммутатора Switch0 они не дошли, поэтому адреса ноутбука Laptop-10-3 в его таблице нет.

        **Шаг 7.** Откройте окно ноутбука Laptop-10-3 и в приложении «Командная строка» проверьте связь со шлюзом по умолчанию, интерфейсом G0/0 маршрутизатора Router0, командой **ping 10.10.10.1**. Кадры ноутбука идут к маршрутизатору через коммутатор Switch0.

        ```
        C:\>ping 10.10.10.1

        Pinging 10.10.10.1 with 32 bytes of data:

        Reply from 10.10.10.1: bytes=32 time=2ms TTL=255
        Reply from 10.10.10.1: bytes=32 time=1ms TTL=255
        Reply from 10.10.10.1: bytes=32 time=1ms TTL=255
        Reply from 10.10.10.1: bytes=32 time=1ms TTL=255

        Ping statistics for 10.10.10.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        **Шаг 8.** В консоли коммутатора Switch0 снова выведите таблицу MAC-адресов командой **show mac address-table**. Теперь за портом F0/2 записаны MAC-адреса обоих ноутбуков, а за портом G0/1 — MAC-адрес интерфейса G0/0 маршрутизатора Router0.

        ```
        Switch0#show mac address-table
                  Mac Address Table
        -------------------------------------------

        Vlan    Mac Address       Type        Ports
        ----    -----------       --------    -----
           1    0001.6458.2501    DYNAMIC     Gi0/1
           1    0060.2f84.4ab6    DYNAMIC     Fa0/2
           1    0060.4706.572b    DYNAMIC     Fa0/2
        Total Mac Addresses for this criterion: 3
        ```

        **Шаг 9.** Ответьте на вопросы 11 и 12 в форме ответов.
    - title: "Анализ ARP-запроса к другой сети"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC-31-2 проверьте связь с интерфейсом G0/0 маршрутизатора Router0 в другой сети командой **ping 10.10.10.1**. Эхо-запросы выполняются успешно.

        ```
        C:\>ping 10.10.10.1

        Pinging 10.10.10.1 with 32 bytes of data:

        Reply from 10.10.10.1: bytes=32 time=2ms TTL=254
        Reply from 10.10.10.1: bytes=32 time=1ms TTL=254
        Reply from 10.10.10.1: bytes=32 time=1ms TTL=254
        Reply from 10.10.10.1: bytes=32 time=1ms TTL=254

        Ping statistics for 10.10.10.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        **Шаг 2.** Выведите таблицу ARP командой **arp -a**. Найдите запись, которой не было в таблице раньше, и сравните ее с таблицей адресации.

        ```
        C:\>arp -a
          Internet Address      Physical Address      Type
          172.16.31.1           00e0.f7b1.8901        dynamic
          172.16.31.3           0060.7036.2849        dynamic
          172.16.31.4           0002.1640.8d75        dynamic
        ```

        **Шаг 3.** Ответьте на вопрос 13 в форме ответов.

        **Шаг 4.** Очистите таблицу ARP командой **arp -d**. Команда ничего не выводит.

        ```
        C:\>arp -d
        ```

        **Шаг 5.** Нажмите «Симуляция» вверху страницы и снова выполните команду **ping 10.10.10.1**. Посмотрите, сколько событий появилось в списке событий и какого они типа (столбец «Тип»).

        **Шаг 6.** Ответьте на вопрос 14 в форме ответов.

        **Шаг 7.** Нажмите «Шаг» один раз. Откройте PDU события на коммутаторе Switch1 на вкладке «Входящий PDU» и найдите в разделе «ARP» строку «IP цели».

        **Примечание.** Перед отправкой пакета узел сравнивает адрес назначения со своей сетью. Адрес в своей сети узел ищет по протоколу ARP сам, а пакет для другой сети отправляет шлюзу по умолчанию, поэтому ему нужен MAC-адрес шлюза.

        **Шаг 8.** Ответьте на вопросы 15 и 16 в форме ответов.

        **Шаг 9.** Нажимайте «Шаг», пока в списке событий не появится строка «echo-ответ от 10.10.10.1 получен» на компьютере PC-31-2. Проследите по списку, что происходит с эхо-запросом, который ждал ответа ARP («ждёт ответа ARP»), после того как маршрутизатор Router1 отвечает на ARP-запрос («Router1 узнаёт свой адрес и отвечает», затем «ответ получен: 172.16.31.1 = 00e0.f7b1.8901 · запись в ARP-таблице»).

        **Шаг 10.** Ответьте на вопрос 19 в форме ответов.

        **Шаг 11.** Нажмите «Лаборатория» вверху страницы и дождитесь приглашения `C:\>` в приложении «Командная строка» компьютера PC-31-2.
    - title: "Проверка таблиц ARP"
      body: |
        **Шаг 1.** Откройте консоль маршрутизатора Router1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable** и выполните команду **show mac address-table**. Маршрутизатор не принимает эту команду.

        ```
        Router1>enable
        Router1#show mac address-table
                     ^
        % Invalid input detected at '^' marker.
        ```

        **Шаг 2.** Ответьте на вопрос 17 в форме ответов.

        **Шаг 3.** Выведите таблицу ARP маршрутизатора командой **show arp**. В ней две записи для интерфейса GigabitEthernet0/0: собственный адрес маршрутизатора 172.16.31.1 (в столбце «Age (min)» прочерк) и адрес, который маршрутизатор узнал из ARP-запроса.

        ```
        Router1#show arp
        Protocol  Address          Age (min)  Hardware Addr   Type   Interface
        Internet  172.16.31.1             -   00e0.f7b1.8901  ARPA   GigabitEthernet0/0
        Internet  172.16.31.2             0   000c.85cc.1da7  ARPA   GigabitEthernet0/0
        ```

        **Шаг 4.** Ответьте на вопрос 18 в форме ответов.

        **Шаг 5.** В приложении «Командная строка» компьютера PC-31-2 выведите таблицу ARP командой **arp -a**. После очистки в ней снова одна запись — MAC-адрес шлюза по умолчанию: записи для адреса 10.10.10.1 в таблице нет.

        ```
        C:\>arp -a
          Internet Address      Physical Address      Type
          172.16.31.1           00e0.f7b1.8901        dynamic
        ```
