        | Laptop-10-2 | NIC | 10.10.10.2 | 255.255.255.0 | 10.10.10.1 | 0060.2f84.4ab6 |
        | Laptop-10-3 | NIC | 10.10.10.3 | 255.255.255.0 | 10.10.10.1 | 0060.4706.572b |
