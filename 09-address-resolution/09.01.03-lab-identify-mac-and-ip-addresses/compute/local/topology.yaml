        Узлы названы по своим адресам: PC-31-5 — узел 172.16.31.5, Laptop-10-2 — узел 10.10.10.2 и так далее.
    - title: "Начальное состояние"
      body: |
        - На маршрутизаторе Router заданы IP-адреса интерфейсов G0/0 и G0/1 по таблице адресации.
        - На компьютерах и ноутбуках заданы IP-адреса, маски подсети и шлюзы по умолчанию по таблице адресации.
        - На коммутаторах Switch0, Switch1 и Access-Point задано только имя устройства. Концентратор Hub не настраивается, и консоли у него нет.
        - Беспроводная сеть не моделируется: точка доступа Access-Point работает как коммутатор, к которому ноутбуки подключены кабелем.
        - Настраивать в этой лабораторной работе ничего не нужно: вы наблюдаете, как устройства пересылают кадры.

        **Шаг 1.** Дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым: после запуска на это уходит около 30 секунд. Откройте окно компьютера PC-31-5 и на вкладке «Рабочий стол» запустите приложение «Командная строка». Выведите параметры сетевого адаптера командой **ipconfig /all**. Строка «Physical Address» показывает MAC-адрес компьютера.

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-D3-11-C7-88
           DHCP Enabled....................: No
           Link-local IPv6 Address.........: FE80::2D0:D3FF:FE11:C788
           IPv6 Address....................: ::
           IPv4 Address....................: 172.16.31.5
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 172.16.31.1
           DHCP Servers....................: 0.0.0.0
           DNS Servers.....................: 0.0.0.0
        ```

        **Примечание.** MAC-адрес состоит из 48 бит, то есть 12 шестнадцатеричных цифр. Компьютер записывает его парами цифр через дефис (00-D0-D3-11-C7-88), а маршрутизатор и окно PDU — группами по четыре цифры через точку (00d0.d311.c788): это один и тот же адрес.

        **Шаг 2.** Откройте консоль маршрутизатора Router и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 3.** Выведите параметры интерфейса G0/1 командой **show interfaces g0/1**. Строка «Hardware is …, address is» показывает MAC-адрес интерфейса, а строка «Internet address is» — его IP-адрес: интерфейс G0/1 подключен к сети 172.16.31.0/24. Вывод длинный: чтобы пролистать его до конца, нажимайте пробел.

        ```
        Router>enable
        Router#show interfaces g0/1
        GigabitEthernet0/1 is up, line protocol is up
          Hardware is Gigabit Ethernet, address is 00d0.ba8e.741a (bia 00d0.ba8e.741a)
          Internet address is 172.16.31.1/24
        …
        ```

        **Шаг 4.** Аналогично выведите параметры интерфейса G0/0, подключенного к сети 10.10.10.0/24, командой **show interfaces g0/0**.

        ```
        Router#show interfaces g0/0
        GigabitEthernet0/0 is up, line protocol is up
          Hardware is Gigabit Ethernet, address is 00d0.588c.2401 (bia 00d0.588c.2401)
          Internet address is 10.10.10.1/24
        …
        ```

        **Шаг 5.** В приложении «Командная строка» компьютера PC-31-5 проверьте связь с компьютером PC-31-2 командой **ping 172.16.31.2**, а затем с ноутбуком Laptop-10-2 командой **ping 10.10.10.2**. Эхо-запросы выполняются успешно. Первый эхо-запрос к ноутбуку может остаться без ответа, пока маршрутизатор определяет MAC-адрес ноутбука по протоколу ARP.

        ```
        C:\>ping 172.16.31.2

        Pinging 172.16.31.2 with 32 bytes of data:

        Reply from 172.16.31.2: bytes=32 time=2ms TTL=128
        Reply from 172.16.31.2: bytes=32 time=1ms TTL=128
        Reply from 172.16.31.2: bytes=32 time=1ms TTL=128
        Reply from 172.16.31.2: bytes=32 time=1ms TTL=128

        Ping statistics for 172.16.31.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms

        C:\>ping 10.10.10.2

        Pinging 10.10.10.2 with 32 bytes of data:

        Request timed out.
        Reply from 10.10.10.2: bytes=32 time=2ms TTL=127
        Reply from 10.10.10.2: bytes=32 time=2ms TTL=127
        Reply from 10.10.10.2: bytes=32 time=2ms TTL=127

        Ping statistics for 10.10.10.2:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Примечание.** Во время этих эхо-запросов компьютеры, ноутбук и маршрутизатор определили MAC-адреса соседей по протоколу ARP и запомнили их. Поэтому дальше, в режиме «Симуляция», эхо-запрос отправляется сразу, без ARP-запроса.

        **Шаг 6.** Найдите тип каждого кабеля в столбце «Кабель» таблицы соединений на странице «Топология и адресация» и ответьте на вопрос 2 в форме ответов.

        **Примечание.** Тип кабеля относится к физическому уровню модели OSI: он определяет, какими сигналами передаются биты. Кадр и пакет, которые передаются этими сигналами, от типа кабеля не зависят.

        **Шаг 7.** Ответьте на вопрос 3 в форме ответов.
    - title: "Наблюдение за PDU в локальной сети"
      body: |
        **Шаг 1.** Нажмите «Симуляция» вверху страницы. Под схемой откроется панель «Симуляция» со списком событий. Время в сети остановится: каждое следующее событие выполняется по кнопке «Шаг».

        **Шаг 2.** В приложении «Командная строка» компьютера PC-31-5 отправьте один эхо-запрос командой **ping -n 1 172.16.31.2**. Над компьютером PC-31-5 появится конверт, а в списке событий — строка «echo → 172.16.31.2 · в F0». Команда ждет ответа, пока вы не выполните события по кнопке «Шаг».

        **Шаг 3.** Щелкните конверт или цветной квадрат в столбце «Тип» этой строки: откроется окно «PDU · ICMP». На вкладке «Исходящий PDU» в разделе «Ethernet II» указаны «MAC назначения» 000c.85cc.1da7 и «MAC источника» 00d0.d311.c788, а в разделе «IPv4» — «Источник» 172.16.31.5 и «Назначение» 172.16.31.2. На вкладке «Модель OSI» видно, что компьютер PC-31-5 использует уровни 1–3: IP-пакет на уровне 3, кадр Ethernet на уровне 2 и порт F0 на уровне 1.

        **Примечание.** В заголовке кадра Ethernet MAC-адрес назначения стоит перед MAC-адресом источника. Коммутатор выбирает порт по адресу назначения, поэтому он может начать пересылку, прочитав только начало кадра.

        **Шаг 4.** Ответьте на вопросы 10 и 11 в форме ответов.

        **Шаг 5.** Нажмите «Шаг». Кадр дойдет до коммутатора Switch1: в столбце «Что происходит» — «кадр в F0/3 → F0/1». Откройте PDU этого события. На вкладке «Входящий PDU» те же MAC-адреса, а на вкладке «Модель OSI» коммутатор использует только уровни 1 и 2: он читает кадр, но не IP-пакет внутри него.

        **Шаг 6.** Нажмите «Шаг». Сигнал дойдет до концентратора Hub: «сигнал в Port 2 → повторён в Port 0, Port 1». В PDU концентратора есть только раздел «Уровень 1» с номером порта: концентратор не читает кадр и повторяет сигнал во все остальные порты.

        **Шаг 7.** Нажимайте «Шаг», пока кнопка «Шаг» не станет недоступной. Компьютер PC-31-2 получает эхо-запрос («echo-запрос доставлен · echo-ответ → 172.16.31.5»), а компьютер PC-31-3 его отбрасывает: «MAC назначения 000c.85cc.1da7 не для PC-31-3 · отброшен». Эхо-ответ возвращается к PC-31-5 через концентратор и коммутатор Switch1 («echo-ответ от 172.16.31.2 получен»), и команда **ping** в консоли компьютера PC-31-5 выводит ответ.

        ```
        C:\>ping -n 1 172.16.31.2

        Pinging 172.16.31.2 with 32 bytes of data:

        Reply from 172.16.31.2: bytes=32 time=6ms TTL=128

        Ping statistics for 172.16.31.2:
            Packets: Sent = 1, Received = 1, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 6ms, Maximum = 6ms, Average = 6ms
        ```

        **Шаг 8.** Откройте PDU эхо-ответа на коммутаторе Switch1 (строка «кадр в F0/1 → F0/3»). Сравните его MAC- и IP-адреса с адресами эхо-запроса.

        **Шаг 9.** Сравните входящий PDU компьютера PC-31-2 (строка «echo-запрос доставлен · echo-ответ → 172.16.31.5») с исходящим PDU компьютера PC-31-5 из шага 3 и с PDU концентратора из шага 6. Ответьте на вопросы 4 и 5 в форме ответов.

        **Шаг 10.** Нажмите «Лаборатория» вверху страницы. Откройте окно компьютера PC-31-2 и в приложении «Командная строка» проверьте связь с компьютером PC-31-3 командой **ping 172.16.31.3**.

        ```
        C:\>ping 172.16.31.3

        Pinging 172.16.31.3 with 32 bytes of data:

        Reply from 172.16.31.3: bytes=32 time=1ms TTL=128
        Reply from 172.16.31.3: bytes=32 time<1ms TTL=128
        Reply from 172.16.31.3: bytes=32 time<1ms TTL=128
        Reply from 172.16.31.3: bytes=32 time<1ms TTL=128

        Ping statistics for 172.16.31.3:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 11.** Нажмите «Симуляция», отправьте один эхо-запрос командой **ping -n 1 172.16.31.3** и нажимайте «Шаг», пока кнопка «Шаг» не станет недоступной. Концентратор повторяет сигнал и в порт Port 2, к коммутатору Switch1, но коммутатор кадр отбрасывает («кадр в F0/1 отброшен»): получатель находится за тем же портом F0/1, через который кадр пришел.

        **Шаг 12.** Аналогично проследите эхо-запрос от компьютера PC-31-4 к компьютеру PC-31-5. В режиме «Лаборатория» проверьте связь командой **ping 172.16.31.5**, а в режиме «Симуляция» отправьте один эхо-запрос командой **ping -n 1 172.16.31.5**. Коммутатор Switch1 пересылает кадр только в порт получателя («кадр в F0/2 → F0/3»), и ни один компьютер кадр не отбрасывает.

        ```
        C:\>ping 172.16.31.5

        Pinging 172.16.31.5 with 32 bytes of data:

        Reply from 172.16.31.5: bytes=32 time=1ms TTL=128
        Reply from 172.16.31.5: bytes=32 time<1ms TTL=128
        Reply from 172.16.31.5: bytes=32 time<1ms TTL=128
        Reply from 172.16.31.5: bytes=32 time<1ms TTL=128

        Ping statistics for 172.16.31.5:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Примечание.** Коммутатор пересылает одноадресный кадр только в тот порт, за которым находится получатель: этот порт он находит в своей таблице MAC-адресов. У концентратора такой таблицы нет, и он повторяет сигнал во все порты, поэтому кадр получают и те компьютеры, которым он не предназначен.

        **Шаг 13.** Ответьте на вопрос 13 в форме ответов.
    - title: "Наблюдение за PDU при связи с удаленной сетью"
      body: |
        **Шаг 1.** Нажмите кнопку «Сбросить» (↺) справа на панели «Симуляция»: список событий очистится.

        **Шаг 2.** В приложении «Командная строка» компьютера PC-31-5 отправьте один эхо-запрос ноутбуку Laptop-10-2 командой **ping -n 1 10.10.10.2**.

        **Шаг 3.** Откройте PDU первого события. На вкладке «Исходящий PDU» «MAC назначения» — 00d0.ba8e.741a, хотя «Назначение» — 10.10.10.2. Сравните этот MAC-адрес с адресами, которые вы нашли на странице «Начальное состояние».

        **Шаг 4.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 5.** Нажмите «Шаг» два раза: кадр пройдет коммутатор Switch1 («кадр в F0/3 → G0/1») и дойдет до маршрутизатора Router («TTL 128 · маршрут C 10.10.10.0/24 → G0/0»). Откройте PDU события на маршрутизаторе и сравните вкладки «Входящий PDU» и «Исходящий PDU». В исходящем кадре другие MAC-адреса: «MAC назначения» 0060.2f84.4ab6 и «MAC источника» 00d0.588c.2401. Значение TTL уменьшилось со 128 до 127, а IP-адреса источника и назначения остались прежними. На вкладке «Модель OSI» маршрутизатор использует уровни 1–3.

        **Шаг 6.** Ответьте на вопрос 14 в форме ответов.

        **Примечание.** Маршрутизатор выбирает выходной интерфейс по сети назначения пакета: «маршрут C 10.10.10.0/24 → G0/0» означает, что сеть 10.10.10.0/24 подключена к интерфейсу G0/0. Каждый интерфейс маршрутизатора подключен к своей сети, и по адресу сети назначения маршрутизатор определяет, через какой интерфейс передать пакет.

        **Шаг 7.** Нажимайте «Шаг»: кадр пройдет коммутатор Switch0 и точку доступа Access-Point («кадр в G0/1 → F0/2») и дойдет до ноутбука Laptop-10-2. Откройте PDU события на точке доступа. На вкладке «Модель OSI» точка доступа, как и коммутатор, использует только уровни 1 и 2, а MAC- и IP-адреса во входящем и исходящем кадре одинаковы.

        **Шаг 8.** Ответьте на вопросы 6, 7, 8 и 9 в форме ответов.

        **Шаг 9.** Нажимайте «Шаг», пока кнопка «Шаг» не станет недоступной, и проследите эхо-ответ. На маршрутизаторе он снова отправляется дальше в новом кадре («маршрут C 172.16.31.0/24 → G0/1»), а в консоли компьютера PC-31-5 команда **ping** выводит ответ.

        ```
        C:\>ping -n 1 10.10.10.2

        Pinging 10.10.10.2 with 32 bytes of data:

        Reply from 10.10.10.2: bytes=32 time=10ms TTL=127

        Ping statistics for 10.10.10.2:
            Packets: Sent = 1, Received = 1, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 10ms, Maximum = 10ms, Average = 10ms
        ```

        **Шаг 10.** Откройте PDU первого события эхо-ответа, на точке доступа Access-Point (строка «кадр в F0/2 → G0/1» после «echo-запрос доставлен»). «MAC источника» в нем — MAC-адрес ноутбука Laptop-10-2. Сравните «Источник» и «Назначение» в разделе «IPv4» этого PDU с адресами эхо-запроса из шага 3.

        **Шаг 11.** Ответьте на вопросы 15, 16, 17 и 18 в форме ответов.
    - title: "Проверка результатов"
      body: |
        **Шаг 1.** Нажмите «Лаборатория» вверху страницы, чтобы выйти из режима «Симуляция». Время в сети снова пойдет, а список событий очистится.

        Адреса эхо-запроса от PC-31-5 к Laptop-10-2 и эхо-ответа на каждом устройстве, которые вы видели в окне PDU:

        | На устройстве | MAC назначения | MAC источника | IP-адрес источника | IP-адрес назначения |
        |---|---|---|---|---|
        | PC-31-5 | 00d0.ba8e.741a | 00d0.d311.c788 | 172.16.31.5 | 10.10.10.2 |
        | Switch1 | 00d0.ba8e.741a | 00d0.d311.c788 | — | — |
        | Router, исходящий кадр | 0060.2f84.4ab6 | 00d0.588c.2401 | 172.16.31.5 | 10.10.10.2 |
        | Switch0 | 0060.2f84.4ab6 | 00d0.588c.2401 | — | — |
        | Access-Point | 0060.2f84.4ab6 | 00d0.588c.2401 | — | — |
        | Laptop-10-2, эхо-ответ | 00d0.588c.2401 | 0060.2f84.4ab6 | 10.10.10.2 | 172.16.31.5 |

        Прочерк означает, что устройство не использует уровень 3: IP-адреса есть в кадре, но коммутатор и точка доступа их не читают.

        **Шаг 2.** Ответьте на вопросы 12, 19 и 20 в форме ответов.

        **Примечание.** В сети IPv6 в пакете указаны 128-битные IPv6-адреса вместо 32-битных IPv4-адресов, а MAC-адрес соседа узел определяет не по протоколу ARP, а по протоколу обнаружения соседей (ND). Кадр Ethernet с MAC-адресами назначения и источника остается таким же.

        **Шаг 3.** Ответьте на вопрос 21 в форме ответов.
