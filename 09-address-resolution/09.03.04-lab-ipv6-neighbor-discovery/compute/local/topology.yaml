    - title: "Начальное состояние"
      body: |
        - На маршрутизаторе RTA включена маршрутизация IPv6, а интерфейсам G0/0/0 и G0/0/1 назначены IPv6-адреса по таблице адресации и один и тот же локальный адрес канала fe80::1.
        - На компьютерах заданы IPv6-адреса с префиксом /64 и шлюз по умолчанию fe80::1 — локальный адрес канала маршрутизатора RTA. Локальные адреса канала компьютеры создают сами.
        - На маршрутизаторе и коммутаторах включен протокол LLDP.
        - Настраивать в этой лабораторной работе ничего не нужно: вы наблюдаете, как узлы узнают MAC-адреса друг друга.

        **Шаг 1.** Откройте консоль маршрутизатора RTA и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 2.** Выведите таблицу соседей IPv6 командой **show ipv6 neighbors**. Таблица пуста: маршрутизатор еще не обменивался данными ни с одним узлом. Если в таблице есть записи (например, вы уже выполняли эту работу), удалите их командой **clear ipv6 neighbors**.

        ```
        RTA>enable
        RTA#show ipv6 neighbors
        IPv6 Address                              Age Link-layer Addr State Interface
        ```
    - title: "Поиск MAC-адреса соседа в локальной сети"
      body: |
        **Шаг 1.** Откройте окно компьютера PCA1 и на вкладке «Рабочий стол» запустите приложение «Командная строка».

        **Шаг 2.** Нажмите «Симуляция» вверху страницы. Под схемой откроется панель «Симуляция» со списком событий: время в сети остановится, и следующее событие будет выполняться по кнопке «Шаг».

        **Шаг 3.** На панели нажмите «Фильтры». В окне «Фильтры событий» нажмите «Ничего», затем в группе IPv6 выберите ICMPv6 и NDP и закройте окно. Кнопка будет называться «Фильтры · ICMPv6, NDP».

        **Шаг 4.** В приложении «Командная строка» компьютера PCA1 отправьте один эхо-запрос компьютеру PCA2 командой **ping -n 1 2001:db8:acad:1::b**. В списке событий появятся два события на PCA1: эхо-запрос ICMPv6 со статусом «ждёт ответа ND» и сообщение NDP «NS «кто 2001:db8:acad:1::b?»».

        **Шаг 5.** Нажмите «Пуск» и дождитесь, когда кнопка «Шаг» станет недоступной. Над списком будет указано «событий 11», а в командной строке PCA1 появится ответ.

        ```
        C:\>ping -n 1 2001:db8:acad:1::b

        Pinging 2001:DB8:ACAD:1::B with 32 bytes of data:

        Reply from 2001:DB8:ACAD:1::B: bytes=32 time=8ms TTL=128

        Ping statistics for 2001:DB8:ACAD:1::B:
            Packets: Sent = 1, Received = 1, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 8ms, Maximum = 8ms, Average = 8ms
        ```

        **Шаг 6.** Ответьте на вопрос 1 в форме ответов.

        **Шаг 7.** Щелкните цветной квадрат в столбце «Тип» первого события (ICMPv6 на PCA1). Откроется окно PDU с вкладками «Модель OSI» и «Исходящий PDU»; вкладки «Входящий PDU» нет, потому что пакет создан на этом устройстве. На вкладке «Исходящий PDU» найдите поле «Тип» заголовка ICMPv6.

        **Шаг 8.** Ответьте на вопрос 2 в форме ответов.

        **Шаг 9.** Перейдите на вкладку «Модель OSI». В столбце «Выход ↓» заполнен только уровень 3, а заголовка уровня 2 у пакета нет. Нажимайте «Следующий уровень»: PCA1 еще не знает MAC-адрес PCA2, поэтому сначала отправляет запрос соседа, а эхо-запрос ждет ответа.

        **Примечание.** Запрос соседа (NS) отправляется не на адрес PCA2, а на групповой адрес запрашиваемого узла: ff02::1:ff и последние 24 бита искомого адреса, здесь ff02::1:ff00:b. Его групповой MAC-адрес — 3333 и последние 32 бита этого группового адреса, 3333.ff00.000b. Такой кадр принимает только узел, адрес которого оканчивается так же; остальные узлы отбрасывают его, не обрабатывая.

        **Шаг 10.** Откройте второе событие — NDP на PCA1. Сравните на вкладке «Модель OSI» адреса уровней 3 и 2 с адресами эхо-запроса.

        **Шаг 11.** Ответьте на вопросы 3 и 4 в форме ответов.

        **Шаг 12.** Откройте следующее событие NDP — на коммутаторе SwitchA, у которого в столбце «Откуда» указан PCA1. Сравните на вкладке «Модель OSI» уровень 2 в столбцах «Вход ↑» и «Выход ↓».

        **Шаг 13.** Ответьте на вопрос 5 в форме ответов.

        **Шаг 14.** Откройте событие NDP на коммутаторе SwitchA, у которого в столбце «Откуда» указан PCA2. Это объявление соседа (NA), которым PCA2 ответил на запрос. На вкладке «Входящий PDU» видно, что ответ отправлен уже на индивидуальные адреса: «MAC назначения» 00d0.1335.ea01 — MAC-адрес PCA1, «MAC источника» 00d0.9f9b.9101 — MAC-адрес PCA2, «Источник» 2001:db8:acad:1::b и «Назначение» 2001:db8:acad:1::a в заголовке IPv6.

        **Шаг 15.** Откройте событие NDP на маршрутизаторе RTA («отброшен») и прочитайте на вкладке «Модель OSI» его шаги кнопкой «Следующий уровень».

        **Шаг 16.** Ответьте на вопрос 6 в форме ответов.

        **Шаг 17.** Откройте следующее событие ICMPv6, у которого в столбце «Откуда» указан PCA1 (на коммутаторе SwitchA), и посмотрите на вкладке «Модель OSI» адреса уровня 2.

        **Шаг 18.** Ответьте на вопрос 7 в форме ответов.

        **Шаг 19.** Откройте последнее событие списка — ICMPv6 на PCA1 («echo-ответ от 2001:db8:acad:1::b получен») — и найдите на вкладке «Входящий PDU» поле «Тип» заголовка ICMPv6.

        **Шаг 20.** Ответьте на вопрос 8 в форме ответов.

        **Шаг 21.** Нажмите кнопку «Сбросить» (↺) в правом конце панели «Симуляция»: список событий очистится. В командной строке PCA1 снова выполните команду **ping -n 1 2001:db8:acad:1::b**.

        **Шаг 22.** Нажимайте «Шаг», пока кнопка не станет недоступной. Теперь в списке пять событий ICMPv6 и ни одного события NDP.

        ```
        C:\>ping -n 1 2001:db8:acad:1::b

        Pinging 2001:DB8:ACAD:1::B with 32 bytes of data:

        Reply from 2001:DB8:ACAD:1::B: bytes=32 time=4ms TTL=128

        Ping statistics for 2001:DB8:ACAD:1::B:
            Packets: Sent = 1, Received = 1, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 4ms, Maximum = 4ms, Average = 4ms
        ```

        **Шаг 23.** Ответьте на вопрос 9 в форме ответов.
    - title: "Поиск MAC-адресов при обращении к удаленной сети"
      body: |
        **Шаг 1.** Нажмите кнопку «Сбросить» (↺) на панели «Симуляция». В командной строке PCA1 отправьте один эхо-запрос компьютеру PCB1 в другой сети командой **ping -n 1 2001:db8:acad:2::a**.

        **Шаг 2.** Нажмите «Пуск» и дождитесь, когда кнопка «Шаг» станет недоступной. На этот раз событий значительно больше: над списком указано «событий 28».

        ```
        C:\>ping -n 1 2001:db8:acad:2::a

        Pinging 2001:DB8:ACAD:2::A with 32 bytes of data:

        Reply from 2001:DB8:ACAD:2::A: bytes=32 time=24ms TTL=127

        Ping statistics for 2001:DB8:ACAD:2::A:
            Packets: Sent = 1, Received = 1, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 24ms, Maximum = 24ms, Average = 24ms
        ```

        **Шаг 3.** Откройте первое событие — ICMPv6 на PCA1. Как и в локальной сети, у эхо-запроса пока нет заголовка уровня 2, и он ждет ответа ND.

        **Примечание.** Пакет для другой сети узел отправляет своему шлюзу по умолчанию, поэтому ищет MAC-адрес не получателя, а маршрутизатора — адреса fe80::1. Сообщения NDP не выходят за пределы своего канала: маршрутизатор не пересылает их в другие сети, а в сети назначения сам отправляет запрос соседа.

        **Шаг 4.** Откройте первое событие NDP на PCA1 («NS «кто fe80::1?»») и найдите на вкладке «Исходящий PDU» поле «Источник» заголовка IPv6.

        **Шаг 5.** Ответьте на вопрос 10 в форме ответов.

        **Шаг 6.** Откройте второе событие ICMPv6, у которого в столбце «Откуда» указан PCA1 (на коммутаторе SwitchA, «кадр в F0/1 → G0/1»). Теперь у PCA1 есть все, чтобы отправить эхо-запрос. Найдите на вкладке «Входящий PDU» поле «MAC назначения».

        **Шаг 7.** Ответьте на вопрос 11 в форме ответов.

        **Шаг 8.** Откройте событие ICMPv6 на маршрутизаторе RTA со статусом «ждёт ответа ND». В столбце «Выход ↓» вкладки «Модель OSI» пусто: RTA не знает MAC-адрес PCB1 в сети интерфейса G0/0/1 и сначала отправляет в эту сеть свой запрос соседа (следующие события NDP на SwitchB и PCB1).

        **Шаг 9.** Откройте первое событие ICMPv6 на PCB1 («echo-запрос доставлен») и посмотрите, какие события идут за ним.

        **Шаг 10.** Ответьте на вопрос 12 в форме ответов.

        **Шаг 11.** Просмотрите последние события списка: когда эхо-ответ доходит до RTA, маршрутизатор так же ищет MAC-адрес PCA1 в сети интерфейса G0/0/0, и только после этого эхо-ответ доходит до PCA1.

        **Шаг 12.** Нажмите кнопку «Сбросить» (↺) и в командной строке PCA1 снова выполните команду **ping -n 1 2001:db8:acad:2::a**.

        **Шаг 13.** Нажимайте «Шаг», пока кнопка не станет недоступной. Теперь в списке девять событий ICMPv6 и ни одного события NDP.

        ```
        C:\>ping -n 1 2001:db8:acad:2::a

        Pinging 2001:DB8:ACAD:2::A with 32 bytes of data:

        Reply from 2001:DB8:ACAD:2::A: bytes=32 time=8ms TTL=127

        Ping statistics for 2001:DB8:ACAD:2::A:
            Packets: Sent = 1, Received = 1, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 8ms, Maximum = 8ms, Average = 8ms
        ```

        **Шаг 14.** Ответьте на вопрос 13 в форме ответов.

        **Шаг 15.** Откройте событие ICMPv6 на коммутаторе SwitchB, у которого в столбце «Откуда» указан PCB1, — эхо-ответ компьютера PCB1. Найдите на вкладке «Входящий PDU» поле «MAC назначения», а на вкладке «Модель OSI» события на RTA, которое идет за ним, прочитайте, чей это MAC-адрес.

        **Шаг 16.** Ответьте на вопросы 14 и 15 в форме ответов.
    - title: "Проверка таблицы соседей маршрутизатора"
      body: |
        **Шаг 1.** Нажмите «Лаборатория» вверху страницы: панель «Симуляция» закроется, и время в сети снова пойдет.

        **Шаг 2.** В консоли маршрутизатора RTA выведите таблицу соседей IPv6 командой **show ipv6 neighbors**. В таблице есть IPv6-адреса и локальные адреса канала, которые RTA узнал во время эхо-запроса к PCB1, с MAC-адресами и интерфейсами, за которыми находятся эти узлы.

        ```
        RTA#show ipv6 neighbors
        IPv6 Address                              Age Link-layer Addr State Interface
        2001:DB8:ACAD:1::A                          0 00d0.1335.ea01  REACH Gi0/0/0
        2001:DB8:ACAD:2::A                          0 00d0.ec7d.d401  REACH Gi0/0/1
        FE80::2D0:13FF:FE35:EA01                    0 00d0.1335.ea01  REACH Gi0/0/0
        FE80::2D0:ECFF:FE7D:D401                    0 00d0.ec7d.d401  REACH Gi0/0/1
        ```

        **Шаг 3.** Ответьте на вопросы 16, 17 и 18 в форме ответов.

        **Шаг 4.** Проверьте связь маршрутизатора с компьютером PCA2 командой **ping 2001:db8:acad:1::b** и снова выведите таблицу соседей командой **show ipv6 neighbors**. Теперь в ней есть запись для адреса 2001:DB8:ACAD:1::B компьютера PCA2: чтобы отправить эхо-запрос, RTA сам отправил запрос соседа и получил объявление соседа от PCA2.

        ```
        RTA#ping 2001:db8:acad:1::b
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 2001:DB8:ACAD:1::B, timeout is 2 seconds:
        !!!!!
        Success rate is 100 percent (5/5), round-trip min/avg/max = 1/2/4 ms
        RTA#show ipv6 neighbors
        IPv6 Address                              Age Link-layer Addr State Interface
        2001:DB8:ACAD:1::A                          0 00d0.1335.ea01  REACH Gi0/0/0
        2001:DB8:ACAD:1::B                          0 00d0.9f9b.9101  REACH Gi0/0/0
        2001:DB8:ACAD:2::A                          0 00d0.ec7d.d401  REACH Gi0/0/1
        FE80::2D0:13FF:FE35:EA01                    0 00d0.1335.ea01  REACH Gi0/0/0
        FE80::2D0:ECFF:FE7D:D401                    0 00d0.ec7d.d401  REACH Gi0/0/1
        ```

        **Шаг 5.** Выведите список соседей по протоколу LLDP командой **show lldp neighbors**. В нем только коммутаторы SwitchA и SwitchB.

        ```
        RTA#show lldp neighbors
        Capability codes:
            (R) Router, (B) Bridge, (T) Telephone, (C) DOCSIS Cable Device
            (W) WLAN Access Point, (P) Repeater, (S) Station, (O) Other

        Device ID           Local Intf     Hold-time  Capability      Port ID
        SwitchA             Gi0/0/0        98         B               Gi0/1
        SwitchB             Gi0/0/1        98         B               Gi0/1

        Total entries displayed: 2
        ```

        **Примечание.** Протокол LLDP сообщает соседям сведения о сетевом устройстве: имя, порт, возможности. Таблица соседей IPv6 и список соседей LLDP заполняются разными протоколами, и в список LLDP попадают только устройства, которые сами отправляют сообщения LLDP.

        **Шаг 6.** Ответьте на вопрос 19 в форме ответов.

        **Шаг 7.** Ответьте на вопросы 20–23 в форме ответов.
