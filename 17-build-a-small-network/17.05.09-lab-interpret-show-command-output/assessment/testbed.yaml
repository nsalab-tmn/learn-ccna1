# Not generated (see ms.yaml): ISPRouter over its per-device SSH port.
testbed:
  name: netsim-17.5.9
devices:
  ISPRouter:
    os: iosxe
    type: router
    credentials:
      default:
        username: '%ENV{ssh_user}'
        password: '%ENV{ssh_password}'  # ggignore - a placeholder, filled at grading time
    connections:
      cli:
        protocol: ssh
        ip: '%ENV{lab_ip}'
        port: '%ENV{ssh_port_ISPRouter}'
        ssh_options: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no
        arguments:
          connection_timeout: 30
          learn_hostname: true
        settings:
          HA_INIT_CONFIG_COMMANDS: []
