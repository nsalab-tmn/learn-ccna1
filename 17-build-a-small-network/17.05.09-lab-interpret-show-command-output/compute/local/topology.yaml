scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Последовательный | Internet | S0/0/0 | ISPRouter | S0/0/0 |
