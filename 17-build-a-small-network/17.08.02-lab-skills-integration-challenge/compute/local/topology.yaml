    - title: "Начальное состояние"
      body: |
        - Маршрутизаторы Central и ISP и сервер Web полностью настроены, и настраивать их не нужно. Маршрутизатор ISP изображает сеть провайдера, а сервер Web — сайт www.nsalab.local и DNS-сервер, который сообщает адрес этого сайта. Маршрутизатор Central пересылает к маршрутизатору R1 пакеты для всей сети 192.168.0.0/24 и для сетей IPv6 офиса.
        - На маршрутизаторе R1 настроен только интерфейс S0/0/1 к маршрутизатору Central, включена маршрутизация IPv6, а маршруты по умолчанию для IPv4 и IPv6 ведут к маршрутизатору Central. Имя устройства не задано (приглашение Router>), а интерфейсы G0/0, G0/1 и G0/2 выключены и не имеют адресов.
        - Коммутаторы S1, S2 и S3 не настроены: все их параметры имеют значения по умолчанию (приглашение Switch>).
        - На компьютерах Staff, Sales и IT IP-адреса не заданы.

        В начальном состоянии интерфейсы G0/0, G0/1 и G0/2 маршрутизатора R1 выключены (administratively down) и не имеют адресов, а интерфейс S0/0/1 работает (**show ip interface brief** в привилегированном режиме EXEC в консоли R1):

        ```
        Router>enable
        Router#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         unassigned      YES unset  administratively down down
        GigabitEthernet0/1         unassigned      YES unset  administratively down down
        GigabitEthernet0/2         unassigned      YES unset  administratively down down
        Serial0/0/0                unassigned      YES unset  administratively down down
        Serial0/0/1                172.16.1.2      YES manual up                    up
        ```

        Маршрутизатор R1 уже получает ответы от сервера Web (**ping 64.100.0.3**): каналы до сети провайдера и маршруты к ней настроены. Первый эхо-запрос остается без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        Router#ping 64.100.0.3
        Type escape sequence to abort.
        Sending 5, 100-byte ICMP Echos to 64.100.0.3, timeout is 2 seconds:
        .!!!!
        Success rate is 80 percent (4/5), round-trip min/avg/max = 2/3/5 ms
        ```

        У компьютеров нет IPv4-адреса, а из IPv6-адресов есть только локальный адрес канала, сформированный автоматически (**ipconfig** в приложении «Командная строка» компьютера Staff):

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:DDFF:FEA9:6B01
           IPv6 Address....................: ::
           IPv4 Address....................: 0.0.0.0
           Subnet Mask.....................: 0.0.0.0
           Default Gateway.................: 0.0.0.0
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами. Значения, отмеченные в таблицах знаком «?», вы определяете сами по требованиям.
    - title: "Разработка плана адресации"
      body: |
        **Требование 1.** Подсети локальных сетей Staff, Sales и IT и будущей гостевой сети Guest выделены из сети 192.168.0.0/24. Подсеть каждой сети — наименьшая подсеть, в которой помещается число узлов из таблицы локальных сетей.

        **Требование 2.** Подсети расположены одна за другой, начиная с адреса 192.168.0.0, без неиспользуемого адресного пространства между ними, в порядке убывания числа узлов: Staff, Sales, IT, затем Guest. Подсеть Guest записана в план адресации, но в этой лабораторной работе нигде не настраивается.
    - title: "Базовая настройка и защита маршрутизатора R1"
      body: |
        **Требование 3.** Имя устройства маршрутизатора — R1. Поиск имен через DNS (domain lookup) выключен: ошибочно введенная команда не принимается за имя узла.

        **Требование 4.** Пароль привилегированного режима EXEC — Ciscoenpa55. Он задан как секретный пароль (enable secret) и хранится в конфигурации в виде хеша.

        **Требование 5.** Вход с консоли защищен паролем Ciscoconpa55: консоль запрашивает пароль при входе.

        **Требование 6.** Минимальная длина всех паролей — 10 символов. Пароли, которые хранятся в конфигурации открытым текстом, зашифрованы.

        **Требование 7.** При подключении выводится баннер дня (MOTD) с предупреждением о том, что несанкционированный доступ запрещен. Текст баннера выбираете вы.

        **Требование 8.** К маршрутизатору R1 можно подключиться по сети только по протоколу SSH: доменное имя маршрутизатора — CCNA-lab.com, создан ключ RSA длиной не менее 2048 бит, а все линии виртуальных терминалов (VTY) принимают только подключения SSH.

        **Требование 9.** Вход по линиям VTY проверяется по локальным учетным записям. На маршрутизаторе создан пользователь Admin1 с уровнем привилегий 15 и паролем Admin1pa55, который задан как секретный (secret) и хранится в конфигурации в виде хеша.

        **Требование 10.** Сеанс на консоли и на линиях VTY закрывается после 5 минут бездействия.

        **Требование 11.** Если за 120 секунд (2 минуты) выполнено 4 неудачные попытки входа, вход на маршрутизатор блокируется на 180 секунд (3 минуты).
    - title: "Настройка интерфейсов маршрутизатора R1"
      body: |
        **Требование 12.** Интерфейсы G0/0, G0/1 и G0/2 маршрутизатора R1, к которым подключены коммутаторы S1, S2 и S3, включены. Каждый из них имеет первый используемый адрес узла подсети своей локальной сети и маску этой подсети: G0/0 — в сети Staff, G0/1 — в сети Sales, G0/2 — в сети IT.

        **Требование 13.** У интерфейсов G0/0, G0/1 и G0/2 есть глобальные индивидуальные IPv6-адреса (GUA) из таблицы адресации с длиной префикса /64, а их локальный адрес канала задан вручную: fe80::1 на всех трех интерфейсах.

        **Примечание.** Локальный адрес канала действует только в пределах своей сети, поэтому на разных интерфейсах маршрутизатора он может совпадать. Простой, заданный вручную адрес fe80::1 удобно указывать узлам как шлюз IPv6 по умолчанию.
    - title: "Базовая настройка коммутаторов"
      body: |
        **Требование 14.** Имена устройств коммутаторов — S1, S2 и S3. На каждом коммутаторе поиск имен через DNS (domain lookup) выключен.

        **Требование 15.** На каждом коммутаторе пароль привилегированного режима EXEC — Ciscoenpa55, он задан как секретный пароль (enable secret), а вход с консоли защищен паролем Ciscoconpa55. Пароли, которые хранятся в конфигурации открытым текстом, зашифрованы.

        **Требование 16.** Сеанс на консоли и на линиях VTY каждого коммутатора закрывается после 5 минут бездействия.

        **Требование 17.** Интерфейс управления каждого коммутатора — интерфейс VLAN 1 — включен и имеет второй используемый адрес узла подсети своей локальной сети и маску этой подсети: S1 — в сети Staff, S2 — в сети Sales, S3 — в сети IT.

        **Требование 18.** Шлюз по умолчанию каждого коммутатора — интерфейс маршрутизатора R1 в его локальной сети.
    - title: "Настройка компьютеров"
      body: |
        **Требование 19.** Каждому компьютеру назначен последний используемый адрес узла подсети его локальной сети и маска этой подсети: компьютеру Staff — в сети Staff, Sales — в сети Sales, IT — в сети IT. Шлюз по умолчанию каждого компьютера — интерфейс маршрутизатора R1 в его локальной сети.

        **Требование 20.** У каждого компьютера IPv6-адрес и длина префикса — из таблицы адресации, локальный адрес канала задан вручную: fe80::2, а шлюз IPv6 по умолчанию — локальный адрес канала маршрутизатора R1 fe80::1.

        **Требование 21.** DNS-сервер каждого компьютера — сервер Web с адресом 64.100.0.3, поэтому компьютеры обращаются к сайту www.nsalab.local по имени.
    - title: "Проверка связи и доступа к сайту"
      body: |
        **Примечание.** После включения интерфейса маршрутизатора порт коммутатора, к которому он подключен, начинает пересылать кадры примерно через 30 секунд: протокол STP сначала проверяет, нет ли петли. Первый эхо-запрос к узлу другой сети может остаться без ответа, пока устройства определяют MAC-адреса по протоколу ARP.

        **Шаг 1.** В приложении «Командная строка» компьютера Staff проверьте связь с сервером Web командой **ping 64.100.0.3**. Сервер Web отвечает: маршрутизатор R1 пересылает пакеты из сети Staff к маршрутизатору Central, а дальше они проходят через сеть провайдера.

        ```
        C:\>ping 64.100.0.3

        Pinging 64.100.0.3 with 32 bytes of data:

        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125
        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125
        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125
        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125

        Ping statistics for 64.100.0.3:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Откройте окно компьютера Sales и в приложении «Командная строка» проверьте связь с сервером Web по IPv6 командой **ping 2001:db8:cafe::3**. Сервер Web отвечает.

        ```
        C:\>ping 2001:db8:cafe::3

        Pinging 2001:DB8:CAFE::3 with 32 bytes of data:

        Reply from 2001:DB8:CAFE::3: bytes=32 time=4ms TTL=125
        Reply from 2001:DB8:CAFE::3: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:CAFE::3: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:CAFE::3: bytes=32 time=2ms TTL=125

        Ping statistics for 2001:DB8:CAFE::3:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 4ms, Average = 2ms
        ```

        **Шаг 3.** Откройте окно компьютера IT и в приложении «Командная строка» проверьте связь с сайтом по имени командой **ping www.nsalab.local**. DNS-сервер Web сообщает компьютеру адрес сайта 64.100.0.3, и сервер отвечает.

        ```
        C:\>ping www.nsalab.local

        Pinging 64.100.0.3 with 32 bytes of data:

        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125
        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125
        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125
        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125

        Ping statistics for 64.100.0.3:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 4.** На вкладке «Рабочий стол» компьютера Staff откройте приложение «Веб-браузер», введите адрес **www.nsalab.local** и нажмите «Перейти». Открывается страница с заголовком «www.nsalab.local» и текстом «Сервер Web: страница открылась, значит, адресация и маршруты до него работают». Аналогично откройте сайт на компьютерах Sales и IT, а на всех трех компьютерах — также по IPv6-адресу **2001:db8:cafe::3**.

        **Шаг 5.** Аналогично шагу 1 проверьте с каждого компьютера связь по IPv4 с двумя другими компьютерами, с интерфейсами управления коммутаторов S1, S2 и S3 и с интерфейсами G0/0, G0/1 и G0/2 маршрутизатора R1, а по IPv6 — с двумя другими компьютерами. Ответы приходят от всех устройств.

        **Шаг 6.** В приложении «Командная строка» компьютера Staff подключитесь к маршрутизатору R1 по SSH командой **ssh -l Admin1** с адресом интерфейса G0/0 маршрутизатора и введите пароль Admin1pa55. Маршрутизатор выводит баннер дня, а после входа сразу открывается привилегированный режим EXEC (приглашение R1#): у пользователя Admin1 уровень привилегий 15. Завершите сеанс командой **exit**.

        **Шаг 7.** Выйдите из консоли маршрутизатора R1 командой **exit** и снова нажмите Enter. Консоль выводит баннер дня и запрашивает пароль: введите Ciscoconpa55. Пароль привилегированного режима EXEC — Ciscoenpa55. Так же проверьте консоли коммутаторов S1, S2 и S3. Если консоль не использовалась больше 5 минут, сеанс в ней уже закрыт по требованиям 10 и 16: консоль предлагает нажать Enter («Press RETURN to get started.»).
