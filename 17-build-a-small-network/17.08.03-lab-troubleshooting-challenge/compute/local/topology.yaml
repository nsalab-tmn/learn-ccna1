    - title: "Начальное состояние"
      body: |
        - Маршрутизаторы Main и ISP и сервер Web настроены по таблице адресации. Маршрутизатор ISP изображает сеть провайдера. Маршруты между сетями настроены статически.
        - На маршрутизаторе R1, коммутаторах S1–S3 и компьютерах IT, Marketing и R-D заданы IP-настройки. На R1 также заданы имя домена, ключи RSA для протокола SSH, локальная учетная запись и линии VTY 0–4 для удаленного доступа.
        - Консоль маршрутизатора R1 и коммутаторов S1–S3 защищена паролем Ciscoconpa55: после нажатия клавиши Enter консоль запрашивает пароль («Password:»). Привилегированный режим EXEC защищен паролем Ciscoenpa55.
        - После обновления сети часть устройств настроили заново, и в их настройке есть ошибки: часть компьютеров не получает ответы от сервера, маршрутизатора R1 или коммутаторов, а подключиться к R1 по протоколу SSH не удается. Сколько ошибок и на каких устройствах они находятся, вам предстоит выяснить.

        После запуска лабораторной работы дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым («Соединение активно» в условных обозначениях). Компьютер R-D получает ответы на эхо-запросы от сервера Web (**ping 64.100.0.3** в приложении «Командная строка»). Первый эхо-запрос остается без ответа, пока устройства на пути определяют MAC-адреса следующих переходов по протоколу ARP.

        ```
        C:\>ping 64.100.0.3

        Pinging 64.100.0.3 with 32 bytes of data:

        Request timed out.
        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125
        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125
        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125

        Ping statistics for 64.100.0.3:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для поиска и устранения неполадок вы выбираете сами. Найдите и устраните все ошибки так, чтобы выполнялись все требования.
    - title: "Устранение неполадок IP-адресации"
      body: |
        **Требование 1.** IPv4-адреса, маски подсети и шлюзы по умолчанию маршрутизатора R1, коммутаторов S1, S2 и S3 и компьютеров IT, Marketing и R-D соответствуют таблице адресации.

        **Требование 2.** IPv6-адреса, длины префиксов и шлюзы по умолчанию маршрутизатора R1 и компьютеров IT, Marketing и R-D соответствуют таблице адресации.
    - title: "Устранение неполадок удаленного доступа"
      body: |
        **Требование 3.** На маршрутизаторе R1 есть локальная учетная запись Admin1 с паролем Admin1pa55. Имя учетной записи и пароль чувствительны к регистру.

        **Требование 4.** Все линии VTY маршрутизатора R1, с 0 по 4, принимают удаленные подключения только по протоколу SSH и проверяют вход по локальным учетным записям. Подключение по протоколу Telnet маршрутизатор отклоняет.

        **Примечание.** Протокол Telnet передает по сети имя пользователя, пароль и все команды сеанса открытым текстом, а протокол SSH шифрует весь сеанс. Поэтому для удаленного управления устройствами используют SSH.
    - title: "Проверка связи и удаленного доступа"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера IT проверьте связь с сервером Web командой **ping 64.100.0.3**. Компьютер IT получает ответы от сервера.

        ```
        C:\>ping 64.100.0.3

        Pinging 64.100.0.3 with 32 bytes of data:

        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125
        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125
        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125
        Reply from 64.100.0.3: bytes=32 time=2ms TTL=125

        Ping statistics for 64.100.0.3:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 2.** Откройте окно компьютера Marketing и в приложении «Командная строка» проверьте связь с маршрутизатором R1 по адресу шлюза по умолчанию командой **ping 172.16.1.126**. Компьютер Marketing получает ответы от маршрутизатора R1.

        ```
        C:\>ping 172.16.1.126

        Pinging 172.16.1.126 with 32 bytes of data:

        Reply from 172.16.1.126: bytes=32 time=1ms TTL=255
        Reply from 172.16.1.126: bytes=32 time<1ms TTL=255
        Reply from 172.16.1.126: bytes=32 time<1ms TTL=255
        Reply from 172.16.1.126: bytes=32 time<1ms TTL=255

        Ping statistics for 172.16.1.126:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 3.** Откройте окно компьютера R-D и в приложении «Командная строка» проверьте связь с сервером Web по IPv6 командой **ping 2001:db8:acad::3**. Компьютер R-D получает ответы от сервера по IPv6.

        ```
        C:\>ping 2001:db8:acad::3

        Pinging 2001:DB8:ACAD::3 with 32 bytes of data:

        Reply from 2001:DB8:ACAD::3: bytes=32 time=4ms TTL=125
        Reply from 2001:DB8:ACAD::3: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:ACAD::3: bytes=32 time=2ms TTL=125
        Reply from 2001:DB8:ACAD::3: bytes=32 time=2ms TTL=125

        Ping statistics for 2001:DB8:ACAD::3:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 4ms, Average = 2ms
        ```

        **Шаг 4.** В приложении «Командная строка» компьютера IT проверьте связь с коммутатором S2 командой **ping 172.16.1.125**. Компьютер IT получает ответы от коммутатора S2, который находится в сети другого отдела. Первый эхо-запрос может остаться без ответа, пока устройства на пути определяют MAC-адреса по протоколу ARP.

        ```
        C:\>ping 172.16.1.125

        Pinging 172.16.1.125 with 32 bytes of data:

        Request timed out.
        Reply from 172.16.1.125: bytes=32 time=1ms TTL=254
        Reply from 172.16.1.125: bytes=32 time=1ms TTL=254
        Reply from 172.16.1.125: bytes=32 time=1ms TTL=254

        Ping statistics for 172.16.1.125:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 5.** В приложении «Командная строка» компьютера IT подключитесь к маршрутизатору R1 по протоколу SSH командой **ssh -l Admin1 172.16.1.62** и введите пароль Admin1pa55. Пароль при вводе не отображается. Маршрутизатор принимает вход и выводит свое приглашение: R1> или, если учетной записи задан уровень привилегий 15, R1#.

        **Шаг 6.** Завершите сеанс SSH командой **exit**.

        ```
        C:\>ssh -l Admin1 172.16.1.62
        Password: 
        R1>exit


        [Connection to 172.16.1.62 closed by foreign host]
        ```

        **Шаг 7.** В приложении «Командная строка» компьютера IT подключитесь к маршрутизатору R1 по протоколу Telnet командой **telnet 172.16.1.62**. Маршрутизатор отклоняет подключение («Connection refused by remote host»): его линии VTY принимают только протокол SSH.

        ```
        C:\>telnet 172.16.1.62
        Trying 172.16.1.62 ... 
        % Connection refused by remote host
        ```

        **Шаг 8.** Аналогично убедитесь, что каждый из компьютеров IT, Marketing и R-D получает ответы от сервера Web по IPv4 (64.100.0.3) и IPv6 (2001:db8:acad::3), от интерфейса маршрутизатора R1 в своей сети по IPv4 и IPv6 и от коммутаторов S1 (172.16.1.61), S2 (172.16.1.125) и S3 (172.16.1.253), а также подключается к R1 по протоколу SSH по адресу своего шлюза. Первый эхо-запрос к коммутатору другого отдела может остаться без ответа.
