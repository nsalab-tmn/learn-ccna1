    - title: "Несогласование дуплекса на канале S1—R1"
      body: |
        Не все неполадки связи — в адресах. Скорость и режим дуплекса порта Ethernet обычно согласуются автоматически. Если на одном конце канала их задали вручную, этот конец больше не участвует в автосогласовании, а другой конец, оставшийся в автоматическом режиме, определяет скорость по сигналу, но не может узнать режим дуплекса и переходит на полудуплекс. Такое несогласование дуплекса (duplex mismatch) коварно: канал поднимается и работает, но кадры сталкиваются, часть теряется, а остальные задерживаются — пользователи жалуются на медленную сеть. На этой странице вы создадите такую неполадку на канале между коммутатором S1 и маршрутизатором R1, увидите ее признаки и устраните ее.

        **Шаг 1.** Откройте консоль коммутатора S1 на схеме и нажмите Enter (его имя устройства не задано, поэтому приглашение — Switch>), перейдите в привилегированный режим EXEC командой **enable** и выведите состояние портов командой **show interfaces status**. У порта Gi0/1, к которому подключен маршрутизатор R1, в столбцах Duplex и Speed стоят a-full и a-1000: префикс a- означает, что режим и скорость получены автосогласованием. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение Switch#.

        ```
        Switch>enable
        Switch#show interfaces status
        Port      Name               Status       Vlan       Duplex  Speed Type
        Fa0/1                        connected    1          a-full  a-100 10/100BaseTX
        Fa0/2                        connected    1          a-full  a-100 10/100BaseTX
        Fa0/3                        notconnect   1            auto   auto 10/100BaseTX
        Fa0/4                        notconnect   1            auto   auto 10/100BaseTX
        Fa0/5                        notconnect   1            auto   auto 10/100BaseTX
        Fa0/6                        notconnect   1            auto   auto 10/100BaseTX
        Fa0/7                        notconnect   1            auto   auto 10/100BaseTX
        Fa0/8                        notconnect   1            auto   auto 10/100BaseTX
        Fa0/9                        notconnect   1            auto   auto 10/100BaseTX
        Fa0/10                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/11                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/12                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/13                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/14                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/15                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/16                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/17                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/18                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/19                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/20                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/21                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/22                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/23                       notconnect   1            auto   auto 10/100BaseTX
        Fa0/24                       notconnect   1            auto   auto 10/100BaseTX
        Gi0/1                        connected    1          a-full a-1000 10/100/1000BaseTX
        Gi0/2                        notconnect   1            auto   auto 10/100/1000BaseTX
        ```

        **Шаг 2.** Перейдите в режим глобальной конфигурации командой **configure terminal**, затем к порту командой **interface g0/1**. Задайте скорость вручную командой **speed 100**, затем режим дуплекса командой **duplex full** и вернитесь в привилегированный режим EXEC командой **end**. После каждой команды канал на пару секунд опускается и снова поднимается, а после второй коммутатор сообщает о несогласовании дуплекса (%CDP-4-DUPLEX_MISMATCH): его порт работает в полнодуплексном режиме, а порт GigabitEthernet0/0 маршрутизатора R1 — в полудуплексном.

        ```
        Switch#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Switch(config)#interface g0/1
        Switch(config-if)#speed 100
        *Mar  1 00:15:05.150: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to down
        *Mar  1 00:15:05.150: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to down
        *Mar  1 00:15:06.150: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        *Mar  1 00:15:07.150: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        Switch(config-if)#duplex full
        *Mar  1 00:15:10.150: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to down
        *Mar  1 00:15:10.150: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to down
        *Mar  1 00:15:11.150: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        *Mar  1 00:15:12.150: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        *Mar  1 00:15:12.150: %CDP-4-DUPLEX_MISMATCH: duplex mismatch discovered on GigabitEthernet0/1 (not half duplex), with R1 GigabitEthernet0/0 (half duplex).
        Switch(config-if)#end
        *Mar  1 00:15:15.150: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Пока была задана только скорость, порт еще участвовал в автосогласовании и сообщал соседу режим дуплекса. Когда вручную заданы и скорость, и дуплекс, порт перестает согласовывать: маршрутизатор R1 определяет скорость 100 Мбит/с по сигналу, но режим дуплекса узнать не может и выбирает полудуплекс. О несогласовании сообщает протокол обнаружения соседей (CDP), по которому соседние маршрутизаторы и коммутаторы обмениваются сведениями о своих портах.

        **Шаг 3.** В приложении «Командная строка» компьютера PC-01 проверьте связь с веб-сервером командой **ping 209.165.201.2**. Сервер отвечает, но время ответа выросло с 2 мс до десятков миллисекунд и меняется от запроса к запросу: кадры на канале S1—R1 сталкиваются и передаются повторно.

        ```
        C:\>ping 209.165.201.2

        Pinging 209.165.201.2 with 32 bytes of data:

        Reply from 209.165.201.2: bytes=32 time=33ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=63ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=62ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=37ms TTL=126

        Ping statistics for 209.165.201.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 33ms, Maximum = 63ms, Average = 48ms
        ```

        **Шаг 4.** Откройте окно компьютера PC-A и проверьте связь с компьютером PC-01 командой **ping 172.16.1.3**. Этот путь тоже проходит через канал S1—R1, и ответы так же медленны. Связь внутри каждой локальной сети при этом не страдает.

        ```
        C:\>ping 172.16.1.3

        Pinging 172.16.1.3 with 32 bytes of data:

        Reply from 172.16.1.3: bytes=32 time=54ms TTL=127
        Reply from 172.16.1.3: bytes=32 time=50ms TTL=127
        Reply from 172.16.1.3: bytes=32 time=48ms TTL=127
        Reply from 172.16.1.3: bytes=32 time=42ms TTL=127

        Ping statistics for 172.16.1.3:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 42ms, Maximum = 54ms, Average = 48ms
        ```

        **Шаг 5.** Чтобы признаки проявились, создайте больше трафика: в приложении «Командная строка» компьютера PC-01 выполните команду **ping -n 20 209.165.201.2**. Часть эхо-запросов остается без ответа: кадры, потерянные в коллизиях, до сервера не доходят. Ниже показаны первые ответы и итог; строки между ними опущены.

        ```
        C:\>ping -n 20 209.165.201.2

        Pinging 209.165.201.2 with 32 bytes of data:

        Reply from 209.165.201.2: bytes=32 time=33ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=72ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=29ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=53ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=32ms TTL=126
        Request timed out.
        …

        Ping statistics for 209.165.201.2:
            Packets: Sent = 20, Received = 19, Lost = 1 (5% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 17ms, Maximum = 72ms, Average = 43ms
        ```

        **Шаг 6.** В консоли коммутатора S1 выведите строку порта командой **show interfaces status | include Gi0/1**. Теперь в столбцах стоят full и 100 без префикса a-: значения заданы вручную.

        ```
        Switch#show interfaces status | include Gi0/1
        Gi0/1                        connected    1            full    100 10/100/1000BaseTX
        ```

        **Шаг 7.** Выведите подробные сведения о порте командой **show interfaces g0/1**. Строка «Full-duplex, 100Mb/s» показывает, в каком режиме работает порт, а полоса пропускания BW стала 100000 Kbit/sec. Кадры, поврежденные коллизиями на другом конце канала, коммутатор считает в строках «input errors» и «CRC»: их счетчики уже не нулевые. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение Switch#.

        ```
        Switch#show interfaces g0/1
        GigabitEthernet0/1 is up, line protocol is up (connected)
          Hardware is Gigabit Ethernet, address is 00d0.3170.c101 (bia 00d0.3170.c101)
          MTU 1500 bytes, BW 100000 Kbit/sec, DLY 100 usec,
