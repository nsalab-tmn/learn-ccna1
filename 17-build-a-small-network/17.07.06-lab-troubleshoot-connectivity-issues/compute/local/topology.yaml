            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 3.** Проверьте связь с веб-сервером командой **ping 209.165.201.2**. Тот же ответ: без шлюза компьютер не может отправить пакет в другую сеть. Ответьте на вопрос 16 в форме ответов.

        ```
        C:\>ping 209.165.201.2

        Pinging 209.165.201.2 with 32 bytes of data:

