        **Шаг 10.** Выведите строку порта командой **show interfaces status | include Gi0/1**. В столбцах снова a-full и a-1000.

        ```
        Switch#show interfaces status | include Gi0/1
        Gi0/1                        connected    1          a-full a-1000 10/100/1000BaseTX
        ```

        **Шаг 11.** В приложении «Командная строка» компьютера PC-01 повторите проверку командой **ping 209.165.201.2**. Время ответа снова 2 мс. Запишите в документацию проверок эту неполадку, ее признаки и решение.

        ```
        C:\>ping 209.165.201.2

        Pinging 209.165.201.2 with 32 bytes of data:

        Reply from 209.165.201.2: bytes=32 time=2ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=2ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=2ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=2ms TTL=126

        Ping statistics for 209.165.201.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Примечание.** В реальной сети несогласование дуплекса находят именно по этим признакам: медленные и неровные ответы при работающем канале, сообщение о несогласовании в журнале устройств, растущие счетчики коллизий на одном конце и ошибок приема на другом. Устраняют его так, чтобы оба конца работали одинаково: лучше всего оставить автосогласование на обоих, а если один конец настроен вручную — задать те же значения и на другом.
    - title: "Проверка сквозного подключения и документация"
      body: |
        **Шаг 1.** В приложении «Веб-браузер» каждого из компьютеров PC-01, PC-02, PC-A и PC-B откройте http://www.nsalab.local. На всех четырех открывается страница «www.nsalab.local».

        **Шаг 2.** В приложении «Командная строка» компьютера PC-01 проверьте связь с компьютером PC-B командой **ping 172.16.2.4** — проверку, которая не проходила на странице «Проверка компьютера PC-01». Компьютер PC-B отвечает (TTL=127).

        ```
        C:\>ping 172.16.2.4

        Pinging 172.16.2.4 with 32 bytes of data:

        Reply from 172.16.2.4: bytes=32 time=1ms TTL=127
        Reply from 172.16.2.4: bytes=32 time=1ms TTL=127
        Reply from 172.16.2.4: bytes=32 time=1ms TTL=127
        Reply from 172.16.2.4: bytes=32 time=1ms TTL=127

        Ping statistics for 172.16.2.4:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 3.** На компьютере PC-B выведите путь к компьютеру PC-01 командой **tracert 172.16.1.3**: пакеты проходят через интерфейс G0/1 маршрутизатора R1 (172.16.2.1) и достигают компьютера за два перехода.

        ```
        C:\>tracert 172.16.1.3

        Tracing route to 172.16.1.3 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  172.16.2.1
          2     1 ms     1 ms     1 ms  172.16.1.3

        Trace complete.
        ```

        **Шаг 4.** Сравните свою документацию проверок с таблицей. Проверки, которые прошли успешно с первого раза, в таблице не повторяются.

        | Проверка | Успешно? | Проблема | Решение | Проверено |
        |---|---|---|---|---|
        | PC-01 — Web | Нет | IPv4-адрес PC-01 172.16.11.3 вместо 172.16.1.3 | Изменить IPv4-адрес PC-01 | Да |
        | PC-02 — Web | Нет | Шлюз по умолчанию PC-02 172.16.1.254 вместо 172.16.1.1 | Изменить шлюз по умолчанию PC-02 | Да |
        | PC-A — шлюз 172.16.2.1 | Нет | Адрес интерфейса G0/1 маршрутизатора R1 172.16.2.10 вместо 172.16.2.1 | Назначить интерфейсу адрес 172.16.2.1 | Да |
        | PC-01 — Web при несогласовании дуплекса | Да, но медленно | Скорость и дуплекс порта G0/1 коммутатора S1 заданы вручную, порт G0/0 маршрутизатора R1 перешел на полудуплекс | Вернуть порту G0/1 автосогласование | Да |
