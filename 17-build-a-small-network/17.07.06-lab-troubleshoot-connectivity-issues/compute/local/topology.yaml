        | PC-B | NIC | 172.16.2.4 | 255.255.255.0 | 172.16.2.1 |
        | Web | NIC | 209.165.201.2 | 255.255.255.224 | 209.165.201.1 |
        | DNS1 | NIC | 209.165.201.3 | 255.255.255.224 | 209.165.201.1 |
