        С этими таблицами вы будете сравнивать настройки устройств.
    - title: "Начальное состояние"
      body: |
        - Маршрутизатор R1 соединяет локальные сети 172.16.1.0/24 (коммутатор S1, компьютеры PC-01 и PC-02) и 172.16.2.0/24 (коммутатор S2, компьютеры PC-A и PC-B) и подключен последовательным каналом к маршрутизатору R2 поставщика услуг Интернета. Консоли R1 и R2 со схемы не открываются. К маршрутизатору R1 можно подключиться по протоколу SSH с любого компьютера, у которого есть с ним связь: имя пользователя Admin01, пароль cisco12345. Маршрутизатор R2 вам недоступен.
        - В сети поставщика услуг работают веб-сервер Web (209.165.201.2, сайт www.nsalab.local) и два DNS-сервера, DNS1 и DNS2; второй добавлен при недавней модернизации. Серверы настроены, и доступа к ним у вас нет.
        - На компьютерах заданы IP-настройки и DNS-серверы по таблицам, но при модернизации в настройках компьютеров и маршрутизатора R1 могли быть допущены ошибки. Сколько их и где — вам предстоит выяснить.
        - Пользователи сообщают, что сайт www.nsalab.local не открывается.

        **Шаг 1.** После запуска лабораторной работы дождитесь, когда индикаторы всех соединений на схеме загорятся зеленым («Соединение активно» в условных обозначениях).

        **Шаг 2.** Откройте окно компьютера PC-01 и на вкладке «Рабочий стол» запустите приложение «Веб-браузер». Введите в поле «Адрес» http://www.nsalab.local и нажмите «Перейти». Вместо сайта браузер показывает «Страница не открылась» и код «имя не разрешено»: компьютер не смог превратить имя в IP-адрес.

        **Шаг 3.** Запустите приложение «Командная строка» и проверьте связь с веб-сервером по IP-адресу командой **ping 209.165.201.2**. Компьютер не отправляет эхо-запросы и выводит «PING: transmit failed. General failure».

        ```
        C:\>ping 209.165.201.2

        Pinging 209.165.201.2 with 32 bytes of data:

        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.

        Ping statistics for 209.165.201.2:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Примечание.** Сообщение «General failure» означает, что у компьютера нет пути к получателю: по собственным IP-адресу и маске подсети компьютер считает получателя узлом другой сети, а его шлюз по умолчанию не входит в его сеть, поэтому передать пакет некому. Проверку начинают с настроек самого компьютера.

        **Шаг 4.** Подготовьте документацию проверок: таблицу со столбцами «Проверка», «Успешно?», «Проблема», «Решение» и «Проверено» — на бумаге, в текстовом редакторе или в электронной таблице. В нее вы будете записывать каждую проверку связи, найденную проблему, выбранное решение и результат повторной проверки. Для каждой проблемы выбирают одно решение и сразу проверяют его.
    - title: "Проверка компьютера PC-01"
      body: |
        **Шаг 1.** В приложении «Командная строка» компьютера PC-01 выведите его IP-настройки командой **ipconfig** и сравните их с таблицей адресации. IPv4-адрес компьютера — 172.16.11.3, а по таблице должен быть 172.16.1.3: адрес не входит в сеть 172.16.1.0/24, в которой находится шлюз по умолчанию 172.16.1.1. Маска подсети и шлюз совпадают с таблицей. Запишите проверку, проблему и решение — изменить IPv4-адрес компьютера PC-01 по таблице.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:DBFF:FE16:2E01
           IPv6 Address....................: ::
           IPv4 Address....................: 172.16.11.3
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 172.16.1.1
        ```

        **Шаг 2.** Задайте компьютеру PC-01 IPv4-адрес, маску подсети и шлюз по умолчанию по таблице командой **ipconfig 172.16.1.3 255.255.255.0 172.16.1.1**. Команда ничего не выводит.

        ```
        C:\>ipconfig 172.16.1.3 255.255.255.0 172.16.1.1
        ```

        **Примечание.** Те же параметры можно задать в приложении «IP-конфигурация» на вкладке «Рабочий стол»: в полях «IPv4-адрес», «Маска» и «Шлюз по умолчанию». Значение поля сохраняется сразу, как только вы нажмете Enter или перейдете к другому полю.

        **Шаг 3.** Убедитесь, что DNS-сервер компьютера не изменился: команда **ipconfig /all** выводит полные настройки, в том числе строку «DNS Servers» — 209.165.201.3, сервер DNS1 по таблице.

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Physical Address................: 00-D0-DB-16-2E-01
           DHCP Enabled....................: No
           Link-local IPv6 Address.........: FE80::2D0:DBFF:FE16:2E01
           IPv6 Address....................: ::
           IPv4 Address....................: 172.16.1.3
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 172.16.1.1
           DHCP Servers....................: 0.0.0.0
           DNS Servers.....................: 209.165.201.3
        ```

        **Шаг 4.** Проверьте связь со шлюзом по умолчанию командой **ping 172.16.1.1**. Маршрутизатор R1 отвечает. Ответьте на вопрос 1 в форме ответов.

        ```
        C:\>ping 172.16.1.1

        Pinging 172.16.1.1 with 32 bytes of data:

        Reply from 172.16.1.1: bytes=32 time=1ms TTL=255
        Reply from 172.16.1.1: bytes=32 time<1ms TTL=255
        Reply from 172.16.1.1: bytes=32 time<1ms TTL=255
        Reply from 172.16.1.1: bytes=32 time<1ms TTL=255

        Ping statistics for 172.16.1.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 5.** Проверьте связь с веб-сервером командой **ping 209.165.201.2**. Сервер отвечает: пакеты проходят через маршрутизаторы R1 и R2 (TTL=126). Первый эхо-запрос может остаться без ответа: в это время устройства на пути определяют MAC-адреса друг друга по протоколу ARP. Ответьте на вопрос 2 в форме ответов.

        ```
        C:\>ping 209.165.201.2

        Pinging 209.165.201.2 with 32 bytes of data:

        Request timed out.
        Reply from 209.165.201.2: bytes=32 time=2ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=2ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=2ms TTL=126

        Ping statistics for 209.165.201.2:
            Packets: Sent = 4, Received = 3, Lost = 1 (25% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 6.** Проверьте связь с компьютером PC-02 своей локальной сети командой **ping 172.16.1.4**. Компьютер PC-02 отвечает. Ответьте на вопрос 3 в форме ответов.

        ```
        C:\>ping 172.16.1.4

        Pinging 172.16.1.4 with 32 bytes of data:

        Reply from 172.16.1.4: bytes=32 time=1ms TTL=128
        Reply from 172.16.1.4: bytes=32 time<1ms TTL=128
        Reply from 172.16.1.4: bytes=32 time<1ms TTL=128
        Reply from 172.16.1.4: bytes=32 time<1ms TTL=128

        Ping statistics for 172.16.1.4:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 7.** Проверьте связь с компьютером PC-A другой локальной сети командой **ping 172.16.2.3**. Ответов нет: «Request timed out». Ответьте на вопрос 4 в форме ответов.

        ```
        C:\>ping 172.16.2.3

        Pinging 172.16.2.3 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 172.16.2.3:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Примечание.** «Request timed out» означает, что компьютер отправил эхо-запрос шлюзу по умолчанию, но ответ не пришел за отведенное время. Настройки компьютера PC-01 верны, шлюз и сервер отвечают, поэтому проблема — не на этом компьютере: в другой локальной сети или на пути ответа. Запишите проверку; причину вы найдете при проверке компьютеров PC-A и PC-B.

        **Шаг 8.** Аналогично проверьте связь с компьютером PC-B командой **ping 172.16.2.4**: ответов тоже нет. Ответьте на вопрос 5 в форме ответов.

        **Шаг 9.** В приложении «Веб-браузер» откройте http://www.nsalab.local, а затем http://209.165.201.2. Оба раза открывается страница с заголовком «www.nsalab.local»: имя сервера разрешил DNS1, а путь к серверу работает. Ответьте на вопросы 6 и 7 в форме ответов. Отметьте решение в документации как проверенное.
    - title: "Проверка компьютера PC-02"
      body: |
        **Шаг 1.** Откройте окно компьютера PC-02 и в приложении «Командная строка» выведите его настройки командой **ipconfig**. IPv4-адрес и маска подсети совпадают с таблицей, а шлюз по умолчанию — 172.16.1.254 вместо 172.16.1.1. Запишите проверку, проблему и решение — изменить шлюз по умолчанию компьютера PC-02 по таблице.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:10FF:FEE8:E301
           IPv6 Address....................: ::
           IPv4 Address....................: 172.16.1.4
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 172.16.1.254
        ```

        **Шаг 2.** Прежде чем исправлять, посмотрите, как проявляется эта ошибка: проверьте связь с веб-сервером командой **ping 209.165.201.2**. Ответ «Destination host unreachable» приходит от самого компьютера PC-02 (172.16.1.4).

        ```
        C:\>ping 209.165.201.2

        Pinging 209.165.201.2 with 32 bytes of data:

        Reply from 172.16.1.4: Destination host unreachable.
        Reply from 172.16.1.4: Destination host unreachable.
        Reply from 172.16.1.4: Destination host unreachable.
        Reply from 172.16.1.4: Destination host unreachable.

        Ping statistics for 209.165.201.2:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Примечание.** Пакет в другую сеть компьютер передает шлюзу по умолчанию, а его MAC-адрес ищет по протоколу ARP. Адрес 172.16.1.254 в локальной сети никому не назначен, ответа на запрос ARP нет, и компьютер сам сообщает, что узел недоступен. Узлы своей сети компьютер при этом достигает без шлюза.

        **Шаг 3.** Задайте компьютеру PC-02 параметры по таблице командой **ipconfig 172.16.1.4 255.255.255.0 172.16.1.1** или в приложении «IP-конфигурация», в поле «Шлюз по умолчанию». Команда ничего не выводит.

        ```
        C:\>ipconfig 172.16.1.4 255.255.255.0 172.16.1.1
        ```

        **Шаг 4.** Проверьте связь со шлюзом по умолчанию командой **ping 172.16.1.1**. Маршрутизатор R1 отвечает. Ответьте на вопрос 8 в форме ответов.

        ```
        C:\>ping 172.16.1.1

        Pinging 172.16.1.1 with 32 bytes of data:

        Reply from 172.16.1.1: bytes=32 time=1ms TTL=255
        Reply from 172.16.1.1: bytes=32 time<1ms TTL=255
        Reply from 172.16.1.1: bytes=32 time<1ms TTL=255
        Reply from 172.16.1.1: bytes=32 time<1ms TTL=255

        Ping statistics for 172.16.1.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 5.** Повторите проверку связи с веб-сервером командой **ping 209.165.201.2**. Сервер отвечает: проблема устранена. Отметьте решение в документации как проверенное. Ответьте на вопрос 9 в форме ответов.

        ```
        C:\>ping 209.165.201.2

        Pinging 209.165.201.2 with 32 bytes of data:

        Reply from 209.165.201.2: bytes=32 time=2ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=2ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=2ms TTL=126
        Reply from 209.165.201.2: bytes=32 time=2ms TTL=126

        Ping statistics for 209.165.201.2:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 2ms, Maximum = 2ms, Average = 2ms
        ```

        **Шаг 6.** Проверьте связь с компьютером PC-01 командой **ping 172.16.1.3**. Компьютер PC-01 отвечает. Ответьте на вопрос 10 в форме ответов.

        ```
        C:\>ping 172.16.1.3

        Pinging 172.16.1.3 with 32 bytes of data:

        Reply from 172.16.1.3: bytes=32 time<1ms TTL=128
        Reply from 172.16.1.3: bytes=32 time<1ms TTL=128
        Reply from 172.16.1.3: bytes=32 time<1ms TTL=128
        Reply from 172.16.1.3: bytes=32 time<1ms TTL=128

        Ping statistics for 172.16.1.3:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 0ms, Average = 0ms
        ```

        **Шаг 7.** Проверьте связь с компьютером PC-A командой **ping 172.16.2.3**. Ответов нет, как и с компьютера PC-01. Аналогично проверьте связь с компьютером PC-B командой **ping 172.16.2.4**: ответов нет. Ответьте на вопросы 11 и 12 в форме ответов.

        ```
        C:\>ping 172.16.2.3

        Pinging 172.16.2.3 with 32 bytes of data:

        Request timed out.
        Request timed out.
        Request timed out.
        Request timed out.

        Ping statistics for 172.16.2.3:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 8.** Выведите путь к веб-серверу командой **tracert 209.165.201.2**. Пакеты проходят через маршрутизатор R1 (172.16.1.1) и маршрутизатор R2 (209.165.200.225) и достигают сервера за три перехода.

        ```
        C:\>tracert 209.165.201.2

        Tracing route to 209.165.201.2 over a maximum of 30 hops:

          1    <1 ms    <1 ms    <1 ms  172.16.1.1
          2     1 ms     1 ms     1 ms  209.165.200.225
          3     2 ms     2 ms     2 ms  209.165.201.2

