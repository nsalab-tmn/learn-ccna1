        **Шаг 8.** Посмотрите на канал со стороны маршрутизатора R1. В приложении «Командная строка» компьютера PC-02 подключитесь к нему командой **ssh -l Admin01 172.16.1.1** с паролем cisco12345 и выведите сведения о порте командой **show interfaces g0/0**. Строка «Half Duplex, 100Mbps» показывает полудуплексный режим, а счетчики collisions и late collision уже не нулевые: в полудуплексном режиме маршрутизатор считает каждую коллизию, а позднюю коллизию — ту, что случилась уже после начала передачи кадра, — отдельно. Вывод длиннее экрана: когда в конце страницы появится --More--, нажимайте пробел, пока не появится приглашение R1#. Затем завершите сеанс командой **exit**.

        ```
        C:\>ssh -l Admin01 172.16.1.1
        Password:
