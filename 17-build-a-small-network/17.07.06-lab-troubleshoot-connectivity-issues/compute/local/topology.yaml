        ```

        **Шаг 4.** Проверьте связь с компьютером PC-01 командой **ping 172.16.1.3** и аналогично с компьютером PC-02 командой **ping 172.16.1.4**. Узлы другой локальной сети недоступны по той же причине. Ответьте на вопросы 17 и 18 в форме ответов.

        ```
        C:\>ping 172.16.1.3

        Pinging 172.16.1.3 with 32 bytes of data:

        Reply from 172.16.2.3: Destination host unreachable.
        Reply from 172.16.2.3: Destination host unreachable.
        Reply from 172.16.2.3: Destination host unreachable.
        Reply from 172.16.2.3: Destination host unreachable.

        Ping statistics for 172.16.1.3:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 5.** Проверьте связь с компьютером PC-B своей локальной сети командой **ping 172.16.2.4**. Компьютер PC-B отвечает: локальная сеть 172.16.2.0/24 и коммутатор S2 работают. Ответьте на вопрос 19 в форме ответов.

        ```
        C:\>ping 172.16.2.4

        Pinging 172.16.2.4 with 32 bytes of data:

        Reply from 172.16.2.4: bytes=32 time=1ms TTL=128
        Reply from 172.16.2.4: bytes=32 time<1ms TTL=128
        Reply from 172.16.2.4: bytes=32 time<1ms TTL=128
        Reply from 172.16.2.4: bytes=32 time<1ms TTL=128

        Ping statistics for 172.16.2.4:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 6.** В приложении «Веб-браузер» откройте http://www.nsalab.local: «Страница не открылась», код «имя не разрешено» — DNS-сервер компьютера PC-A (DNS2, 209.165.201.4) находится за шлюзом, и запрос к нему не уходит. Затем откройте http://209.165.201.2: «Страница не открылась», код «время ожидания истекло». Ответьте на вопросы 20 и 21 в форме ответов. Запишите проверки и проблему — шлюз по умолчанию 172.16.2.1 не отвечает — и решение: проверить настройку интерфейса G0/1 маршрутизатора R1.

        **Шаг 7.** Консоль маршрутизатора R1 со схемы не открывается, но к нему можно подключиться по протоколу SSH из сети 172.16.1.0/24, с которой у маршрутизатора связь есть. В приложении «Командная строка» компьютера PC-01 выполните команду **ssh -l Admin01 172.16.1.1** и на запрос «Password:» введите пароль cisco12345 (он не отображается). Маршрутизатор сразу открывает привилегированный режим EXEC (приглашение R1#): учетной записи Admin01 назначен уровень привилегий 15. Выведите сводку интерфейсов командой **show ip interface brief**. У интерфейса GigabitEthernet0/1 адрес 172.16.2.10, а по таблице должен быть 172.16.2.1. Запишите проблему и решение — назначить интерфейсу адрес по таблице.

        ```
        C:\>ssh -l Admin01 172.16.1.1
        Password:
        R1#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         172.16.1.1      YES manual up                    up
        GigabitEthernet0/1         172.16.2.10     YES manual up                    up
        Serial0/0/0                209.165.200.226 YES manual up                    up
        Serial0/0/1                unassigned      YES unset  administratively down down
        ```

        **Шаг 8.** Перейдите в режим глобальной конфигурации командой **configure terminal**, затем к интерфейсу командой **interface g0/1**, назначьте адрес командой **ip address 172.16.2.1 255.255.255.0** и вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#interface g0/1
        R1(config-if)#ip address 172.16.2.1 255.255.255.0
        R1(config-if)#end
        ```

        **Примечание.** Сообщения журнала, например о примененной конфигурации (%SYS-5-CONFIG_I), маршрутизатор выводит в консоль, а не в сеанс SSH, поэтому здесь их нет.

        **Шаг 9.** Снова выведите сводку командой **show ip interface brief** и убедитесь, что у GigabitEthernet0/1 адрес 172.16.2.1. Завершите сеанс SSH командой **exit**: командная строка компьютера PC-01 сообщает, что соединение закрыто.

        ```
        R1#show ip interface brief
        Interface                  IP-Address      OK? Method Status                Protocol
        GigabitEthernet0/0         172.16.1.1      YES manual up                    up
        GigabitEthernet0/1         172.16.2.1      YES manual up                    up
        Serial0/0/0                209.165.200.226 YES manual up                    up
        Serial0/0/1                unassigned      YES unset  administratively down down
        R1#exit


        [Connection to 172.16.1.1 closed by foreign host]
        ```

        **Шаг 10.** Вернитесь в приложение «Командная строка» компьютера PC-A и повторите проверку связи со шлюзом по умолчанию командой **ping 172.16.2.1**. Маршрутизатор R1 отвечает: проблема устранена.

        ```
        C:\>ping 172.16.2.1

        Pinging 172.16.2.1 with 32 bytes of data:

        Reply from 172.16.2.1: bytes=32 time=1ms TTL=255
        Reply from 172.16.2.1: bytes=32 time<1ms TTL=255
        Reply from 172.16.2.1: bytes=32 time<1ms TTL=255
        Reply from 172.16.2.1: bytes=32 time<1ms TTL=255

        Ping statistics for 172.16.2.1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 11.** Повторите проверку связи с веб-сервером командой **ping 209.165.201.2**. Сервер отвечает (TTL=126).

        ```
        C:\>ping 209.165.201.2

