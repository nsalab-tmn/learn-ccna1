        **Шаг 9.** В консоли коммутатора S1 верните порту автосогласование: перейдите в режим глобальной конфигурации командой **configure terminal**, затем к порту командой **interface g0/1**, выполните команды **duplex auto** и **speed auto** и вернитесь в привилегированный режим EXEC командой **end**. Канал дважды опускается и поднимается, а сообщения о несогласовании больше нет.

        ```
        Switch#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        Switch(config)#interface g0/1
        Switch(config-if)#duplex auto
        *Mar  1 00:19:20.422: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to down
        *Mar  1 00:19:20.422: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to down
        *Mar  1 00:19:21.422: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        *Mar  1 00:19:22.422: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        Switch(config-if)#speed auto
        *Mar  1 00:19:25.422: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to down
        *Mar  1 00:19:25.422: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to down
        *Mar  1 00:19:26.422: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        *Mar  1 00:19:27.422: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        Switch(config-if)#end
