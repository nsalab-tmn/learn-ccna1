        ```

        **Примечание.** Трассировка показывает, на каком устройстве пути пропадают пакеты: последняя отвечающая строка — последний узел, который их получил. Если трассировка не доходит до получателя, ее можно прервать сочетанием клавиш Ctrl+C.

        **Шаг 9.** В приложении «Веб-браузер» откройте http://www.nsalab.local, а затем http://209.165.201.2. Оба раза открывается страница «www.nsalab.local». Ответьте на вопросы 13 и 14 в форме ответов.
    - title: "Проверка компьютера PC-A и маршрутизатора R1"
      body: |
        **Шаг 1.** Откройте окно компьютера PC-A и в приложении «Командная строка» выведите его настройки командой **ipconfig**. IPv4-адрес 172.16.2.3, маска 255.255.255.0 и шлюз по умолчанию 172.16.2.1 совпадают с таблицей: на этом компьютере ошибок нет.

        ```
        C:\>ipconfig

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..:
           Link-local IPv6 Address.........: FE80::2D0:D1FF:FE20:9701
           IPv6 Address....................: ::
           IPv4 Address....................: 172.16.2.3
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 172.16.2.1
        ```

        **Шаг 2.** Проверьте связь со шлюзом по умолчанию командой **ping 172.16.2.1**. Ответ «Destination host unreachable» приходит от самого компьютера PC-A: в локальной сети 172.16.2.0/24 никто не ответил на запрос ARP об адресе 172.16.2.1. По таблице этот адрес принадлежит интерфейсу G0/1 маршрутизатора R1. Ответьте на вопрос 15 в форме ответов.

        ```
        C:\>ping 172.16.2.1

        Pinging 172.16.2.1 with 32 bytes of data:

        Reply from 172.16.2.3: Destination host unreachable.
        Reply from 172.16.2.3: Destination host unreachable.
