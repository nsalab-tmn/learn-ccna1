scenario:
  pages:
    - title: "Топология и адресация"
      body: |
        | Кабель | Устройство | Порт | Устройство | Порт |
        |---|---|---|---|---|
        | Медный | Web-Server | F0 | Web-Client | F0 |

        | Устройство | Интерфейс | IP-адрес | Маска подсети | Шлюз по умолчанию | DNS-сервер |
        |---|---|---|---|---|---|
        | Web-Server | NIC | 192.168.1.1 | 255.255.255.0 | — | — |
        | Web-Client | NIC | 192.168.1.10 | 255.255.255.0 | 192.168.1.1 | 192.168.1.1 |
    - title: "Начальное состояние"
      body: |
        - На сервере Web-Server задан IP-адрес по таблице адресации. На нем работают служба DNS с записью www.osi.local → 192.168.1.1 и веб-сервер со страницей «Модели TCP/IP и OSI в действии».
        - На компьютере Web-Client заданы IP-адрес, маска подсети, шлюз по умолчанию и DNS-сервер по таблице адресации.
        - Устройства еще не обменивались данными.

        **Шаг 1.** Откройте окно компьютера Web-Client и на вкладке «Рабочий стол» запустите приложение «Командная строка». Выведите сетевые настройки компьютера командой **ipconfig /all**. Сервер Web-Server (192.168.1.1) служит компьютеру шлюзом по умолчанию и DNS-сервером (строка «DNS Servers»).

        ```
        C:\>ipconfig /all

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Physical Address................: 00-D0-CA-82-CB-01
           DHCP Enabled....................: No
           Link-local IPv6 Address.........: FE80::2D0:CAFF:FE82:CB01
           IPv6 Address....................: ::
           IPv4 Address....................: 192.168.1.10
           Subnet Mask.....................: 255.255.255.0
           Default Gateway.................: 192.168.1.1
           DHCP Servers....................: 0.0.0.0
           DNS Servers.....................: 192.168.1.1
        ```

        **Шаг 2.** Выведите ARP-таблицу компьютера командой **arp -a**. Записей нет: компьютер еще не обменивался кадрами с сервером и не знает его MAC-адрес.

        ```
        C:\>arp -a
        No ARP Entries Found
        ```

        **Примечание.** Не выполняйте пока команды ping и nslookup: они создадут трафик, и компьютер заранее узнает MAC-адрес сервера. Тогда в режиме «Симуляция» вы не увидите событий ARP.
    - title: "Генерация трафика HTTP"
      body: |
        **Шаг 1.** Нажмите «Симуляция» вверху страницы. Под схемой откроется панель «Симуляция» со списком событий. Время в сети остановится: каждое следующее событие выполняется по кнопке «Шаг». В режиме «Лаборатория» сеть, наоборот, работает в реальном времени.

        **Шаг 2.** На панели «Симуляция» нажмите «Фильтры». В окне «Фильтры событий» отмечены протоколы, события которых показываются в списке. По умолчанию это ARP и ICMP, поэтому кнопка называется «Фильтры · ARP, ICMP».

        **Шаг 3.** Нажмите «Все», а затем «Ничего» и посмотрите, как меняются отметки протоколов и название кнопки: «Фильтры · все», «Фильтры · ничего».

        **Шаг 4.** Отметьте HTTP и закройте окно «Фильтры событий». Кнопка теперь называется «Фильтры · HTTP»: в списке будут только события HTTP.

        **Примечание.** Фильтр скрывает события других протоколов только в списке и на схеме. В сети эти события все равно происходят, и кнопка «Шаг» выполняет их тоже.

        **Шаг 5.** Откройте окно компьютера Web-Client и на вкладке «Рабочий стол» запустите приложение «Веб-браузер». Введите в адресной строке **www.osi.local** и нажмите «Перейти». Список событий пока пуст («Все события скрыты фильтрами — они по-прежнему идут по сети.»), а справа на панели указано «Время сим. 0.000 с · событий 2 · показано 0»: события уже есть, но фильтр их скрывает.

        **Шаг 6.** Нажимайте «Шаг», пока в списке не появятся два события HTTP: на это нужно девять нажатий, потому что сначала выполняются скрытые события других протоколов. Вместо этого можно нажать «Пуск» (кнопка станет «Пауза»): события будут выполняться одно за другим без вашего участия.

        **Шаг 7.** Рассмотрите оба события HTTP. В первом из них, «HTTP GET / → 192.168.1.1:80», в столбце «Откуда» указан Web-Client, а в столбце «Где» — Web-Server: это запрос страницы, который получил сервер. Во втором, «HTTP 200 → 192.168.1.10:49153», — наоборот: это ответ сервера, который получил компьютер. В окне браузера открылась страница «Модели TCP/IP и OSI в действии».

        **Примечание.** Браузер ждет страницу около 30 секунд. Если нажимать «Шаг» медленнее, браузер покажет «× Страница не открылась» с кодом «время ожидания истекло», но события в списке все равно пройдут до конца. В режиме «Лаборатория» на последней странице вы откроете страницу еще раз.
    - title: "Изучение PDU запроса и ответа HTTP"
      body: |
        **Шаг 1.** Щелкните цветной квадрат в столбце «Тип» первого события HTTP. Откроется окно PDU с заголовком «HTTP · на Web-Server · 0.007 с»: это запрос, принятый сервером. У окна две вкладки, «Модель OSI» и «Входящий PDU». Вкладки «Исходящий PDU» нет: сервер принимает этот PDU и никуда его не пересылает.

        **Шаг 2.** На вкладке «Модель OSI» рассмотрите столбец «Вход ↑ (читать снизу вверх)»: на принимающем устройстве данные поднимаются от уровня L1 к уровню L7. Столбец «Выход ↓ (сверху вниз)» пуст. Под столбцами находится пронумерованный список шагов, а кнопки «Предыдущий уровень» и «Следующий уровень» выделяют эти шаги по очереди.

        **Шаг 3.** Ответьте на вопросы 1–4 в форме ответов.

        **Шаг 4.** Откройте вкладку «Входящий PDU». На ней показаны заголовки PDU по уровням модели TCP/IP: Ethernet II, IPv4, TCP и HTTP, поле за полем. Сведения здесь подробнее, чем на вкладке «Модель OSI»: например, раздел Ethernet II содержит поля «MAC назначения» и «MAC источника» и тип протокола, вложенного в кадр.

        **Шаг 5.** Ответьте на вопросы 5–7 в форме ответов.

        **Шаг 6.** Щелкните цветной квадрат второго события HTTP. Заголовок окна PDU станет «HTTP · на Web-Client · 0.008 с»: это ответ сервера, принятый компьютером. На вкладке «Модель OSI» сравните столбец «Вход ↑» с тем же столбцом первого события HTTP.

        **Шаг 7.** Ответьте на вопрос 8 в форме ответов.

        **Шаг 8.** Откройте вкладку «Входящий PDU» и просмотрите заголовки ответа. У этого события тоже только две вкладки, «Модель OSI» и «Входящий PDU»: компьютер Web-Client принимает ответ и дальше его не пересылает.
    - title: "Изучение событий ARP, DNS и TCP"
      body: |
        **Шаг 1.** Закройте окно PDU кнопкой × («Закрыть PDU»). Нажмите «Фильтры», в окне «Фильтры событий» нажмите «Все» и закройте окно. Теперь в списке показаны все события, которые уже произошли.

        **Шаг 2.** Нажимайте «Шаг», пока кнопка «Шаг» не станет недоступной («Нет событий в очереди»). В списке тринадцать событий протоколов ARP, DNS, TCP и HTTP.

        **Шаг 3.** Ответьте на вопрос 9 в форме ответов.

        **Примечание.** Каждый из этих протоколов делает свою часть работы. Протокол ARP по IP-адресу узла узнает его MAC-адрес. Протокол DNS преобразует имя, например www.osi.local, в IP-адрес. Протокол TCP управляет соединением между приложениями: устанавливает его перед запросом HTTP и завершает после ответа.

        **Шаг 4.** Щелкните цветной квадрат первого события DNS, «DNS-запрос www.osi.local · ждёт ответа ARP» на компьютере Web-Client. У окна PDU вкладки «Модель OSI» и «Исходящий PDU»: этот PDU компьютер создал сам. В столбце «Выход ↓» заполнен только уровень L3, а в пронумерованном списке сказано, что компьютер готовит запрос DNS к 192.168.1.1, но MAC-адрес следующего перехода еще не известен: сначала нужен ARP-запрос.

        **Шаг 5.** Откройте вкладку «Исходящий PDU».

        **Шаг 6.** Ответьте на вопрос 10 в форме ответов.

        **Шаг 7.** Щелкните цветной квадрат последнего события DNS, «DNS-ответ www.osi.local», и откройте вкладку «Входящий PDU».

        **Шаг 8.** Ответьте на вопросы 11 и 12 в форме ответов.

        **Шаг 9.** Найдите в списке первое событие HTTP и щелкните цветной квадрат события TCP прямо перед ним: это третье событие TCP. Рассмотрите уровень L4 на вкладке «Модель OSI» и пронумерованный список под столбцами.

        **Шаг 10.** Ответьте на вопрос 13 в форме ответов.

        **Примечание.** Перед обменом данными TCP устанавливает соединение в три этапа: клиент отправляет сегмент с флагом SYN, сервер отвечает сегментом с флагами SYN и ACK, а клиент подтверждает его сегментом с флагом ACK. Только после этого по соединению передается запрос HTTP.

        **Шаг 11.** Щелкните по очереди цветные квадраты двух последних событий TCP и у каждого рассмотрите уровень L4 и последний пункт пронумерованного списка.

        **Шаг 12.** Ответьте на вопрос 14 в форме ответов.
    - title: "Проверка результатов"
      body: |
        **Шаг 1.** Нажмите «Лаборатория» вверху страницы: панель «Симуляция» закроется, и время в сети снова пойдет.

        **Шаг 2.** В приложении «Веб-браузер» компьютера Web-Client снова нажмите «Перейти». Страница «Модели TCP/IP и OSI в действии» открывается сразу: в реальном времени весь обмен занимает доли секунды.

        **Шаг 3.** В приложении «Командная строка» компьютера Web-Client выведите ARP-таблицу командой **arp -a**. Теперь в ней есть запись о сервере 192.168.1.1 с его MAC-адресом 00d0.9757.6501: этот адрес компьютер узнал по протоколу ARP.

        ```
        C:\>arp -a
          Internet Address      Physical Address      Type
          192.168.1.1           00d0.9757.6501        dynamic
        ```

        **Шаг 4.** Проверьте преобразование имени командой **nslookup www.osi.local**. DNS-сервер 192.168.1.1 сопоставляет имени www.osi.local адрес 192.168.1.1, как в поле «Ответы» последнего события DNS.

        ```
        C:\>nslookup www.osi.local
        Server:  UnKnown
        Address:  192.168.1.1

        Name:    www.osi.local
        Address:  192.168.1.1
        ```

        **Примечание.** Служба сервера принимает запросы на определенном порту. Клиент указывает этот порт как порт назначения в заголовке транспортного уровня: в разделе TCP запроса HTTP и в разделе UDP запроса DNS на вкладках «Входящий PDU» и «Исходящий PDU».

        **Шаг 5.** Ответьте на вопросы 15 и 16 в форме ответов.
