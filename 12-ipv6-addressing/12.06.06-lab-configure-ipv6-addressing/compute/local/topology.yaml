    - title: "Начальное состояние"
      body: |
        - На маршрутизаторе провайдера ISP включена маршрутизация IPv6, интерфейсу S0/0/0 назначены адреса 2001:db8:1:a001::1/64 и fe80::1, и настроен статический маршрут к сетям компании 2001:db8:1::/48 через маршрутизатор R1.
        - На маршрутизаторе R1 задано только имя устройства: его интерфейсы выключены, и IPv6-адресов на них нет.
        - На коммутаторах S1 и S2 все параметры имеют значения по умолчанию, в том числе имя устройства, поэтому в их консолях приглашение Switch>. Настраивать коммутаторы в этой лабораторной работе не нужно.
        - На серверах Accounting и CAD работает веб-сервер. IPv6-адреса на серверах, компьютерах и ноутбуках не заданы.

        **Шаг 1.** Откройте окно компьютера Sales и на вкладке «Рабочий стол» запустите приложение «Командная строка». Выведите параметры IPv6 командой **ipv6config**. У компьютера есть только локальный адрес канала (строка «Link-local IPv6 Address»); глобального адреса (строка «IPv6 Address») и шлюза по умолчанию (строка «Default Gateway») нет.

        ```
        C:\>ipv6config

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:89FF:FEFD:F701
           IPv6 Address....................: ::
           Default Gateway.................: ::
        ```

        **Примечание.** Локальный адрес канала узел создает сам: к префиксу FE80::/64 он добавляет идентификатор интерфейса, полученный из MAC-адреса по методу EUI-64, поэтому в середине идентификатора стоят байты FF:FE. Глобальный адрес и шлюз по умолчанию так не появляются: в этой лабораторной работе их задают вручную.

        **Шаг 2.** Проверьте связь с маршрутизатором провайдера командой **ping 2001:db8:1:a001::1**. Эхо-запросы не выполняются (сообщение «General failure»): у компьютера нет ни глобального адреса, ни шлюза по умолчанию.

        ```
        C:\>ping 2001:db8:1:a001::1

        Pinging 2001:DB8:1:A001::1 with 32 bytes of data:

        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.

        Ping statistics for 2001:DB8:1:A001::1:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        **Шаг 3.** Откройте консоль маршрутизатора R1 и нажмите Enter. Перейдите в привилегированный режим EXEC командой **enable**.

        **Шаг 4.** Выведите IPv6-адреса интерфейсов командой **show ipv6 interface brief**. Все интерфейсы выключены (administratively down), и IPv6-адресов на них нет (unassigned).

        ```
        R1>enable
        R1#show ipv6 interface brief
        GigabitEthernet0/0     [administratively down/down]
            unassigned
        GigabitEthernet0/1     [administratively down/down]
            unassigned
        Serial0/0/0            [administratively down/down]
            unassigned
        Serial0/0/1            [administratively down/down]
            unassigned
        ```
    - title: "Настройка IPv6-адресации на маршрутизаторе R1"
      body: |
        **Шаг 1.** На маршрутизаторе R1 перейдите в режим глобальной конфигурации командой **configure terminal** и включите маршрутизацию IPv6 командой **ipv6 unicast-routing**. Без нее маршрутизатор не пересылает IPv6-пакеты между своими сетями.

        **Шаг 2.** Перейдите к настройке интерфейса G0/0 командой **interface g0/0** и назначьте ему глобальный индивидуальный адрес командой **ipv6 address 2001:db8:1:1::1/64**.

        **Шаг 3.** Назначьте интерфейсу локальный адрес канала fe80::1 командой **ipv6 address fe80::1 link-local** и включите интерфейс командой **no shutdown**. Консоль сообщает, что интерфейс перешел в состояние up.

        ```
        R1#configure terminal
        Enter configuration commands, one per line.  End with CNTL/Z.
        R1(config)#ipv6 unicast-routing
        R1(config)#interface g0/0
        R1(config-if)#ipv6 address 2001:db8:1:1::1/64
        R1(config-if)#ipv6 address fe80::1 link-local
        R1(config-if)#no shutdown
        R1(config-if)#
        *Mar  1 00:01:22.864: %LINK-3-UPDOWN: Interface GigabitEthernet0/0, changed state to up
        R1(config-if)#
        *Mar  1 00:01:23.864: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/0, changed state to up
        ```

        **Примечание.** Индикатор на конце кабеля у коммутатора S1 сначала горит оранжевым: порт коммутатора, к которому подключен маршрутизатор, еще не пересылает кадры, пока протокол STP проверяет, нет ли в сети петли. Примерно через 30 секунд индикатор становится зеленым.

        **Шаг 4.** Аналогично настройте интерфейсы G0/1 (адрес 2001:db8:1:2::1/64) и S0/0/0 (адрес 2001:db8:1:a001::2/64): на каждом задайте тот же локальный адрес канала fe80::1 и включите интерфейс командой **no shutdown**. Вернитесь в привилегированный режим EXEC командой **end**.

        ```
        R1(config-if)#interface g0/1
        R1(config-if)#ipv6 address 2001:db8:1:2::1/64
        R1(config-if)#ipv6 address fe80::1 link-local
        R1(config-if)#no shutdown
        R1(config-if)#
        *Mar  1 00:01:40.228: %LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to up
        R1(config-if)#
        *Mar  1 00:01:41.228: %LINEPROTO-5-UPDOWN: Line protocol on Interface GigabitEthernet0/1, changed state to up
        R1(config-if)#interface s0/0/0
        R1(config-if)#ipv6 address 2001:db8:1:a001::2/64
        R1(config-if)#ipv6 address fe80::1 link-local
        R1(config-if)#no shutdown
        R1(config-if)#
        *Mar  1 00:01:58.596: %LINK-3-UPDOWN: Interface Serial0/0/0, changed state to up
        R1(config-if)#
        *Mar  1 00:01:59.596: %LINEPROTO-5-UPDOWN: Line protocol on Interface Serial0/0/0, changed state to up
        R1(config-if)#end
        *Mar  1 00:02:03.619: %SYS-5-CONFIG_I: Configured from console by console
        ```

        **Примечание.** Локальный адрес канала должен быть уникальным только в своем канале, поэтому один и тот же адрес fe80::1 можно назначить всем интерфейсам маршрутизатора. Короткий узнаваемый адрес удобен как шлюз по умолчанию: узлы обеих локальных сетей указывают один и тот же шлюз fe80::1.

        **Шаг 5.** Убедитесь с помощью команды **show ipv6 interface brief**, что интерфейсы G0/0, G0/1 и S0/0/0 включены (up/up) и у каждого есть локальный адрес канала FE80::1 и глобальный адрес из таблицы адресации.

        ```
        R1#show ipv6 interface brief
        GigabitEthernet0/0     [up/up]
            FE80::1
            2001:DB8:1:1::1
        GigabitEthernet0/1     [up/up]
            FE80::1
            2001:DB8:1:2::1
        Serial0/0/0            [up/up]
            FE80::1
            2001:DB8:1:A001::2
        Serial0/0/1            [administratively down/down]
            unassigned
        ```

        **Примечание.** Неверный IPv6-адрес удаляют командой **no ipv6 address** с этим адресом: новая команда **ipv6 address** не заменяет прежний глобальный адрес, а добавляет к интерфейсу еще один.

        **Шаг 6.** Сохраните конфигурацию командой **copy running-config startup-config** и подтвердите имя файла клавишей Enter.

        ```
        R1#copy running-config startup-config
        Destination filename [startup-config]? 
        Building configuration...
        [OK]
        ```
    - title: "Настройка IPv6-адресов серверов"
      body: |
        **Шаг 1.** Откройте окно сервера Accounting и на вкладке «Рабочий стол» запустите приложение «Командная строка». Задайте глобальный адрес 2001:db8:1:1::4 с длиной префикса /64 и шлюз по умолчанию fe80::1 командой **ipv6config 2001:db8:1:1::4/64 fe80::1**.

        **Шаг 2.** Убедитесь с помощью команды **ipv6config**, что адрес и шлюз заданы: строки «IPv6 Address» и «Default Gateway».

        ```
        C:\>ipv6config 2001:db8:1:1::4/64 fe80::1
        C:\>ipv6config

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:DCFF:FE99:D401
           IPv6 Address....................: 2001:DB8:1:1::4/64
           Default Gateway.................: FE80::1
        ```

        **Примечание.** Шлюз по умолчанию узла IPv6 — локальный адрес канала маршрутизатора в его сети. Этот адрес всегда доступен в канале и не меняется, даже если глобальные адреса сети изменят.

        **Шаг 3.** Аналогично задайте на сервере CAD адрес 2001:db8:1:2::4/64 и шлюз fe80::1 командой **ipv6config 2001:db8:1:2::4/64 fe80::1** и проверьте результат командой **ipv6config**.

        ```
        C:\>ipv6config 2001:db8:1:2::4/64 fe80::1
        C:\>ipv6config

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:9CFF:FE04:AD01
           IPv6 Address....................: 2001:DB8:1:2::4/64
           Default Gateway.................: FE80::1
        ```
    - title: "Настройка IPv6-адресов клиентских узлов"
      body: |
        **Шаг 1.** Откройте окно ноутбука Billing и в приложении «Командная строка» задайте адрес и шлюз командой **ipv6config 2001:db8:1:1::3/64 fe80::1**. Проверьте результат командой **ipv6config**.

        ```
        C:\>ipv6config 2001:db8:1:1::3/64 fe80::1
        C:\>ipv6config

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:DFF:FE98:FB01
           IPv6 Address....................: 2001:DB8:1:1::3/64
           Default Gateway.................: FE80::1
        ```

        **Шаг 2.** В приложении «Командная строка» компьютера Sales задайте адрес и шлюз командой **ipv6config 2001:db8:1:1::2/64 fe80::1** и проверьте результат командой **ipv6config**.

        ```
        C:\>ipv6config 2001:db8:1:1::2/64 fe80::1
        C:\>ipv6config

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:89FF:FEFD:F701
           IPv6 Address....................: 2001:DB8:1:1::2/64
           Default Gateway.................: FE80::1
        ```

        **Шаг 3.** Аналогично задайте адреса узлам сети коммутатора S2 с тем же шлюзом fe80::1: ноутбуку Engineering — командой **ipv6config 2001:db8:1:2::3/64 fe80::1**, компьютеру Design — командой **ipv6config 2001:db8:1:2::2/64 fe80::1**. Проверьте результат на каждом узле командой **ipv6config**.
    - title: "Проверка доступа к серверам и связи"
      body: |
        **Шаг 1.** Убедитесь, что индикаторы на обоих концах кабелей между маршрутизатором R1 и коммутаторами S1 и S2 горят зеленым («Соединение активно» в условных обозначениях).

        **Шаг 2.** Откройте окно компьютера Sales и на вкладке «Рабочий стол» запустите приложение «Веб-браузер». Введите в адресной строке **2001:db8:1:1::4** и нажмите «Перейти». Открывается веб-страница сервера Accounting с заголовком «Accounting» и текстом «Сайт бухгалтерии: сервер Accounting в сети G0/0.».

        **Шаг 3.** Аналогично откройте страницу **2001:db8:1:2::4**. Открывается страница сервера CAD из другой локальной сети с заголовком «CAD» и текстом «Сайт конструкторского отдела: сервер CAD в сети G0/1.»: маршрутизатор R1 пересылает пакеты между сетями 2001:db8:1:1::/64 и 2001:db8:1:2::/64.

        **Шаг 4.** В приложении «Командная строка» компьютера Sales проверьте связь с маршрутизатором провайдера командой **ping 2001:db8:1:a001::1**. Эхо-запросы выполняются.

        ```
        C:\>ping 2001:db8:1:a001::1

        Pinging 2001:DB8:1:A001::1 with 32 bytes of data:

        Reply from 2001:DB8:1:A001::1: bytes=32 time=1ms TTL=63
        Reply from 2001:DB8:1:A001::1: bytes=32 time=1ms TTL=63
        Reply from 2001:DB8:1:A001::1: bytes=32 time=1ms TTL=63
        Reply from 2001:DB8:1:A001::1: bytes=32 time=1ms TTL=63

        Ping statistics for 2001:DB8:1:A001::1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 1ms, Average = 1ms
        ```

        **Шаг 5.** Откройте окно компьютера Design и в приложении «Командная строка» проверьте связь с провайдером командой **ping 2001:db8:1:a001::1**. Эхо-запросы выполняются и из второй локальной сети.

        ```
        C:\>ping 2001:db8:1:a001::1

        Pinging 2001:DB8:1:A001::1 with 32 bytes of data:

        Reply from 2001:DB8:1:A001::1: bytes=32 time=2ms TTL=63
        Reply from 2001:DB8:1:A001::1: bytes=32 time=1ms TTL=63
        Reply from 2001:DB8:1:A001::1: bytes=32 time=1ms TTL=63
        Reply from 2001:DB8:1:A001::1: bytes=32 time=1ms TTL=63

        Ping statistics for 2001:DB8:1:A001::1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 2ms, Average = 1ms
        ```

        **Шаг 6.** В приложении «Командная строка» ноутбука Billing проверьте связь с сервером CAD командой **ping 2001:db8:1:2::4**. Эхо-запросы выполняются: узел сети коммутатора S1 связывается с сервером сети коммутатора S2 через маршрутизатор R1.

        ```
        C:\>ping 2001:db8:1:2::4

        Pinging 2001:DB8:1:2::4 with 32 bytes of data:

        Reply from 2001:DB8:1:2::4: bytes=32 time=3ms TTL=127
        Reply from 2001:DB8:1:2::4: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:1:2::4: bytes=32 time=1ms TTL=127
        Reply from 2001:DB8:1:2::4: bytes=32 time=1ms TTL=127

        Ping statistics for 2001:DB8:1:2::4:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 1ms, Maximum = 3ms, Average = 1ms
        ```
