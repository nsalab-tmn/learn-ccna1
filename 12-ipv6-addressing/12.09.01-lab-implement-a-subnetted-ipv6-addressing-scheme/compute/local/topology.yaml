    - title: "Начальное состояние"
      body: |
        - На маршрутизаторах R1 и R2 заданы имя устройства и статические маршруты IPv6 к локальным сетям другого маршрутизатора через интерфейс S0/0/0. Остальные параметры имеют значения по умолчанию: интерфейсы выключены, адресов IPv6 на них нет, маршрутизация IPv6 не включена.
        - На коммутаторах S1–S4 параметры имеют значения по умолчанию; настраивать их не нужно.
        - На компьютерах есть только локальный адрес канала, который компьютер создает сам. Глобального адреса IPv6 и шлюза по умолчанию у них нет.

        В начальном состоянии интерфейсы маршрутизатора R1 выключены и не имеют адресов IPv6 (**show ipv6 interface brief** в консоли R1):

        ```
        R1>enable
        R1#show ipv6 interface brief
        GigabitEthernet0/0     [administratively down/down]
            unassigned
        GigabitEthernet0/1     [administratively down/down]
            unassigned
        Serial0/0/0            [administratively down/down]
            unassigned
        Serial0/0/1            [administratively down/down]
            unassigned
        ```

        У компьютера PC1 нет глобального адреса и шлюза по умолчанию (**ipv6config** в приложении «Командная строка»), поэтому эхо-запрос к будущему адресу интерфейса G0/0 маршрутизатора R1 не отправляется:

        ```
        C:\>ipv6config

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: ::
           Default Gateway.................: ::
        C:\>ping 2001:db8:acad:c8::1

        Pinging 2001:DB8:ACAD:C8::1 with 32 bytes of data:

        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.
        PING: transmit failed. General failure.

        Ping statistics for 2001:DB8:ACAD:C8::1:
            Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),
        ```

        Это лабораторная работа на проверку навыков. Каждая из следующих страниц перечисляет требования к результату, а команды для их выполнения вы выбираете сами. Значения, отмеченные в таблицах знаком «?», вы определяете сами по требованиям.
    - title: "Планирование подсетей"
      body: |
        **Требование 1.** Каждой из пяти сетей назначена своя подсеть с длиной префикса /64. Подсети идут подряд: первая — 2001:db8:acad:c8::/64, а у каждой следующей идентификатор подсети (четвертый гекстет) на единицу больше, чем у предыдущей. Порядок сетей: локальная сеть интерфейса G0/0 маршрутизатора R1, локальная сеть G0/1 маршрутизатора R1, локальная сеть G0/0 маршрутизатора R2, локальная сеть G0/1 маршрутизатора R2, канал между маршрутизаторами R1 и R2.

        **Примечание.** Гекстет записывается в шестнадцатеричной системе счисления, поэтому при увеличении на единицу за цифрой 9 следуют цифры a, b, c, d, e и f.
    - title: "Настройка маршрутизаторов"
      body: |
        **Требование 2.** Интерфейсы G0/0 и G0/1 маршрутизаторов R1 и R2 имеют первый адрес узла подсети своей локальной сети с длиной префикса /64, как интерфейс G0/0 маршрутизатора R1 в таблице адресации.

        **Требование 3.** На канале между маршрутизаторами интерфейс S0/0/0 маршрутизатора R1 имеет первый адрес узла подсети канала, а интерфейс S0/0/0 маршрутизатора R2 — второй, оба с длиной префикса /64.

        **Требование 4.** На всех трех интерфейсах каждого маршрутизатора локальный адрес канала (link-local) задан вручную: fe80::1 на маршрутизаторе R1 и fe80::2 на маршрутизаторе R2.

        **Требование 5.** Интерфейсы G0/0, G0/1 и S0/0/0 обоих маршрутизаторов включены.

        **Требование 6.** На обоих маршрутизаторах включена маршрутизация одноадресного трафика IPv6 (IPv6 unicast routing).
    - title: "Настройка компьютеров"
      body: |
        **Требование 7.** На компьютерах PC1–PC4 включена автоматическая настройка IPv6 (IPv6 Auto Config): каждый компьютер сам получает глобальный индивидуальный адрес своей подсети и шлюз по умолчанию.

        **Примечание.** При автонастройке (SLAAC) компьютер берет префикс подсети из сообщений объявления маршрутизатора (RA), дополняет его своим идентификатором интерфейса и использует локальный адрес канала маршрутизатора как шлюз по умолчанию.
    - title: "Проверка связи"
      body: |
        После настройки подождите около 30 секунд: за это время порты коммутаторов, к которым подключены маршрутизаторы, переходят в состояние пересылки, и компьютеры получают объявления маршрутизатора. Затем проверьте результат.

        **Шаг 1.** В приложении «Командная строка» компьютера PC1 выведите настройки IPv6 командой **ipv6config**. Компьютер получил глобальный индивидуальный адрес из подсети 2001:db8:acad:c8::/64, а его шлюз по умолчанию — локальный адрес канала fe80::1 маршрутизатора R1.

        ```
        C:\>ipv6config

        FastEthernet0 Connection:(default port)

           Connection-specific DNS Suffix..: 
           Link-local IPv6 Address.........: FE80::2D0:84FF:FE55:DC01
           IPv6 Address....................: 2001:DB8:ACAD:C8:2D0:84FF:FE55:DC01/64
           Default Gateway.................: FE80::1
        ```

        **Шаг 2.** Проверьте связь с интерфейсом G0/0 маршрутизатора R1 командой **ping 2001:db8:acad:c8::1**. Маршрутизатор отвечает.

        ```
        C:\>ping 2001:db8:acad:c8::1

        Pinging 2001:DB8:ACAD:C8::1 with 32 bytes of data:

        Reply from 2001:DB8:ACAD:C8::1: bytes=32 time=1ms TTL=64
        Reply from 2001:DB8:ACAD:C8::1: bytes=32 time<1ms TTL=64
        Reply from 2001:DB8:ACAD:C8::1: bytes=32 time<1ms TTL=64
        Reply from 2001:DB8:ACAD:C8::1: bytes=32 time<1ms TTL=64

        Ping statistics for 2001:DB8:ACAD:C8::1:
            Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),
        Approximate round trip times in milli-seconds:
            Minimum = 0ms, Maximum = 1ms, Average = 0ms
        ```

        **Шаг 3.** Аналогично выведите настройки IPv6 компьютеров PC2, PC3 и PC4. Каждый компьютер получил адрес из подсети своей локальной сети, а его шлюз по умолчанию — локальный адрес канала своего маршрутизатора: fe80::1 у PC2, fe80::2 у PC3 и PC4.

        **Шаг 4.** С компьютера PC1 проверьте связь с компьютерами PC2, PC3 и PC4 по адресам, которые они получили. Каждый компьютер отвечает: пакеты между локальными сетями маршрутизаторов R1 и R2 проходят по последовательному каналу по статическим маршрутам.
